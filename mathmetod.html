\u0456\u043A \u2013 \u0431\u04B1\u0440\u044B\u043D \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u043D\u0493\u0430\u043D \u0437\u0430\u0442\u0442\u044B\u04A3 \u0431\u0435\u0439\u043D\u0435\u0441\u0456\u043D\u0456\u04A3 \u0441\u0430\u043D\u0430\u0434\u0430 \u049B\u0430\u0439\u0442\u0430 \u0436\u0430\u04A3\u0493\u044B\u0440\u0443\u044B. \u0411\u04B1\u043B \u04AF\u0448 \u0441\u0430\u0442\u044B \u0441\u0435\u0437\u0456\u043C\u0434\u0456\u043A \u0442\u0430\u043D\u0443 \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0430\u0434\u044B.","\u04B0\u0493\u044B\u043C \u0441\u0435\u0437\u0456\u043C\u0434\u0456\u043A \u0442\u0430\u043D\u0443\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D, \u043E\u0439\u043B\u0430\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u043F\u0430\u0439\u0434\u0430 \u0431\u043E\u043B\u0430\u0434\u044B. \u041E\u0439\u043B\u0430\u0443 \u0430\u043D\u0430\u043B\u0438\u0437, \u0441\u0438\u043D\u0442\u0435\u0437, \u0441\u0430\u043B\u044B\u0441\u0442\u044B\u0440\u0443, \u0430\u0431\u0441\u0442\u0440\u0430\u043A\u0446\u0438\u044F\u043B\u0430\u0443, \u0436\u0430\u043B\u043F\u044B\u043B\u0430\u0443 \u0441\u0438\u044F\u049B\u0442\u044B \u0430\u043C\u0430\u043B\u0434\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043D\u0456\u04A3 \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u0431\u04E9\u043B\u0456\u043F \u0430\u043B\u044B\u043F, \u043E\u043B\u0430\u0440\u0434\u044B \u0431\u0456\u0440 \u04B1\u0493\u044B\u043C\u0493\u0430 \u0431\u0456\u0440\u0456\u043A\u0442\u0456\u0440\u0435\u0434\u0456. \u0421\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u04B1\u0493\u044B\u043C \u0436\u0435\u043A\u0435 \u0437\u0430\u0442\u0442\u044B\u04A3 \u0435\u043C\u0435\u0441, \u0442\u04B1\u0442\u0430\u0441 \u0431\u0456\u0440 \u043A\u043B\u0430\u0441\u0441 \u0437\u0430\u0442\u0442\u0430\u0440\u0434\u044B\u04A3 \u043E\u0440\u0442\u0430\u049B \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u0431\u0435\u0439\u043D\u0435\u043B\u0435\u0439\u0434\u0456.","\u04D8\u0440\u0431\u0456\u0440 \u04B1\u0493\u044B\u043C \u043C\u0430\u0437\u043C\u04B1\u043D\u044B \u0436\u04D9\u043D\u0435 \u043A\u04E9\u043B\u0435\u043C\u0456 \u0430\u0440\u049B\u044B\u043B\u044B \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u043B\u0430\u0434\u044B. \u041C\u0430\u0437\u043C\u04B1\u043D \u2013 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u0431\u0430\u0440\u043B\u044B\u049B \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u0436\u0438\u044B\u043D\u0442\u044B\u0493\u044B, \u043A\u04E9\u043B\u0435\u043C \u2013 \u043E\u0441\u044B \u04B1\u0493\u044B\u043C\u0493\u0430 \u0436\u0430\u0442\u0430\u0442\u044B\u043D \u0431\u0430\u0440\u043B\u044B\u049B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440\u0434\u0456\u04A3 \u0436\u0438\u044B\u043D\u044B. \u041C\u0430\u0437\u043C\u04B1\u043D \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C \u0430\u0440\u0430\u0441\u044B\u043D\u0434\u0430 \u043A\u0435\u0440\u0456 \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441 \u0431\u0430\u0440: \u043C\u0430\u0437\u043C\u04B1\u043D\u0493\u0430 \u0436\u0430\u04A3\u0430 \u0431\u0435\u043B\u0433\u0456 \u049B\u043E\u0441\u0441\u0430\u049B, \u043A\u04E9\u043B\u0435\u043C \u0442\u0430\u0440\u044B\u043B\u0430\u0434\u044B."],definitions:[{term:"\u04B0\u0493\u044B\u043C",text:"\u0417\u0430\u0442\u0442\u0430\u0440 \u043C\u0435\u043D \u049B\u04B1\u0431\u044B\u043B\u044B\u0441\u0442\u0430\u0440\u0434\u044B\u04A3 \u0436\u0430\u043B\u043F\u044B \u0436\u04D9\u043D\u0435 \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u0431\u0435\u0439\u043D\u0435\u043B\u0435\u0439\u0442\u0456\u043D \u043E\u0439\u043B\u0430\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B."},{term:"\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B",text:"\u04B0\u0493\u044B\u043C\u0434\u0430 \u0431\u0435\u0439\u043D\u0435\u043B\u0435\u043D\u0433\u0435\u043D \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456\u04A3 \u0436\u0438\u044B\u043D\u0442\u044B\u0493\u044B."},{term:"\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456",text:"\u04B0\u0493\u044B\u043C\u0493\u0430 \u0436\u0430\u0442\u0430\u0442\u044B\u043D \u0431\u0430\u0440\u043B\u044B\u049B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440\u0434\u0456\u04A3 \u0436\u0438\u044B\u043D\u044B (\u043A\u043B\u0430\u0441\u044B)."},{term:"\u0422\u0435\u043A\u0442\u0456\u043A \u0436\u04D9\u043D\u0435 \u0442\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C",text:"\u041A\u04E9\u043B\u0435\u043C\u0456 \u0435\u043A\u0456\u043D\u0448\u0456 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0442\u043E\u043B\u044B\u049B \u049B\u0430\u043C\u0442\u0438\u0442\u044B\u043D \u04B1\u0493\u044B\u043C \u2013 \u0442\u0435\u043A\u0442\u0456\u043A, \u0430\u043B \u043E\u043D\u044B\u04A3 \u049B\u04B1\u0440\u0430\u043C\u044B\u043D\u0434\u0430\u0493\u044B \u04B1\u0493\u044B\u043C \u2013 \u0442\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C."}],formulas:[{expr:"\u0441\u0435\u0437\u0456\u043D\u0443 \u2192 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443 \u2192 \u0442\u04AF\u0441\u0456\u043D\u0456\u043A \u2192 \u04B1\u0493\u044B\u043C",note:"\u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0443 \u0441\u04AF\u043B\u0431\u0435\u0441\u0456"},{expr:"\u041C\u0430\u0437\u043C\u04B1\u043D \u2191  \u21D4  \u041A\u04E9\u043B\u0435\u043C \u2193",note:"\u043C\u0430\u0437\u043C\u04B1\u043D \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C\u043D\u0456\u04A3 \u043A\u0435\u0440\u0456 \u049B\u0430\u0442\u044B\u043D\u0430\u0441 \u0437\u0430\u04A3\u044B"},{expr:"\u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u2282 \u0440\u043E\u043C\u0431 \u2282 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u2282 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448",note:"\u043A\u04E9\u043B\u0435\u043C\u0434\u0435\u0440\u0434\u0456\u04A3 \u049B\u0430\u043C\u0442\u044B\u043B\u0443\u044B"}],figure:{type:"euler-genus",caption:"\u0422\u0435\u043A\u0442\u0456\u043A-\u0442\u04AF\u0440\u043B\u0456\u043A \u049B\u0430\u0442\u044B\u043D\u0430\u0441: \u04D9\u0440\u0431\u0456\u0440 \u0456\u0448\u043A\u0456 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456 \u0441\u044B\u0440\u0442\u049B\u044B\u0441\u044B\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D\u0456\u04A3 \u0431\u04E9\u043B\u0456\u0433\u0456."},examples:[{title:"\xAB\u041A\u0432\u0430\u0434\u0440\u0430\u0442\xBB \u04B1\u0493\u044B\u043C\u044B \u049B\u0430\u043B\u0430\u0439 \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0430\u0434\u044B?",text:"\u0411\u0430\u043B\u0430 \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456 \u0444\u0438\u0433\u0443\u0440\u0430\u043B\u0430\u0440 \u0430\u0440\u0430\u0441\u044B\u043D\u0430\u043D \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B \u0442\u0430\u0431\u0430\u0434\u044B (\u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443). \u04AE\u043B\u0433\u0456\u0441\u0456\u0437 \xAB\u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0441\u044B\u0437\xBB \u0442\u0430\u043F\u0441\u044B\u0440\u043C\u0430\u0441\u044B\u043D \u043E\u0440\u044B\u043D\u0434\u0430\u0439\u0434\u044B (\u0442\u04AF\u0441\u0456\u043D\u0456\u043A). \u041C\u04B1\u0493\u0430\u043B\u0456\u043C \xAB\u0442\u04E9\u0440\u0442 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u0441\u044B \u0442\u0435\u04A3, \u0431\u0430\u0440\u043B\u044B\u049B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0442\u0456\u043A\xBB \u0434\u0435\u0433\u0435\u043D \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456 \u0431\u04E9\u043B\u0456\u043F \u0430\u043B\u0493\u0430\u043D\u0434\u0430, \u0431\u0430\u043B\u0430 \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B \u0442\u04AF\u0441\u0456 \u043C\u0435\u043D \u04E9\u043B\u0448\u0435\u043C\u0456\u043D\u0435 \u049B\u0430\u0440\u0430\u043C\u0430\u0439 \u0442\u0430\u043D\u0438 \u0431\u0430\u0441\u0442\u0430\u0439\u0434\u044B \u2013 \u04B1\u0493\u044B\u043C \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0430\u0434\u044B."},{title:"\u041C\u0430\u0437\u043C\u04B1\u043D \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C",text:"\xAB\u041F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB \u04B1\u0493\u044B\u043C\u044B\u043D\u0430 \xAB\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0442\u0456\u043A\xBB \u0434\u0435\u0433\u0435\u043D \u0431\u0435\u043B\u0433\u0456\u043D\u0456 \u049B\u043E\u0441\u0441\u0430\u049B, \xAB\u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u0448\u044B\u0493\u0430\u0434\u044B. \u041C\u0430\u0437\u043C\u04B1\u043D \u043A\u0435\u04A3\u0435\u0439\u0434\u0456 (\u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456 \u049B\u043E\u0441\u044B\u043B\u0434\u044B), \u0430\u043B \u043A\u04E9\u043B\u0435\u043C \u0442\u0430\u0440\u044B\u043B\u0434\u044B: \u0431\u0430\u0440\u043B\u044B\u049B \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C, \u0431\u0456\u0440\u0430\u049B \u043A\u0435\u0440\u0456\u0441\u0456\u043D\u0448\u0435 \u0435\u043C\u0435\u0441."}],simple:"\u04B0\u0493\u044B\u043C \u2013 \u043E\u0439\u0434\u0430\u0493\u044B \xAB\u049B\u043E\u0440\u0430\u043F\xBB. \u049A\u043E\u0440\u0430\u043F\u049B\u0430 \u043A\u0456\u0440\u0443 \u0448\u0430\u0440\u0442\u044B \u2013 \u043C\u0430\u0437\u043C\u04B1\u043D, \u049B\u043E\u0440\u0430\u043F\u0442\u0430\u0493\u044B \u0437\u0430\u0442\u0442\u0430\u0440 \u2013 \u043A\u04E9\u043B\u0435\u043C. \u0428\u0430\u0440\u0442\u0442\u044B \u049B\u0430\u0442\u0430\u0439\u0442\u0441\u0430\u04A3, \u049B\u043E\u0440\u0430\u043F\u049B\u0430 \u0430\u0437 \u0437\u0430\u0442 \u0441\u0438\u044F\u0434\u044B.",life:"\u041A\u0456\u0442\u0430\u043F\u0445\u0430\u043D\u0430\u0434\u0430 \xAB\u043A\u0456\u0442\u0430\u043F\xBB \u0434\u0435\u0433\u0435\u043D \u04B1\u0493\u044B\u043C \u04E9\u0442\u0435 \u043A\u0435\u04A3. \xAB\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430 \u043A\u0456\u0442\u0430\u0431\u044B\xBB \u2013 \u0442\u0430\u0440\u044B\u0440\u0430\u049B, \xAB8-\u0441\u044B\u043D\u044B\u043F \u0433\u0435\u043E\u043C\u0435\u0442\u0440\u0438\u044F \u043E\u049B\u0443\u043B\u044B\u0493\u044B\xBB \u2013 \u043E\u0434\u0430\u043D \u0434\u0430 \u0442\u0430\u0440. \u04D8\u0440 \u0436\u043E\u043B\u044B \u0431\u0435\u043B\u0433\u0456 \u049B\u043E\u0441\u044B\u043B\u0430\u0434\u044B, \u0430\u043B \u0441\u04E9\u0440\u0435\u0434\u0435\u0433\u0456 \u043A\u0456\u0442\u0430\u043F\u0442\u0430\u0440 \u0441\u0430\u043D\u044B \u0430\u0437\u0430\u044F\u0434\u044B.",summary:"\u04B0\u0493\u044B\u043C \u0441\u0435\u0437\u0456\u043C\u0434\u0456\u043A \u0442\u0430\u043D\u0443 \u043C\u0435\u043D \u043E\u0439\u043B\u0430\u0443 \u0430\u043C\u0430\u043B\u0434\u0430\u0440\u044B \u0430\u0440\u049B\u044B\u043B\u044B \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0430\u0434\u044B, \u043C\u0430\u0437\u043C\u04B1\u043D\u044B \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C\u0456 \u0430\u0440\u049B\u044B\u043B\u044B \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u043B\u0430\u0434\u044B. \u04B0\u0493\u044B\u043C\u0434\u044B \u043C\u0435\u04A3\u0433\u0435\u0440\u0443 \u2013 \u043E\u043D\u044B\u04A3 \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u0431\u0456\u043B\u0456\u043F, \u043E\u043D\u044B \u0436\u0430\u04A3\u0430 \u0436\u0430\u0493\u0434\u0430\u0439\u0434\u0430 \u049B\u043E\u043B\u0434\u0430\u043D\u0430 \u0430\u043B\u0443."},{id:"t8-2",title:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B \u0435\u043D\u0434\u0456\u0440\u0443 \u0436\u043E\u043B\u0434\u0430\u0440\u044B",lead:"\u0416\u0430\u04A3\u0430 \u04B1\u0493\u044B\u043C\u0434\u044B \u0441\u0430\u0431\u0430\u049B\u049B\u0430 \u0435\u043A\u0456 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0436\u043E\u043B\u043C\u0435\u043D \u0435\u043D\u0433\u0456\u0437\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B: \u043C\u044B\u0441\u0430\u043B\u0434\u0430\u0440\u0434\u0430\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0493\u0430 \u043D\u0435\u043C\u0435\u0441\u0435 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0434\u0430\u043D \u043C\u044B\u0441\u0430\u043B\u0434\u0430\u0440\u0493\u0430.",theory:["\u041D\u0430\u049B\u0442\u044B-\u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B\u0434\u0430 \u043C\u04B1\u0493\u0430\u043B\u0456\u043C \u0430\u043B\u0434\u044B\u043C\u0435\u043D \u04B1\u0493\u044B\u043C\u0493\u0430 \u0436\u0430\u0442\u0430\u0442\u044B\u043D \u0436\u04D9\u043D\u0435 \u0436\u0430\u0442\u043F\u0430\u0439\u0442\u044B\u043D \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u043D\u0430\u049B\u0442\u044B \u043C\u044B\u0441\u0430\u043B\u0434\u044B \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0434\u0456. \u041E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u043E\u043B\u0430\u0440\u0434\u044B \u0441\u0430\u043B\u044B\u0441\u0442\u044B\u0440\u044B\u043F, \u043E\u0440\u0442\u0430\u049B \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456 \u0442\u0430\u0431\u0430\u0434\u044B, \u0441\u043E\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u0434\u0430\u043B\u0430\u0434\u044B. \u0411\u04B1\u043B \u0436\u043E\u043B \u0431\u0430\u0441\u0442\u0430\u0443\u044B\u0448 \u0436\u04D9\u043D\u0435 \u043E\u0440\u0442\u0430 \u0441\u044B\u043D\u044B\u043F\u0442\u0430\u0440\u0434\u0430 \u0442\u0438\u0456\u043C\u0434\u0456, \u043E\u049B\u0443\u0448\u044B\u043D\u044B\u04A3 \u0431\u0435\u043B\u0441\u0435\u043D\u0434\u0456\u043B\u0456\u0433\u0456\u043D \u0430\u0440\u0442\u0442\u044B\u0440\u0430\u0434\u044B.","\u0410\u0431\u0441\u0442\u0440\u0430\u043A\u0442\u0456\u043B\u0456-\u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B\u0434\u0430 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0431\u0456\u0440\u0434\u0435\u043D \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456, \u0441\u043E\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u043C\u044B\u0441\u0430\u043B\u0434\u0430\u0440 \u043C\u0435\u043D \u0436\u0430\u0442\u0442\u044B\u0493\u0443\u043B\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u0431\u0435\u043A\u0456\u0442\u0456\u043B\u0435\u0434\u0456. \u0411\u04B1\u043B \u0436\u043E\u043B \u0443\u0430\u049B\u044B\u0442\u0442\u044B \u04AF\u043D\u0435\u043C\u0434\u0435\u0439\u0434\u0456, \u0436\u043E\u0493\u0430\u0440\u044B \u0441\u044B\u043D\u044B\u043F\u0442\u0430\u0440\u0434\u0430 (\xAB\u043B\u043E\u0433\u0430\u0440\u0438\u0444\u043C\xBB, \xAB\u0442\u0443\u044B\u043D\u0434\u044B\xBB) \u0436\u0438\u0456 \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0434\u044B.","\u0411\u0430\u0440\u043B\u044B\u049B \u04B1\u0493\u044B\u043C \u0430\u043D\u044B\u049B\u0442\u0430\u043B\u043C\u0430\u0439\u0434\u044B. \u041D\u04AF\u043A\u0442\u0435, \u0442\u04AF\u0437\u0443, \u0436\u0430\u0437\u044B\u049B\u0442\u044B\u049B, \u0436\u0438\u044B\u043D \u2013 \u0430\u043D\u044B\u049B\u0442\u0430\u043B\u043C\u0430\u0439\u0442\u044B\u043D (\u0430\u043B\u0493\u0430\u0448\u049B\u044B) \u04B1\u0493\u044B\u043C\u0434\u0430\u0440; \u043E\u043B\u0430\u0440\u0434\u044B\u04A3 \u043C\u0430\u0493\u044B\u043D\u0430\u0441\u044B \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u0430\u0448\u044B\u043B\u0430\u0434\u044B. \u049A\u0430\u043B\u0493\u0430\u043D \u04B1\u0493\u044B\u043C\u0434\u0430\u0440 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0430\u0440\u049B\u044B\u043B\u044B \u0435\u043D\u0433\u0456\u0437\u0456\u043B\u0435\u0434\u0456. \u041C\u0435\u043A\u0442\u0435\u043F\u0442\u0435 \u0435\u04A3 \u0436\u0438\u0456 \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0442\u044B\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u2013 \xAB\u0435\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A + \u0442\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B\xBB \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430.","\u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0493\u0430 \u049B\u043E\u0439\u044B\u043B\u0430\u0442\u044B\u043D \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440: 1) \u04E9\u043B\u0448\u0435\u043C\u0434\u0435\u0441 \u0431\u043E\u043B\u0443\u044B (\u0430\u043D\u044B\u049B\u0442\u0430\u043B\u0430\u0442\u044B\u043D \u0436\u04D9\u043D\u0435 \u0430\u043D\u044B\u049B\u0442\u0430\u0443\u0448\u044B \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456 \u0442\u0435\u04A3); 2) \u0448\u0435\u04A3\u0431\u0435\u0440 \u0431\u043E\u043B\u043C\u0430\u0443\u044B; 3) \u0430\u043D\u044B\u049B \u0431\u043E\u043B\u0443\u044B; 4) \u0430\u0440\u0442\u044B\u049B \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440 \u0431\u043E\u043B\u043C\u0430\u0443\u044B."],definitions:[{term:"\u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430",text:"\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B\u043D \u0430\u0448\u044B\u043F, \u043E\u043D\u044B \u0431\u0430\u0441\u049B\u0430 \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u0430\u043D \u0430\u0436\u044B\u0440\u0430\u0442\u0443\u0493\u0430 \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A \u0431\u0435\u0440\u0435\u0442\u0456\u043D \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u0430\u043C\u0430\u043B."},{term:"\u0415\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A",text:"\u0411\u0435\u0440\u0456\u043B\u0433\u0435\u043D \u04B1\u0493\u044B\u043C\u0434\u044B \u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u049B\u0430\u043C\u0442\u0438\u0442\u044B\u043D, \u0430\u0440\u0430\u043B\u044B\u049B\u0442\u0430 \u0431\u0430\u0441\u049B\u0430 \u0442\u0435\u043A\u0442\u0456\u043A \u04B1\u0493\u044B\u043C\u044B \u0436\u043E\u049B \u04B1\u0493\u044B\u043C."},{term:"\u0422\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B",text:"\u0422\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C\u0434\u044B \u043E\u0441\u044B \u0442\u0435\u043A\u0442\u0456\u04A3 \u0431\u0430\u0441\u049B\u0430 \u0442\u04AF\u0440\u043B\u0435\u0440\u0456\u043D\u0435\u043D \u0430\u0436\u044B\u0440\u0430\u0442\u044B\u043F \u0442\u04B1\u0440\u0430\u0442\u044B\u043D \u0431\u0435\u043B\u0433\u0456."},{term:"\u0413\u0435\u043D\u0435\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430",text:"\u041E\u0431\u044A\u0435\u043A\u0442\u0456\u043D\u0456\u04A3 \u043F\u0430\u0439\u0434\u0430 \u0431\u043E\u043B\u0443, \u0441\u0430\u043B\u044B\u043D\u0443 \u0442\u04D9\u0441\u0456\u043B\u0456\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0442\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430."}],formulas:[{expr:"\u0410\u043D\u044B\u049B\u0442\u0430\u043B\u0430\u0442\u044B\u043D \u04B1\u0493\u044B\u043C = \u0415\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A + \u0422\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B",note:"\u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u043D\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0441\u04AF\u043B\u0431\u0435\u0441\u0456"},{expr:"\u0420\u043E\u043C\u0431 = \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C + \xAB\u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3\xBB",note:"\u043C\u044B\u0441\u0430\u043B"},{expr:"a\u2099\u208A\u2081 = a\u2099 + d",note:"\u0430\u0440\u0438\u0444\u043C\u0435\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043F\u0440\u043E\u0433\u0440\u0435\u0441\u0441\u0438\u044F\u043D\u044B\u04A3 \u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0441\u044B"}],figure:{type:"intro-ways",caption:"\u04B0\u0493\u044B\u043C\u0434\u044B \u0435\u043D\u0433\u0456\u0437\u0443\u0434\u0456\u04A3 \u0435\u043A\u0456 \u0436\u043E\u043B\u044B: \u043C\u044B\u0441\u0430\u043B\u0434\u0430\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0493\u0430 \u0436\u04D9\u043D\u0435 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0434\u0430\u043D \u043C\u044B\u0441\u0430\u043B\u0493\u0430."},examples:[{title:"\u041D\u0430\u049B\u0442\u044B-\u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B: \xAB\u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\xBB",text:"\u041E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0493\u0430 \u0434\u04D9\u043F\u0442\u0435\u0440 \u043F\u0430\u0440\u0430\u0493\u044B\u043D\u044B\u04A3 \u0431\u04B1\u0440\u044B\u0448\u044B, \u043A\u0456\u0442\u0430\u043F\u0442\u044B\u04A3 \u0431\u04B1\u0440\u044B\u0448\u044B, \u0441\u044B\u0437\u0493\u044B\u0448\u0442\u044B\u04A3 \u0431\u04B1\u0440\u044B\u0448\u044B \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043B\u0435\u0434\u0456. \u041E\u043B\u0430\u0440 \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u0438\u0440\u043C\u0435\u043D \u04E9\u043B\u0448\u0435\u043F, \u0431\u0430\u0440\u043B\u044B\u0493\u044B 90\xB0 \u0435\u043A\u0435\u043D\u0456\u043D \u0431\u0430\u0439\u049B\u0430\u0439\u0434\u044B. \u0421\u043E\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0436\u0430\u0437\u044B\u043B\u0430\u0434\u044B: \xAB90\xB0-\u049B\u0430 \u0442\u0435\u04A3 \u0431\u04B1\u0440\u044B\u0448 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448 \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0430\u0434\u044B\xBB."},{title:"\u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0434\u0430\u0493\u044B \u049B\u0430\u0442\u0435",text:"\xAB\u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0441\u044B \u04E9\u043B\u0448\u0435\u043C\u0434\u0435\u0441 \u0435\u043C\u0435\u0441: \u043E\u0493\u0430\u043D \u0440\u043E\u043C\u0431 \u0442\u0430 \u0436\u0430\u0442\u0430\u0434\u044B. \u0414\u04B1\u0440\u044B\u0441\u044B: \xAB\u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB."},{title:"\u0413\u0435\u043D\u0435\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430",text:"\u0422\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0431\u0456\u0440 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u0441\u044B\u043D\u044B\u04A3 \u0442\u04E9\u04A3\u0456\u0440\u0435\u0433\u0456\u043D\u0434\u0435 \u0430\u0439\u043D\u0430\u043B\u0434\u044B\u0440\u0493\u0430\u043D\u0434\u0430 \u043F\u0430\u0439\u0434\u0430 \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u0434\u0435\u043D\u0435 \u0446\u0438\u043B\u0438\u043D\u0434\u0440 \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0430\u0434\u044B."}],simple:"\u0418\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B \u2013 \xAB\u0430\u043B\u0434\u044B\u043C\u0435\u043D \u043A\u04E9\u0440, \u0441\u043E\u0441\u044B\u043D \u0435\u0440\u0435\u0436\u0435 \u0448\u044B\u0493\u0430\u0440\xBB. \u0414\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B \u2013 \xAB\u0430\u043B\u0434\u044B\u043C\u0435\u043D \u0435\u0440\u0435\u0436\u0435\u043D\u0456 \u0431\u0456\u043B, \u0441\u043E\u0441\u044B\u043D \u049B\u043E\u043B\u0434\u0430\u043D\xBB.",life:"\u0411\u0430\u043B\u0430\u043D\u044B \u0436\u0435\u043C\u0456\u0441\u043F\u0435\u043D \u0442\u0430\u043D\u044B\u0441\u0442\u044B\u0440\u0493\u0430\u043D\u0434\u0430 \u0430\u043B\u0434\u044B\u043C\u0435\u043D \u0430\u043B\u043C\u0430, \u0430\u043B\u043C\u04B1\u0440\u0442, \u04E9\u0440\u0456\u043A \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0441\u0456\u0437 \u2013 \u0431\u04B1\u043B \u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B. \u0410\u043B \u0441\u04E9\u0437\u0434\u0456\u043A\u0442\u0435 \xAB\u0436\u0435\u043C\u0456\u0441 \u2013 \u04E9\u0441\u0456\u043C\u0434\u0456\u043A\u0442\u0456\u04A3 \u0442\u04B1\u049B\u044B\u043C\u044B \u0431\u0430\u0440 \u0436\u04B1\u043C\u0441\u0430\u049B \u0431\u04E9\u043B\u0456\u0433\u0456\xBB \u0434\u0435\u043F \u0436\u0430\u0437\u044B\u043B\u0493\u0430\u043D \u2013 \u0431\u04B1\u043B \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B.",summary:"\u04B0\u0493\u044B\u043C\u0434\u044B \u0435\u043D\u0433\u0456\u0437\u0443 \u0436\u043E\u043B\u044B\u043D \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B\u04A3 \u0436\u0430\u0441\u044B \u043C\u0435\u043D \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04AF\u0440\u0434\u0435\u043B\u0456\u043B\u0456\u0433\u0456\u043D\u0435 \u049B\u0430\u0440\u0430\u0439 \u0442\u0430\u04A3\u0434\u0430\u0439\u0434\u044B. \u049A\u0430\u0439 \u0436\u043E\u043B\u043C\u0435\u043D \u0435\u043D\u0433\u0456\u0437\u0456\u043B\u0441\u0435 \u0434\u0435, \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u04E9\u043B\u0448\u0435\u043C\u0434\u0435\u0441, \u0430\u043D\u044B\u049B \u0436\u04D9\u043D\u0435 \u0448\u0435\u04A3\u0431\u0435\u0440\u0441\u0456\u0437 \u0431\u043E\u043B\u0443\u044B \u0442\u0438\u0456\u0441."},{id:"t8-3",title:"\u04B0\u0493\u044B\u043C\u0434\u0430\u0493\u044B \u0436\u0456\u043A\u0442\u0435\u0443 \u0436\u04D9\u043D\u0435 \u0431\u04E9\u043B\u0443 \u0430\u043C\u0430\u043B\u044B",lead:"\u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B\u043D \u0430\u0448\u0441\u0430, \u0431\u04E9\u043B\u0443 \u043C\u0435\u043D \u0436\u0456\u043A\u0442\u0435\u0443 \u043E\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0430\u0448\u0430\u0434\u044B.",theory:["\u0411\u04E9\u043B\u0443 \u2013 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u049B\u0430\u043D\u0434\u0430\u0439 \u0434\u0430 \u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456\u0441\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0431\u0456\u0440-\u0431\u0456\u0440\u0456\u043C\u0435\u043D \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0442\u044B\u043D \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u0440\u0433\u0435 \u0430\u0436\u044B\u0440\u0430\u0442\u0443. \u0411\u04E9\u043B\u0443\u0434\u0456\u04A3 \u04AF\u0448 \u044D\u043B\u0435\u043C\u0435\u043D\u0442\u0456 \u0431\u0430\u0440: \u0431\u04E9\u043B\u0456\u043D\u0435\u0442\u0456\u043D \u04B1\u0493\u044B\u043C (\u0442\u0435\u043A), \u0431\u04E9\u043B\u0443 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0456 (\u0442\u04AF\u0440\u043B\u0435\u0440) \u0436\u04D9\u043D\u0435 \u0431\u04E9\u043B\u0443 \u043D\u0435\u0433\u0456\u0437\u0456 (\u0431\u0435\u043B\u0433\u0456).","\u0416\u0456\u043A\u0442\u0435\u0443 \u2013 \u0431\u04E9\u043B\u0443\u0434\u0456\u04A3 \u0435\u0440\u0435\u043A\u0448\u0435 \u0442\u04AF\u0440\u0456. \u041C\u04B1\u043D\u0434\u0430 \u04B1\u0493\u044B\u043C \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u04AF\u0439\u0435\u043B\u0456 \u0442\u04AF\u0440\u0434\u0435, \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0434\u0435\u04A3\u0433\u0435\u0439\u0434\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456, \u0430\u043B \u04D9\u0440\u0431\u0456\u0440 \u0442\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C \u0436\u04AF\u0439\u0435\u0434\u0435 \u04E9\u0437\u0456\u043D\u0456\u04A3 \u0442\u04B1\u0440\u0430\u049B\u0442\u044B \u043E\u0440\u043D\u044B\u043D \u0430\u043B\u0430\u0434\u044B. \u041C\u044B\u0441\u0430\u043B\u044B, \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430, \u0430\u043B \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u043E\u0434\u0430\u043D \u04D9\u0440\u0456 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456.","\u0416\u0456\u043A\u0442\u0435\u0443 \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0493\u0430 \u04B1\u0493\u044B\u043C\u0434\u0430\u0440 \u0430\u0440\u0430\u0441\u044B\u043D\u0434\u0430\u0493\u044B \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u0442\u044B \u043A\u04E9\u0440\u0443\u0433\u0435, \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456 \u043C\u0435\u043D \u049B\u0430\u0441\u0438\u0435\u0442\u0442\u0435\u0440\u0456\u043D \u0430\u0436\u044B\u0440\u0430\u0442\u0443\u0493\u0430, \u0431\u0456\u043B\u0456\u043C\u0434\u0456 \u0436\u04AF\u0439\u0435\u043B\u0435\u0443\u0433\u0435 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456. \u0416\u0456\u043A\u0442\u0435\u0443 \u043D\u04D9\u0442\u0438\u0436\u0435\u0441\u0456 \u043A\u04E9\u0431\u0456\u043D\u0435 \u0430\u0493\u0430\u0448 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456 \u0441\u04AF\u043B\u0431\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456."],definitions:[{term:"\u0411\u04E9\u043B\u0443",text:"\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0431\u0435\u043B\u0433\u0456\u043B\u0456 \u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456\u0441\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0442\u044B\u043D \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u0440\u0433\u0435 \u0430\u0436\u044B\u0440\u0430\u0442\u0443."},{term:"\u0411\u04E9\u043B\u0443 \u043D\u0435\u0433\u0456\u0437\u0456",text:"\u0411\u04E9\u043B\u0443 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0442\u0456\u043D \u0431\u0435\u043B\u0433\u0456."},{term:"\u0416\u0456\u043A\u0442\u0435\u0443 (\u043A\u043B\u0430\u0441\u0441\u0438\u0444\u0438\u043A\u0430\u0446\u0438\u044F)",text:"\u04B0\u0493\u044B\u043C \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0431\u0456\u0440\u0456\u0437\u0434\u0456, \u043A\u04E9\u043F \u0434\u0435\u04A3\u0433\u0435\u0439\u043B\u0456 \u0436\u04AF\u0439\u0435\u0433\u0435 \u0431\u04E9\u043B\u0443."}],formulas:[{expr:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 = \u0421\u04AF\u0439\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u222A \u0422\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u222A \u0414\u043E\u0493\u0430\u043B \u0431\u04B1\u0440\u044B\u0448\u0442\u044B",note:"\u0431\u04E9\u043B\u0443 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u0431\u0456\u0440\u0456\u0433\u0443\u0456 \u2013 \u0431\u04AF\u043A\u0456\u043B \u0442\u0435\u043A"},{expr:"\u0421\u04AF\u0439\u0456\u0440 \u2229 \u0422\u0456\u043A = \u2205,  \u0422\u0456\u043A \u2229 \u0414\u043E\u0493\u0430\u043B = \u2205",note:"\u043C\u04AF\u0448\u0435\u043B\u0435\u0440 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0434\u044B"}],figure:{type:"triangle-tree",caption:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u0434\u044B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443."},examples:[{title:"\u0411\u04E9\u043B\u0443 \u044D\u043B\u0435\u043C\u0435\u043D\u0442\u0442\u0435\u0440\u0456",text:"\u0411\u04E9\u043B\u0456\u043D\u0435\u0442\u0456\u043D \u04B1\u0493\u044B\u043C \u2013 \xAB\u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\xBB; \u0431\u04E9\u043B\u0443 \u043D\u0435\u0433\u0456\u0437\u0456 \u2013 \u0435\u04A3 \u04AF\u043B\u043A\u0435\u043D \u0431\u04B1\u0440\u044B\u0448\u044B\u043D\u044B\u04A3 \u0448\u0430\u043C\u0430\u0441\u044B; \u0431\u04E9\u043B\u0443 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0456 \u2013 \u0441\u04AF\u0439\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u044B (\u0431\u0430\u0440\u043B\u044B\u049B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B < 90\xB0), \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B (\u0431\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u044B = 90\xB0), \u0434\u043E\u0493\u0430\u043B \u0431\u04B1\u0440\u044B\u0448\u0442\u044B (\u0431\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u044B > 90\xB0)."},{title:"\u0415\u043A\u0456 \u0434\u0435\u04A3\u0433\u0435\u0439\u043B\u0456 \u0436\u0456\u043A\u0442\u0435\u0443",text:"\u0422\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u04E9\u0437 \u043A\u0435\u0437\u0435\u0433\u0456\u043D\u0434\u0435 \u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0436\u04D9\u043D\u0435 \u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u0435\u043C\u0435\u0441 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0431\u043E\u043B\u044B\u043F \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. \u041E\u0441\u044B\u043B\u0430\u0439\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443 \u0436\u04AF\u0439\u0435\u0441\u0456 \u043F\u0430\u0439\u0434\u0430 \u0431\u043E\u043B\u0430\u0434\u044B."}],simple:"\u0411\u04E9\u043B\u0443 \u2013 \u0442\u043E\u0440\u0442\u0442\u044B \u043A\u0435\u0441\u0443: \u04D9\u0440 \u0431\u04E9\u043B\u0456\u043A \u0431\u04E9\u043B\u0435\u043A, \u0431\u0456\u0440\u0430\u049B \u0431\u04D9\u0440\u0456\u043D \u049B\u043E\u0441\u0441\u0430\u04A3, \u0431\u04AF\u043A\u0456\u043B \u0442\u043E\u0440\u0442 \u0448\u044B\u0493\u0430\u0434\u044B.",life:"\u0414\u04AF\u043A\u0435\u043D\u0434\u0435 \u0442\u0430\u0443\u0430\u0440\u043B\u0430\u0440 \u0431\u04E9\u043B\u0456\u043C\u0434\u0435\u0440\u0433\u0435 (\u0442\u0430\u0493\u0430\u043C, \u043A\u0438\u0456\u043C, \u0442\u0435\u0445\u043D\u0438\u043A\u0430), \u0431\u04E9\u043B\u0456\u043C\u0434\u0435\u0440 \u0441\u04E9\u0440\u0435\u043B\u0435\u0440\u0433\u0435 \u0436\u0456\u043A\u0442\u0435\u043B\u0435\u0434\u0456. \u04D8\u0440 \u0442\u0430\u0443\u0430\u0440\u0434\u044B\u04A3 \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u0442\u04B1\u0440\u0430\u049B\u0442\u044B \u043E\u0440\u043D\u044B \u0431\u0430\u0440 \u2013 \u0431\u04B1\u043B \u0436\u0430\u049B\u0441\u044B \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0456\u04A3 \u0431\u0435\u043B\u0433\u0456\u0441\u0456.",summary:"\u0411\u04E9\u043B\u0443 \u043C\u0435\u043D \u0436\u0456\u043A\u0442\u0435\u0443 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0430\u0448\u0430\u0434\u044B. \u0416\u0456\u043A\u0442\u0435\u0443\u0434\u0456\u04A3 \u0435\u0440\u0435\u043A\u0448\u0435\u043B\u0456\u0433\u0456 \u2013 \u043E\u043D\u044B\u04A3 \u0436\u04AF\u0439\u0435\u043B\u0456\u043B\u0456\u0433\u0456 \u043C\u0435\u043D \u043A\u04E9\u043F \u0434\u0435\u04A3\u0433\u0435\u0439\u043B\u0456\u043B\u0456\u0433\u0456."},{id:"t8-4",title:"\u0422\u04AF\u0440\u043B\u0456\u043A \u04E9\u0437\u0433\u0435\u0440\u0456\u0441 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443",lead:"\u0411\u0456\u0440 \u0431\u0435\u043B\u0433\u0456\u043D\u0456\u04A3 \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456 \u043C\u04D9\u043D\u0434\u0435\u0440\u0456 \u04B1\u0493\u044B\u043C\u0434\u044B \u0435\u043A\u0456 \u043D\u0435\u043C\u0435\u0441\u0435 \u043E\u0434\u0430\u043D \u0434\u0430 \u043A\u04E9\u043F \u0442\u04AF\u0440\u0433\u0435 \u0431\u04E9\u043B\u0435\u0434\u0456.",theory:["\u0422\u04AF\u0440\u043B\u0456\u043A \u04E9\u0437\u0433\u0435\u0440\u0456\u0441\u0442\u0435\u0433\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0435 \u0431\u04E9\u043B\u0443 \u043D\u0435\u0433\u0456\u0437\u0456\u043D\u0435 \u0430\u043B\u044B\u043D\u0493\u0430\u043D \u0431\u0435\u043B\u0433\u0456 \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456 \u043C\u04D9\u043D\u0434\u0435\u0440 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0439\u0434\u044B, \u0430\u043B \u04D9\u0440\u0431\u0456\u0440 \u043C\u04D9\u043D \u0431\u0456\u0440 \u0442\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C\u0434\u044B \u0430\u043D\u044B\u049B\u0442\u0430\u0439\u0434\u044B. \u041C\u044B\u0441\u0430\u043B\u044B, \u0442\u0435\u04A3\u0434\u0435\u0443\u043B\u0435\u0440\u0434\u0456 \u0431\u0435\u043B\u0433\u0456\u0441\u0456\u0437\u0434\u0456\u04A3 \u0434\u04D9\u0440\u0435\u0436\u0435\u0441\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0431\u0456\u0440\u0456\u043D\u0448\u0456, \u0435\u043A\u0456\u043D\u0448\u0456, \u04AF\u0448\u0456\u043D\u0448\u0456 \u0434\u04D9\u0440\u0435\u0436\u0435\u043B\u0456 \u0434\u0435\u043F \u0431\u04E9\u043B\u0435\u043C\u0456\u0437.","\u041C\u04B1\u043D\u0434\u0430\u0439 \u0436\u0456\u043A\u0442\u0435\u0443 \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0431\u0435\u043B\u0433\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0431\u0456\u0440 \u043C\u0435\u0437\u0433\u0456\u043B\u0434\u0435 \u0434\u0435 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0443\u0456 \u043C\u04AF\u043C\u043A\u0456\u043D. \u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443\u043B\u0435\u0440 b \u043C\u0435\u043D c \u043A\u043E\u044D\u0444\u0444\u0438\u0446\u0438\u0435\u043D\u0442\u0442\u0435\u0440\u0456\u043D\u0456\u04A3 \u043D\u04E9\u043B\u0433\u0435 \u0442\u0435\u04A3 \u0431\u043E\u043B\u0443-\u0431\u043E\u043B\u043C\u0430\u0443\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0442\u043E\u043B\u044B\u049B \u0436\u04D9\u043D\u0435 \u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0431\u043E\u043B\u044B\u043F \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456, \u0430\u043B a = 1 \u0431\u043E\u043B\u0441\u0430, \u043A\u0435\u043B\u0442\u0456\u0440\u0456\u043B\u0433\u0435\u043D \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443 \u0448\u044B\u0493\u0430\u0434\u044B.","\u0416\u0456\u043A\u0442\u0435\u0443 \u043D\u0435\u0433\u0456\u0437\u0456 \u043E\u0431\u044A\u0435\u043A\u0442\u0438\u0432\u0442\u0456 \u0431\u0435\u043B\u0433\u0456 \u0431\u043E\u043B\u0443\u044B \u043A\u0435\u0440\u0435\u043A. \xAB\u041E\u04A3\u0430\u0439 \u0435\u0441\u0435\u043F\xBB \u043F\u0435\u043D \xAB\u049B\u0438\u044B\u043D \u0435\u0441\u0435\u043F\xBB \u0434\u0435\u043F \u0431\u04E9\u043B\u0443 \u0434\u04B1\u0440\u044B\u0441 \u0435\u043C\u0435\u0441, \u0441\u0435\u0431\u0435\u0431\u0456 \u0431\u04B1\u043B \u0431\u0435\u043B\u0433\u0456 \u0441\u0443\u0431\u044A\u0435\u043A\u0442\u0438\u0432\u0442\u0456: \u0431\u0456\u0440 \u043E\u049B\u0443\u0448\u044B\u0493\u0430 \u043E\u04A3\u0430\u0439 \u0435\u0441\u0435\u043F \u0435\u043A\u0456\u043D\u0448\u0456\u0441\u0456\u043D\u0435 \u049B\u0438\u044B\u043D \u0431\u043E\u043B\u0443\u044B \u043C\u04AF\u043C\u043A\u0456\u043D."],definitions:[{term:"\u0422\u04AF\u0440\u043B\u0456\u043A \u04E9\u0437\u0433\u0435\u0440\u0456\u0441\u0442\u0435\u0433\u0456 \u0431\u0435\u043B\u0433\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443",text:"\u0411\u04E9\u043B\u0443 \u043D\u0435\u0433\u0456\u0437\u0456 \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u0431\u0435\u043B\u0433\u0456\u043D\u0456\u04A3 \u04D9\u0440 \u043C\u04D9\u043D\u0456 \u0431\u0456\u0440 \u0442\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C\u0434\u044B \u0430\u043D\u044B\u049B\u0442\u0430\u0439\u0442\u044B\u043D \u0436\u0456\u043A\u0442\u0435\u0443."},{term:"\u0422\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443",text:"b = 0 \u043D\u0435\u043C\u0435\u0441\u0435 c = 0 (\u043D\u0435\u043C\u0435\u0441\u0435 \u0435\u043A\u0435\u0443\u0456 \u0434\u0435 \u043D\u04E9\u043B) \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443."}],formulas:[{expr:"ax\xB2 + bx + c = 0,  a \u2260 0",note:"\u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443\u0434\u0456\u04A3 \u0436\u0430\u043B\u043F\u044B \u0442\u04AF\u0440\u0456"},{expr:"ax\xB2 + c = 0,  ax\xB2 + bx = 0,  ax\xB2 = 0",note:"\u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443\u043B\u0435\u0440"},{expr:"x\xB2 + px + q = 0",note:"\u043A\u0435\u043B\u0442\u0456\u0440\u0456\u043B\u0433\u0435\u043D \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443 (a = 1)"},{expr:"f(\u2212x) = f(x) \u2013 \u0436\u04B1\u043F;  f(\u2212x) = \u2212f(x) \u2013 \u0442\u0430\u049B",note:"\u0444\u0443\u043D\u043A\u0446\u0438\u044F\u043B\u0430\u0440\u0434\u044B \u0436\u04B1\u043F\u0442\u044B\u0493\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443"}],figure:{type:"quadratic-tree",caption:"\u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443\u043B\u0435\u0440\u0434\u0456 \u043A\u043E\u044D\u0444\u0444\u0438\u0446\u0438\u0435\u043D\u0442\u0442\u0435\u0440\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443."},examples:[{title:"\u0424\u0443\u043D\u043A\u0446\u0438\u044F\u043B\u0430\u0440\u0434\u044B \u0436\u0456\u043A\u0442\u0435\u0443",text:"\u0416\u0456\u043A\u0442\u0435\u0443 \u043D\u0435\u0433\u0456\u0437\u0456 \u2013 \u0436\u04B1\u043F\u0442\u044B\u049B. y = x\xB2 \u2013 \u0436\u04B1\u043F, y = x\xB3 \u2013 \u0442\u0430\u049B, y = x + 1 \u2013 \u0436\u04B1\u043F \u0442\u0430, \u0442\u0430\u049B \u0442\u0430 \u0435\u043C\u0435\u0441. \u04AE\u0448 \u0442\u04AF\u0440 \u0448\u044B\u0493\u0430\u0434\u044B, \u0441\u0435\u0431\u0435\u0431\u0456 \u0431\u0435\u043B\u0433\u0456 \u04AF\u0448 \u043C\u04D9\u043D \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0439\u0434\u044B."},{title:"\u0422\u0435\u04A3\u0434\u0435\u0443\u0434\u0456 \u0430\u043D\u044B\u049B\u0442\u0430\u0443",text:"3x\xB2 \u2212 12 = 0 \u0442\u0435\u04A3\u0434\u0435\u0443\u0456\u043D\u0434\u0435 b = 0, c \u2260 0, \u0434\u0435\u043C\u0435\u043A \u043E\u043B ax\xB2 + c = 0 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456 \u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0442\u0435\u04A3\u0434\u0435\u0443: x = \xB12."}],simple:"\u0411\u0456\u0440 \u0441\u04B1\u0440\u0430\u049B \u049B\u043E\u044F\u043C\u044B\u0437 (\xAB\u0434\u04D9\u0440\u0435\u0436\u0435\u0441\u0456 \u049B\u0430\u043D\u0434\u0430\u0439?\xBB), \u0430\u043B \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456 \u0436\u0430\u0443\u0430\u043F \u2013 \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456 \u0442\u043E\u043F.",life:"\u041C\u0435\u043A\u0442\u0435\u043F \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u044B\u043D \u0441\u044B\u043D\u044B\u0431\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 (1, 2, \u2026, 11-\u0441\u044B\u043D\u044B\u043F) \u0431\u04E9\u043B\u0443 \u2013 \u0442\u04AF\u0440\u043B\u0456\u043A \u04E9\u0437\u0433\u0435\u0440\u0456\u0441 \u0431\u0435\u043B\u0433\u0456\u0441\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443: \u0431\u0435\u043B\u0433\u0456 \u0431\u0456\u0440\u0435\u0443 (\u0441\u044B\u043D\u044B\u043F \u043D\u04E9\u043C\u0456\u0440\u0456), \u0430\u043B \u043C\u04D9\u043D\u0434\u0435\u0440\u0456 \u043A\u04E9\u043F.",summary:"\u0422\u04AF\u0440\u043B\u0456\u043A \u04E9\u0437\u0433\u0435\u0440\u0456\u0441 \u0431\u0435\u043B\u0433\u0456\u0441\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0435 \u0431\u0435\u043B\u0433\u0456\u043D\u0456\u04A3 \u04D9\u0440 \u043C\u04D9\u043D\u0456 \u0431\u0456\u0440 \u0442\u04AF\u0440\u0434\u0456 \u0431\u0435\u0440\u0435\u0434\u0456. \u0411\u0435\u043B\u0433\u0456 \u043E\u0431\u044A\u0435\u043A\u0442\u0438\u0432\u0442\u0456 \u0431\u043E\u043B\u0443\u044B \u0448\u0430\u0440\u0442."},{id:"t8-5",title:"\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043B\u044B\u049B \u0436\u0456\u043A\u0442\u0435\u0443",lead:"\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u2013 \xAB\u0435\u043A\u0456\u0433\u0435 \u0431\u04E9\u043B\u0443\xBB: \u04B1\u0493\u044B\u043C \u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456\u043D\u0456\u04A3 \u0431\u0430\u0440-\u0436\u043E\u0493\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0435\u043A\u0456 \u049B\u0430\u0439\u0448\u044B \u04B1\u0493\u044B\u043C\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456.",theory:["\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u0433\u0440\u0435\u043A\u0442\u0456\u04A3 dicha (\xAB\u0435\u043A\u0456\u0433\u0435\xBB) \u0436\u04D9\u043D\u0435 tom\u0113 (\xAB\u043A\u0435\u0441\u0443\xBB) \u0441\u04E9\u0437\u0434\u0435\u0440\u0456\u043D\u0435\u043D \u0448\u044B\u049B\u049B\u0430\u043D. \u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043B\u044B\u049B \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0435 \u04B1\u0493\u044B\u043C \xABA\xBB \u0436\u04D9\u043D\u0435 \xABA \u0435\u043C\u0435\u0441\xBB \u0434\u0435\u0433\u0435\u043D \u0435\u043A\u0456 \u049B\u0430\u0439\u0448\u044B \u04B1\u0493\u044B\u043C\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. \u041C\u044B\u0441\u0430\u043B\u044B, \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0436\u04D9\u043D\u0435 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0435\u043C\u0435\u0441 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0431\u043E\u043B\u044B\u043F \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456.","\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043D\u044B\u04A3 \u0430\u0440\u0442\u044B\u049B\u0448\u044B\u043B\u044B\u0493\u044B \u2013 \u043E\u043B \u04D9\u0440\u049B\u0430\u0448\u0430\u043D \u0442\u043E\u043B\u044B\u049B \u0436\u04D9\u043D\u0435 \u043E\u043D\u044B\u04A3 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0456 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0434\u044B, \u044F\u0493\u043D\u0438 \u0436\u0456\u043A\u0442\u0435\u0443 \u0435\u0440\u0435\u0436\u0435\u043B\u0435\u0440\u0456 \u04E9\u0437\u0434\u0456\u0433\u0456\u043D\u0435\u043D \u0441\u0430\u049B\u0442\u0430\u043B\u0430\u0434\u044B. \u041A\u0435\u043C\u0448\u0456\u043B\u0456\u0433\u0456 \u2013 \xABA \u0435\u043C\u0435\u0441\xBB \u0431\u04E9\u043B\u0456\u0433\u0456\u043D\u0456\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B \u0430\u043D\u044B\u049B \u0435\u043C\u0435\u0441, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u043E\u043D\u044B \u04D9\u0440\u0456 \u049B\u0430\u0440\u0430\u0439 \u0436\u0456\u043A\u0442\u0435\u0443 \u043A\u0435\u0440\u0435\u043A.","\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043D\u044B \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0440\u0435\u0442 \u049B\u0430\u0439\u0442\u0430\u043B\u0430\u043F, \u0442\u0435\u0440\u0435\u04A3\u0456\u0440\u0435\u043A \u0436\u0456\u043A\u0442\u0435\u0443 \u0430\u043B\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0434\u044B. \u041C\u0435\u043A\u0442\u0435\u043F \u043A\u0443\u0440\u0441\u044B\u043D\u0434\u0430\u0493\u044B \u043D\u0430\u049B\u0442\u044B \u0441\u0430\u043D\u0434\u0430\u0440\u0434\u044B\u04A3 \u0436\u0456\u043A\u0442\u0435\u043B\u0443\u0456 \u043E\u0441\u044B\u043D\u044B\u04A3 \u043C\u044B\u0441\u0430\u043B\u044B.","\u0415\u0441\u043A\u0435\u0440\u0442\u0443: \xAB\u043E\u04A3 \u0436\u04D9\u043D\u0435 \u0442\u0435\u0440\u0456\u0441 \u0441\u0430\u043D\u0434\u0430\u0440\xBB \u0434\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u0435\u043C\u0435\u0441, \u0441\u0435\u0431\u0435\u0431\u0456 0 \u0435\u0448\u0431\u0456\u0440 \u0442\u043E\u043F\u049B\u0430 \u0435\u043D\u0431\u0435\u0439 \u049B\u0430\u043B\u0430\u0434\u044B. \u0414\u04B1\u0440\u044B\u0441\u044B: \xAB\u043E\u04A3 \u0436\u04D9\u043D\u0435 \u043E\u04A3 \u0435\u043C\u0435\u0441\xBB."],definitions:[{term:"\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043B\u044B\u049B \u0436\u0456\u043A\u0442\u0435\u0443",text:"\u04B0\u0493\u044B\u043C\u0434\u044B \u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456\u043D\u0456\u04A3 \u0431\u0430\u0440-\u0436\u043E\u0493\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \xABA\xBB \u0436\u04D9\u043D\u0435 \xABA \u0435\u043C\u0435\u0441\xBB \u0434\u0435\u0433\u0435\u043D \u0435\u043A\u0456 \u049B\u0430\u0439\u0448\u044B \u04B1\u0493\u044B\u043C\u0493\u0430 \u0431\u04E9\u043B\u0443."},{term:"\u0422\u0435\u0440\u0456\u0441\u0442\u0435\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0430\u043B\u044B\u043D\u0493\u0430\u043D \u04B1\u0493\u044B\u043C",text:"\u0411\u0435\u043B\u0433\u0456\u043D\u0456\u04A3 \u0436\u043E\u049B\u0442\u044B\u0493\u044B\u043C\u0435\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043B\u0430\u0442\u044B\u043D \xABA \u0435\u043C\u0435\u0441\xBB \u04B1\u0493\u044B\u043C\u044B."}],formulas:[{expr:"U = A \u222A \u0100,   A \u2229 \u0100 = \u2205",note:"\u0434\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043D\u044B\u04A3 \u0436\u0438\u044B\u043D\u0434\u0430\u0440 \u0442\u0456\u043B\u0456\u043D\u0434\u0435\u0433\u0456 \u0436\u0430\u0437\u044B\u043B\u0443\u044B"},{expr:"\u211D = \u211A \u222A (\u211D \\ \u211A)",note:"\u043D\u0430\u049B\u0442\u044B \u0441\u0430\u043D\u0434\u0430\u0440: \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0436\u04D9\u043D\u0435 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0435\u043C\u0435\u0441 (\u0438\u0440\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B)"},{expr:"\u211A = \u2124 \u222A (\u211A \\ \u2124)",note:"\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0441\u0430\u043D\u0434\u0430\u0440: \u0431\u04AF\u0442\u0456\u043D \u0436\u04D9\u043D\u0435 \u0431\u04E9\u043B\u0448\u0435\u043A"}],figure:{type:"number-dichotomy",caption:"\u041D\u0430\u049B\u0442\u044B \u0441\u0430\u043D\u0434\u0430\u0440\u0434\u044B \u0434\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u0430\u0440\u049B\u044B\u043B\u044B \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0434\u0435\u04A3\u0433\u0435\u0439\u0434\u0435 \u0436\u0456\u043A\u0442\u0435\u0443."},examples:[{title:"\u041D\u0430\u049B\u0442\u044B \u0441\u0430\u043D\u0434\u0430\u0440",text:"\u211D \u2192 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B / \u0438\u0440\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B; \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u2192 \u0431\u04AF\u0442\u0456\u043D / \u0431\u04E9\u043B\u0448\u0435\u043A; \u0431\u04AF\u0442\u0456\u043D \u2192 \u043D\u0430\u0442\u0443\u0440\u0430\u043B / \u043D\u0430\u0442\u0443\u0440\u0430\u043B \u0435\u043C\u0435\u0441 (0 \u0436\u04D9\u043D\u0435 \u0442\u0435\u0440\u0456\u0441 \u0431\u04AF\u0442\u0456\u043D \u0441\u0430\u043D\u0434\u0430\u0440). \u04D8\u0440 \u049B\u0430\u0434\u0430\u043C\u0434\u0430 \u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456 \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u043B\u0435\u0434\u0456."},{title:"\u049A\u0430\u0442\u0435 \u0434\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F",text:"\xAB\u0411\u04AF\u0442\u0456\u043D \u0441\u0430\u043D\u0434\u0430\u0440 \u043E\u04A3 \u0436\u04D9\u043D\u0435 \u0442\u0435\u0440\u0456\u0441 \u0431\u043E\u043B\u0430\u0434\u044B\xBB \u2013 \u049B\u0430\u0442\u0435, 0 \u049B\u0430\u043B\u044B\u043F \u049B\u043E\u0439\u0434\u044B. \u0414\u04B1\u0440\u044B\u0441\u044B: \xAB\u043E\u04A3 \u0431\u04AF\u0442\u0456\u043D \u0441\u0430\u043D\u0434\u0430\u0440 \u0436\u04D9\u043D\u0435 \u043E\u04A3 \u0435\u043C\u0435\u0441 \u0431\u04AF\u0442\u0456\u043D \u0441\u0430\u043D\u0434\u0430\u0440\xBB."}],simple:"\u04D8\u0440 \u049B\u0430\u0434\u0430\u043C\u0434\u0430 \u0442\u0435\u043A \xAB\u0438\u04D9\xBB \u043D\u0435\u043C\u0435\u0441\u0435 \xAB\u0436\u043E\u049B\xBB \u0434\u0435\u043F \u0436\u0430\u0443\u0430\u043F \u0431\u0435\u0440\u0435\u0442\u0456\u043D \u0441\u04B1\u0440\u0430\u049B \u049B\u043E\u044F\u043C\u044B\u0437.",life:"\u041E\u0439\u044B\u043D: \xAB\u041E\u0439\u044B\u043C\u0434\u0430\u0493\u044B \u0436\u0430\u043D\u0443\u0430\u0440\u0434\u044B \u0442\u0430\u043F\xBB. \u0421\u04B1\u0440\u0430\u049B\u0442\u0430\u0440: \xAB\u041E\u043B \u0441\u04AF\u0442\u049B\u043E\u0440\u0435\u043A\u0442\u0456 \u043C\u0435?\xBB \u2013 \xAB\u0418\u04D9\xBB. \xAB\u041E\u043B \u04AF\u0439 \u0436\u0430\u043D\u0443\u0430\u0440\u044B \u043C\u0430?\xBB \u2013 \xAB\u0416\u043E\u049B\xBB. \u04D8\u0440 \u0436\u0430\u0443\u0430\u043F \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A\u0442\u0435\u0440\u0434\u0456 \u0435\u043A\u0456\u0433\u0435 \u0431\u04E9\u043B\u0435\u0434\u0456 \u2013 \u0431\u04B1\u043B \u0434\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F.",summary:"\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u04D9\u0440\u049B\u0430\u0448\u0430\u043D \u0442\u043E\u043B\u044B\u049B \u04D9\u0440\u0456 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0442\u044B\u043D \u0436\u0456\u043A\u0442\u0435\u0443 \u0431\u0435\u0440\u0435\u0434\u0456, \u0431\u0456\u0440\u0430\u049B \xABA \u0435\u043C\u0435\u0441\xBB \u0431\u04E9\u043B\u0456\u0433\u0456\u043D \u04D9\u0440\u0456 \u049B\u0430\u0440\u0430\u0439 \u043D\u0430\u049B\u0442\u044B\u043B\u0430\u0443 \u049B\u0430\u0436\u0435\u0442."},{id:"t8-6",title:"\u0416\u0456\u043A\u0442\u0435\u0443 \u0435\u0440\u0435\u0436\u0435\u043B\u0435\u0440\u0456",lead:"\u0416\u0456\u043A\u0442\u0435\u0443 \u0434\u04B1\u0440\u044B\u0441 \u0431\u043E\u043B\u0443\u044B \u04AF\u0448\u0456\u043D \u0431\u0435\u0441 \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u0435\u0440\u0435\u0436\u0435 \u0441\u0430\u049B\u0442\u0430\u043B\u0443\u044B \u043A\u0435\u0440\u0435\u043A.",theory:["1. \u0411\u0456\u0440\u044B\u04A3\u0493\u0430\u0439 \u043D\u0435\u0433\u0456\u0437 \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0456\u04A3 \u04D9\u0440 \u049B\u0430\u0434\u0430\u043C\u044B \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u0431\u0435\u043B\u0433\u0456 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0434\u0456.","2. \u041C\u04AF\u0448\u0435\u043B\u0435\u0440\u0434\u0456\u04A3 \u0431\u0456\u0440\u0456\u043D-\u0431\u0456\u0440\u0456 \u0436\u043E\u049B\u049B\u0430 \u0448\u044B\u0493\u0430\u0440\u0443 \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u0436\u0456\u043A\u0442\u0435\u0443 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u043E\u0440\u0442\u0430\u049B \u044D\u043B\u0435\u043C\u0435\u043D\u0442\u0456 \u0431\u043E\u043B\u043C\u0430\u0443\u044B \u0442\u0438\u0456\u0441.","3. \u04AE\u0437\u0434\u0456\u043A\u0441\u0456\u0437\u0434\u0456\u043A \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u04B1\u0493\u044B\u043C \u0435\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u04AF\u0440\u043B\u0435\u0440\u0456\u043D\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456, \u0430\u0440\u0430\u043B\u044B\u049B \u0442\u04AF\u0440\u043B\u0435\u0440\u0434\u0456 \u0430\u0442\u0442\u0430\u043F \u043A\u0435\u0442\u0443\u0433\u0435 \u0431\u043E\u043B\u043C\u0430\u0439\u0434\u044B.","4. \u0422\u043E\u043B\u044B\u049B\u0442\u044B\u049B \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u0442\u0435\u043A\u0442\u0456\u04A3 \u04D9\u0440\u0431\u0456\u0440 \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u0441\u0456 \u049B\u0430\u043D\u0434\u0430\u0439 \u0434\u0430 \u0431\u0456\u0440 \u043C\u04AF\u0448\u0435\u0433\u0435 \u0435\u043D\u0443\u0456 \u043A\u0435\u0440\u0435\u043A.","5. \u04E8\u043B\u0448\u0435\u043C\u0434\u0435\u0441\u0442\u0456\u043A \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u043C\u0 es:[{title:"\u04AE\u0437\u0434\u0456\u043A\u0441\u0456\u0437\u0434\u0456\u043A \u0431\u04B1\u0437\u044B\u043B\u0493\u0430\u043D",text:"\xAB\u041D\u0430\u049B\u0442\u044B \u0441\u0430\u043D\u0434\u0430\u0440: \u0438\u0440\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B, \u0431\u04AF\u0442\u0456\u043D \u0436\u04D9\u043D\u0435 \u0431\u04E9\u043B\u0448\u0435\u043A \u0441\u0430\u043D\u0434\u0430\u0440\xBB \u2013 \u049B\u0430\u0442\u0435, \xAB\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0441\u0430\u043D\u0434\u0430\u0440\xBB \u0434\u0435\u04A3\u0433\u0435\u0439\u0456 \u0430\u0442\u0442\u0430\u043F \u043A\u0435\u0442\u0456\u043B\u0433\u0435\u043D. \u0414\u04B1\u0440\u044B\u0441\u044B: \u043D\u0430\u049B\u0442\u044B \u2192 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B / \u0438\u0440\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B; \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u2192 \u0431\u04AF\u0442\u0456\u043D / \u0431\u04E9\u043B\u0448\u0435\u043A."},{title:"\u049A\u0438\u044B\u043B\u044B\u0441\u0443",text:"\xAB\u041D\u0430\u0442\u0443\u0440\u0430\u043B \u0441\u0430\u043D\u0434\u0430\u0440: \u0442\u0430\u049B \u0436\u04D9\u043D\u0435 \u0436\u0430\u0439 \u0441\u0430\u043D\u0434\u0430\u0440\xBB \u2013 \u049B\u0430\u0442\u0435, 7 \u0441\u0430\u043D\u044B \u0435\u043A\u0456 \u0442\u043E\u043F\u049B\u0430 \u0434\u0430 \u0436\u0430\u0442\u0430\u0434\u044B, \u0430\u043B 4 \u0435\u0448\u0431\u0456\u0440 \u0442\u043E\u043F\u049B\u0430 \u0435\u043D\u0431\u0435\u0439\u0434\u0456."}],simple:"\u0416\u0430\u049B\u0441\u044B \u0436\u0456\u043A\u0442\u0435\u0443 \u2013 \u04D9\u0440 \u043D\u04D9\u0440\u0441\u0435\u043D\u0456\u04A3 \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u043E\u0440\u043D\u044B \u0431\u0430\u0440, \u0431\u0456\u0440\u0434\u0435-\u0431\u0456\u0440 \u043D\u04D9\u0440\u0441\u0435 \u0441\u044B\u0440\u0442\u0442\u0430 \u049B\u0430\u043B\u043C\u0430\u0439\u0442\u044B\u043D, \u0441\u04E9\u0440\u0435\u043B\u0435\u0440 \u0431\u0456\u0440 \u043F\u0440\u0438\u043D\u0446\u0438\u043F\u043F\u0435\u043D \u0431\u04E9\u043B\u0456\u043D\u0433\u0435\u043D \u0448\u043A\u0430\u0444.",life:"\u041A\u0438\u0456\u043C \u0448\u043A\u0430\u0444\u044B\u043D \xAB\u049B\u044B\u0441\u049B\u044B \u043A\u0438\u0456\u043C\xBB \u0436\u04D9\u043D\u0435 \xAB\u043A\u04E9\u043A \u0442\u04AF\u0441\u0442\u0456 \u043A\u0438\u0456\u043C\xBB \u0434\u0435\u043F \u0431\u04E9\u043B\u0441\u0435\u04A3\u0456\u0437, \u043A\u04E9\u043A \u043A\u04AF\u0440\u0442\u0435\u0448\u0435 \u0435\u043A\u0456 \u0441\u04E9\u0440\u0435\u0433\u0435 \u0434\u0435 \u0436\u0430\u0442\u0430\u0434\u044B \u2013 \u0431\u04B1\u043B \u043D\u0435\u0433\u0456\u0437\u0434\u0456 \u0430\u0440\u0430\u043B\u0430\u0441\u0442\u044B\u0440\u0443 \u049B\u0430\u0442\u0435\u0441\u0456.",summary:"\u0411\u0435\u0441 \u0435\u0440\u0435\u0436\u0435 \u0431\u0456\u0440-\u0431\u0456\u0440\u0456\u043C\u0435\u043D \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u0442\u044B: \u0431\u0456\u0440\u044B\u04A3\u0493\u0430\u0439 \u043D\u0435\u0433\u0456\u0437 \u0441\u0430\u049B\u0442\u0430\u043B\u0441\u0430, \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0434\u0456\u04A3 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0443\u044B \u043C\u0435\u043D \u0442\u043E\u043B\u044B\u049B\u0442\u044B\u0493\u044B\u043D \u0442\u0435\u043A\u0441\u0435\u0440\u0443 \u0436\u0435\u04A3\u0456\u043B\u0434\u0435\u0439\u0434\u0456. \u041C\u04B1\u0493\u0430\u043B\u0456\u043C \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B\u04A3 \u0436\u0456\u043A\u0442\u0435\u0443\u043B\u0435\u0440\u0456\u043D \u043E\u0441\u044B \u0435\u0440\u0435\u0436\u0435\u043B\u0435\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0442\u0430\u043B\u0434\u0430\u0443\u0493\u0430 \u04AF\u0439\u0440\u0435\u0442\u0443\u0456 \u043A\u0435\u0440\u0435\u043A."}],workedExamples:[{title:"\u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u043D\u044B \u0442\u0430\u043B\u0434\u0430\u0443",problem:"\xAB\u0420\u043E\u043C\u0431 \u2013 \u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0441\u044B\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u04A3\u0434\u0435\u0440.",steps:["\u0410\u043D\u044B\u049B\u0442\u0430\u043B\u0430\u0442\u044B\u043D \u04B1\u0493\u044B\u043C \u2013 \xAB\u0440\u043E\u043C\u0431\xBB.","\u0415\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A \u2013 \xAB\u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB (\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0435\u043C\u0435\u0441, \u0441\u0435\u0431\u0435\u0431\u0456 \u0430\u0440\u0430\u043B\u044B\u049B\u0442\u0430 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0431\u0430\u0440).","\u0422\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B \u2013 \xAB\u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3\xBB.","\u04E8\u043B\u0448\u0435\u043C\u0434\u0435\u0441\u0442\u0456\u043A\u0442\u0456 \u0442\u0435\u043A\u0441\u0435\u0440\u0435\u043C\u0456\u0437: \u04D9\u0440 \u0440\u043E\u043C\u0431 \u2013 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0436\u04D9\u043D\u0435 \u043A\u0435\u0440\u0456\u0441\u0456\u043D\u0448\u0435. \u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0434\u04B1\u0440\u044B\u0441."]},{title:"\u041C\u0430\u0437\u043C\u04B1\u043D \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C",problem:"\xAB\u0422\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u04B1\u0493\u044B\u043C\u044B\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B\u043D\u0430 \u049B\u0430\u043D\u0434\u0430\u0439 \u0431\u0435\u043B\u0433\u0456 \u049B\u043E\u0441\u0441\u0430\u049B, \xAB\u043A\u0432\u0430\u0434\u0440\u0430\u0442\xBB \u04B1\u0493\u044B\u043C\u044B \u0448\u044B\u0493\u0430\u0434\u044B? \u041A\u04E9\u043B\u0435\u043C \u049B\u0430\u043B\u0430\u0439 \u04E9\u0437\u0433\u0435\u0440\u0435\u0434\u0456?",steps:["\u0422\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B: \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C, \u0431\u0430\u0440\u043B\u044B\u049B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0442\u0456\u043A.","\u0416\u0430\u04A3\u0430 \u0431\u0435\u043B\u0433\u0456: \xAB\u043A\u04E9\u0440\u0448\u0456\u043B\u0435\u0441 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3\xBB.","\u041D\u04D9\u0442\u0438\u0436\u0435 \u2013 \u043A\u0432\u0430\u0434\u0440\u0430\u0442. \u041C\u0430\u0437\u043C\u04B1\u043D \u043A\u0435\u04A3\u0435\u0439\u0434\u0456, \u043A\u04E9\u043B\u0435\u043C \u0442\u0430\u0440\u044B\u043B\u0434\u044B: \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u0430\u0440 \u2013 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u0434\u044B\u04A3 \u0431\u0456\u0440 \u0431\u04E9\u043B\u0456\u0433\u0456."]},{title:"\u0416\u0456\u043A\u0442\u0435\u0443\u0434\u0456 \u0442\u0435\u043A\u0441\u0435\u0440\u0443",problem:"\u0422\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440: \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u0434\u0430\u0440, \u0442\u0440\u0430\u043F\u0435\u0446\u0438\u044F\u043B\u0430\u0440 \u0436\u04D9\u043D\u0435 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440. \u0416\u0456\u043A\u0442\u0435\u0443 \u0434\u04B1\u0440\u044B\u0441 \u043F\u0430?",steps:["\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0435\u043C\u0435\u0441 \u2013 \u04E9\u043B\u0448\u0435\u043C\u0434\u0435\u0441\u0442\u0456\u043A \u0431\u04B1\u0437\u044B\u043B\u0493\u0430\u043D (\u0430\u0440\u0442\u044B\u049B \u043C\u04AF\u0448\u0435).","\u041F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0434\u0430, \u0442\u0440\u0430\u043F\u0435\u0446\u0438\u044F \u0434\u0430 \u0435\u043C\u0435\u0441 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 (\u0436\u0430\u043B\u043F\u044B \u0442\u04AF\u0440\u0434\u0435\u0433\u0456 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448) \u0435\u043D\u0431\u0435\u0439 \u049B\u0430\u043B\u0493\u0430\u043D \u2013 \u0442\u043E\u043B\u044B\u049B\u0442\u044B\u049B \u0431\u04B1\u0437\u044B\u043B\u0493\u0430\u043D.","\u0414\u04B1\u0440\u044B\u0441 \u043D\u04B1\u0441\u049B\u0430: \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u0434\u0430\u0440, \u0442\u0440\u0430\u043F\u0435\u0446\u0438\u044F\u043B\u0430\u0440 \u0436\u04D9\u043D\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C \u0435\u043C\u0435\u0441 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440."]}],practice:[{task:"\xAB\u0428\u0435\u04A3\u0431\u0435\u0440\xBB \u04B1\u0493\u044B\u043C\u044B\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0436\u0430\u0437\u044B\u04A3\u0434\u0430\u0440.",answer:"\u041C\u0430\u0437\u043C\u04B1\u043D\u044B: \u0436\u0430\u0437\u044B\u049B\u0442\u044B\u049B\u0442\u0430\u0493\u044B \u043D\u04AF\u043A\u0442\u0435\u043B\u0435\u0440 \u0436\u0438\u044B\u043D\u044B, \u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D \u043D\u04AF\u043A\u0442\u0435\u0434\u0435\u043D \u0431\u0456\u0440\u0434\u0435\u0439 \u049B\u0430\u0448\u044B\u049B\u0442\u044B\u049B\u0442\u0430 \u0436\u0430\u0442\u0430\u0434\u044B. \u041A\u04E9\u043B\u0435\u043C\u0456: \u0431\u0430\u0440\u043B\u044B\u049B \u0448\u0435\u04A3\u0431\u0435\u0440\u043B\u0435\u0440."},{task:"\xAB\u041A\u0432\u0430\u0434\u0440\u0430\u0442\xBB \u04B1\u0493\u044B\u043C\u044B\u043D\u0430 \u0435\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A \u043F\u0435\u043D \u0442\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B\u0442\u044B \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043F, \u0435\u043A\u0456 \u0442\u04AF\u0440\u043B\u0456 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0436\u0430\u0437\u044B\u04A3\u0434\u0430\u0440.",answer:"1) \u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448. 2) \u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0431\u0430\u0440\u043B\u044B\u049B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0442\u0456\u043A \u0440\u043E\u043C\u0431."},{task:"\u0411\u04AF\u0442\u0456\u043D \u0441\u0430\u043D\u0434\u0430\u0440\u0434\u044B \u0434\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u0430\u0440\u049B\u044B\u043B\u044B \u0436\u0456\u043A\u0442\u0435\u043F, \u0441\u04AF\u043B\u0431\u0435\u0441\u0456\u043D \u0441\u0430\u043B\u044B\u04A3\u0434\u0430\u0440.",answer:"\u0411\u04AF\u0442\u0456\u043D \u2192 \u043E\u04A3 / \u043E\u04A3 \u0435\u043C\u0435\u0441; \u043E\u04A3 \u0435\u043C\u0435\u0441 \u2192 \u043D\u04E9\u043B / \u0442\u0435\u0440\u0456\u0441."},{task:"\xAB\u0424\u0443\u043D\u043A\u0446\u0438\u044F\u043B\u0430\u0440: \u0441\u044B\u0437\u044B\u049B\u0442\u044B\u049B, \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B\u049B, \u04E9\u0441\u043F\u0435\u043B\u0456\xBB \u0436\u0456\u043A\u0442\u0435\u0443\u0456\u043D\u0434\u0435\u0433\u0456 \u049B\u0430\u0442\u0435\u043D\u0456 \u0442\u0430\u0431\u044B\u04A3\u0434\u0430\u0440.",answer:"\u0415\u043A\u0456 \u043D\u0435\u0433\u0456\u0437 \u0430\u0440\u0430\u043B\u0430\u0441\u049B\u0430\u043D (\u0442\u04AF\u0440\u0456 \u0436\u04D9\u043D\u0435 \u043C\u043E\u043D\u043E\u0442\u043E\u043D\u0434\u044B\u043B\u044B\u0493\u044B); \u0441\u044B\u0437\u044B\u049B\u0442\u044B\u049B \u0444\u0443\u043D\u043A\u0446\u0438\u044F \u04E9\u0441\u043F\u0435\u043B\u0456 \u0434\u0435 \u0431\u043E\u043B\u0443\u044B \u043C\u04AF\u043C\u043A\u0456\u043D \u2013 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440 \u049B\u0438\u044B\u043B\u044B\u0441\u0430\u0434\u044B."},{task:"\u0422\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u0434\u044B \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0456\u04A3 \u0434\u04B1\u0440\u044B\u0441 \u0441\u04AF\u043B\u0431\u0435\u0441\u0456\u043D \u049B\u04B1\u0440\u044B\u043F, \u04D9\u0440 \u0434\u0435\u04A3\u0433\u0435\u0439\u0434\u0435\u0433\u0456 \u043D\u0435\u0433\u0456\u0437\u0434\u0456 \u0430\u0442\u0430\u04A3\u0434\u0430\u0440.",answer:"\u0422\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u2192 (\u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C \u049B\u0430\u0431\u044B\u0440\u0493\u0430 \u0436\u04B1\u043F\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u0441\u0430\u043D\u044B) \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C / \u0442\u0440\u0430\u043F\u0435\u0446\u0438\u044F / \u0436\u0430\u043B\u043F\u044B \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448; \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u2192 (\u0431\u04B1\u0440\u044B\u0448) \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 / \u0442\u0456\u043A \u0435\u043C\u0435\u0441; (\u049B\u0430\u0431\u044B\u0440\u0493\u0430) \u0440\u043E\u043C\u0431 \u2026 \u0442.\u0431."}],conclusion:["\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u04B1\u0493\u044B\u043C \u2013 \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440 \u043A\u043B\u0430\u0441\u044B\u043D\u044B\u04A3 \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u0431\u0435\u0439\u043D\u0435\u043B\u0435\u0439\u0442\u0456\u043D \u043E\u0439\u043B\u0430\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B. \u041E\u043B \u0441\u0435\u0437\u0456\u043C\u0434\u0456\u043A \u0442\u0430\u043D\u0443\u0434\u0430\u043D \u0431\u0430\u0441\u0442\u0430\u043B\u044B\u043F, \u043E\u0439\u043B\u0430\u0443 \u0430\u043C\u0430\u043B\u0434\u0430\u0440\u044B \u0430\u0440\u049B\u044B\u043B\u044B \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0430\u0434\u044B \u0436\u04D9\u043D\u0435 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B \u043C\u0435\u043D \u043A\u04E9\u043B\u0435\u043C\u0456 \u0430\u0440\u049B\u044B\u043B\u044B \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u043B\u0430\u0434\u044B.","\u04B0\u0493\u044B\u043C\u0434\u044B \u0435\u043D\u0433\u0456\u0437\u0443 \u043D\u0430\u049B\u0442\u044B-\u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u043D\u0435\u043C\u0435\u0441\u0435 \u0430\u0431\u0441\u0442\u0440\u0430\u043A\u0442\u0456\u043B\u0456-\u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B\u043C\u0435\u043D \u0436\u04AF\u0437\u0435\u0433\u0435 \u0430\u0441\u0430\u0434\u044B. \u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B\u043D, \u0430\u043B \u0431\u04E9\u043B\u0443 \u043C\u0435\u043D \u0436\u0456\u043A\u0442\u0435\u0443 \u043E\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0430\u0448\u0430\u0434\u044B. \u0414\u04B1\u0440\u044B\u0441 \u0436\u0456\u043A\u0442\u0435\u0443 \u0431\u0435\u0441 \u0435\u0440\u0435\u0436\u0435\u0433\u0435 \u0431\u0430\u0493\u044B\u043D\u0430\u0434\u044B."],questions:["\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0443 \u0441\u0430\u0442\u044B\u043B\u0430\u0440\u044B\u043D
