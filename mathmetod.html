440\u0435\u0434\u0456;","\u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443, \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u0436\u04D9\u043D\u0435 \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F \u0430\u0440\u049B\u044B\u043B\u044B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0436\u0430\u0441\u0430\u0439\u0434\u044B \u0436\u04D9\u043D\u0435 \u043E\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B\u043D \u0431\u0430\u0493\u0430\u043B\u0430\u0439\u0434\u044B;","\u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u0442\u0435\u0440\u043C\u0438\u043D\u0434\u0435\u0440\u0456\u043D, \u0435\u0440\u0435\u0436\u0435\u043B\u0435\u0440\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043F, \u043C\u043E\u0434\u0443\u0441 \u043F\u043E\u043D\u0435\u043D\u0441 \u043F\u0435\u043D \u043C\u043E\u0434\u0443\u0441 \u0442\u043E\u043B\u043B\u0435\u043D\u0441\u0442\u0456 \u049B\u043E\u043B\u0434\u0430\u043D\u0430\u0434\u044B."],topics:[{id:"t9-1",title:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440 \u0436\u04D9\u043D\u0435 \u043F\u0456\u043A\u0456\u0440\u043B\u0435\u0440",lead:"\u041F\u0430\u0439\u044B\u043C \u2013 \u043E\u0431\u044A\u0435\u043A\u0442 \u0442\u0443\u0440\u0430\u043B\u044B \u0431\u0456\u0440\u0434\u0435\u04A3\u0435\u043D\u0456 \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0439\u0442\u044B\u043D \u043D\u0435\u043C\u0435\u0441\u0435 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0439\u0442\u0456\u043D, \u0430\u049B\u0438\u049B\u0430\u0442 \u043D\u0435 \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u043E\u0439.",theory:["\u041F\u0430\u0439\u044B\u043C \u04AF\u0448 \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u043D \u0442\u04B1\u0440\u0430\u0434\u044B: \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u0443\u0431\u044A\u0435\u043A\u0442 (S) \u2013 \u043D\u0435 \u0442\u0443\u0440\u0430\u043B\u044B \u0430\u0439\u0442\u044B\u043B\u0430\u0434\u044B; \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043F\u0440\u0435\u0434\u0438\u043A\u0430\u0442 (P) \u2013 \u0441\u0443\u0431\u044A\u0435\u043A\u0442 \u0442\u0443\u0440\u0430\u043B\u044B \u043D\u0435 \u0430\u0439\u0442\u044B\u043B\u0430\u0434\u044B; \u043A\u043E\u043F\u0443\u043B\u0430 \u2013 \u043E\u043B\u0430\u0440\u0434\u044B \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u0442\u044B\u0440\u0430\u0442\u044B\u043D \xAB\u0431\u043E\u043B\u0430\u0434\u044B\xBB, \xAB\u0435\u043C\u0435\u0441\xBB, \xAB\u2013\xBB \u0441\u04E9\u0437\u0434\u0435\u0440\u0456. \u041C\u044B\u0441\u0430\u043B\u044B: \xAB\u0428\u0435\u04A3\u0431\u0435\u0440\u0434\u0456\u04A3 \u0434\u0438\u0430\u043C\u0435\u0442\u0440\u0456 (S) \u2013 \u0446\u0435\u043D\u0442\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u04E9\u0442\u0435\u0442\u0456\u043D \u0445\u043E\u0440\u0434\u0430 (P)\xBB.","\u0421\u0430\u043D \u0436\u04D9\u043D\u0435 \u0441\u0430\u043F\u0430 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440 \u0442\u04E9\u0440\u0442 \u0442\u04AF\u0440\u0433\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. A \u2013 \u0436\u0430\u043B\u043F\u044B \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0443 (\xAB\u0411\u0430\u0440\u043B\u044B\u049B S \u2013 P\xBB), I \u2013 \u0456\u0448\u0456\u043D\u0430\u0440\u0430 \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0443 (\xAB\u041A\u0435\u0439\u0431\u0456\u0440 S \u2013 P\xBB), E \u2013 \u0436\u0430\u043B\u043F\u044B \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443 (\xAB\u0415\u0448\u0431\u0456\u0440 S \u2013 P \u0435\u043C\u0435\u0441\xBB), O \u2013 \u0456\u0448\u0456\u043D\u0430\u0440\u0430 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443 (\xAB\u041A\u0435\u0439\u0431\u0456\u0440 S \u2013 P \u0435\u043C\u0435\u0441\xBB). \u0411\u0435\u043B\u0433\u0456\u043B\u0435\u0440 \u043B\u0430\u0442\u044B\u043D\u043D\u044B\u04A3 affirmo (\xAB\u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0439\u043C\u044B\u043D\xBB) \u0436\u04D9\u043D\u0435 nego (\xAB\u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0439\u043C\u0456\u043D\xBB) \u0441\u04E9\u0437\u0434\u0435\u0440\u0456\u043D\u0456\u04A3 \u0434\u0430\u0443\u044B\u0441\u0442\u044B \u0434\u044B\u0431\u044B\u0441\u0442\u0430\u0440\u044B\u043D\u0430\u043D \u0430\u043B\u044B\u043D\u0493\u0430\u043D.","\u049A\u04B1\u0440\u044B\u043B\u044B\u043C\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440 \u0436\u0430\u0439 (\u043A\u0435\u0441\u0456\u043C\u0434\u0456) \u0436\u04D9\u043D\u0435 \u043A\u04AF\u0440\u0434\u0435\u043B\u0456 \u0431\u043E\u043B\u0430\u0434\u044B. \u041A\u04AF\u0440\u0434\u0435\u043B\u0456 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440 \xAB\u0435\u0433\u0435\u0440\u2026, \u043E\u043D\u0434\u0430\u2026\xBB (\u0438\u043C\u043F\u043B\u0438\u043A\u0430\u0446\u0438\u044F), \xAB\u0436\u04D9\u043D\u0435\xBB (\u043A\u043E\u043D\u044A\u044E\u043D\u043A\u0446\u0438\u044F), \xAB\u043D\u0435\u043C\u0435\u0441\u0435\xBB (\u0434\u0438\u0437\u044A\u044E\u043D\u043A\u0446\u0438\u044F), \xAB\u0441\u043E\u043D\u0434\u0430 \u0436\u04D9\u043D\u0435 \u0442\u0435\u043A \u0441\u043E\u043D\u0434\u0430 \u0493\u0430\u043D\u0430\xBB (\u044D\u043A\u0432\u0438\u0432\u0430\u043B\u0435\u043D\u0446\u0438\u044F) \u0430\u0440\u049B\u044B\u043B\u044B \u049B\u04B1\u0440\u044B\u043B\u0430\u0434\u044B. \xAB\u0415\u0433\u0435\u0440 A, \u043E\u043D\u0434\u0430 B\xBB \u043F\u0430\u0439\u044B\u043C\u044B \u0442\u0435\u043A A \u0430\u049B\u0438\u049B\u0430\u0442, B \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0493\u0430\u043D\u0434\u0430 \u0493\u0430\u043D\u0430 \u0436\u0430\u043B\u0493\u0430\u043D.","\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043B\u043E\u0433\u0438\u043A\u0430\u0434\u0430 \u043F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u0431\u0430\u043B\u0430\u043C\u0430\u0441\u044B \u2013 \u043F\u0456\u043A\u0456\u0440: \u0430\u049B\u0438\u049B\u0430\u0442 \u043D\u0435 \u0436\u0430\u043B\u0493\u0430\u043D \u0435\u043A\u0435\u043D\u0456\u043D \u0430\u0439\u0442\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u0441\u04E9\u0439\u043B\u0435\u043C. \u049A\u04B1\u0440\u0430\u043C\u044B\u043D\u0434\u0430 \u0430\u0439\u043D\u044B\u043C\u0430\u043B\u044B\u0441\u044B \u0431\u0430\u0440 \u0441\u04E9\u0439\u043B\u0435\u043C (\xABx \u2013 \u0431\u04AF\u0442\u0456\u043D \u0441\u0430\u043D\xBB) \u043F\u0456\u043A\u0456\u0440 \u0435\u043C\u0435\u0441, \u043E\u043B \u0430\u0439\u043D\u044B\u043C\u0430\u043B\u044B\u0441\u044B \u0431\u0430\u0440 \u043F\u0456\u043A\u0456\u0440; x-\u0442\u0456\u04A3 \u043E\u0440\u043D\u044B\u043D\u0430 \u043C\u04D9\u043D \u049B\u043E\u0439\u0493\u0430\u043D\u0434\u0430 \u043F\u0456\u043A\u0456\u0440\u0433\u0435 \u0430\u0439\u043D\u0430\u043B\u0430\u0434\u044B.","\u041E\u0439\u043B\u0430\u0443\u0434\u044B\u04A3 \u0442\u04E9\u0440\u0442 \u0437\u0430\u04A3\u044B \u0434\u04B1\u0440\u044B\u0441 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0443\u0434\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0456: \u0442\u0435\u04A3\u0431\u0435-\u0442\u0435\u04A3\u0434\u0456\u043A \u0437\u0430\u04A3\u044B (\u04B1\u0493\u044B\u043C \u043E\u0439 \u0442\u0430\u043B\u049B\u044B\u043B\u0430\u0443 \u0431\u0430\u0440\u044B\u0441\u044B\u043D\u0434\u0430 \u043C\u0430\u0493\u044B\u043D\u0430\u0441\u044B\u043D \u04E9\u0437\u0433\u0435\u0440\u0442\u043F\u0435\u0439\u0434\u0456); \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B \u0437\u0430\u04A3\u044B (A \u0436\u04D9\u043D\u0435 \xABA \u0435\u043C\u0435\u0441\xBB \u0431\u0456\u0440 \u043C\u0435\u0437\u0433\u0456\u043B\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442 \u0435\u043C\u0435\u0441); \u04AF\u0448\u0456\u043D\u0448\u0456\u043D\u0456\u04A3 \u0431\u043E\u043B\u043C\u0430\u0443 \u0437\u0430\u04A3\u044B (A \u043D\u0435\u043C\u0435\u0441\u0435 \xABA \u0435\u043C\u0435\u0441\xBB \u2013 \u0431\u0456\u0440\u0435\u0443\u0456 \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442); \u0436\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456 \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u0443 \u0437\u0430\u04A3\u044B (\u04D9\u0440 \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0430\u0439\u044B\u043C \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u043B\u0443\u0456 \u0442\u0438\u0456\u0441)."],definitions:[{term:"\u041F\u0430\u0439\u044B\u043C",text:"\u041E\u0431\u044A\u0435\u043A\u0442 \u0442\u0443\u0440\u0430\u043B\u044B \u0431\u0456\u0440\u0434\u0435\u04A3\u0435 \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u043D\u0430\u0442\u044B\u043D \u043D\u0435\u043C\u0435\u0441\u0435 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u043B\u0435\u0442\u0456\u043D, \u0430\u049B\u0438\u049B\u0430\u0442 \u043D\u0435 \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u043E\u0439\u043B\u0430\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B."},{term:"\u041F\u0456\u043A\u0456\u0440",text:"\u0410\u049B\u0438\u049B\u0430\u0442 \u043D\u0435\u043C\u0435\u0441\u0435 \u0436\u0430\u043B\u0493\u0430\u043D \u0435\u043A\u0435\u043D\u0456 \u0442\u0443\u0440\u0430\u043B\u044B \u0430\u0439\u0442\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u0441\u04E9\u0439\u043B\u0435\u043C."},{term:"\u0428\u0430\u0440\u0442\u0442\u044B \u043F\u0430\u0439\u044B\u043C",text:"\xAB\u0415\u0433\u0435\u0440 A, \u043E\u043D\u0434\u0430 B\xBB \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456 \u043F\u0430\u0439\u044B\u043C; A \u2013 \u043D\u0435\u0433\u0456\u0437\u0456, B \u2013 \u0441\u0430\u043B\u0434\u0430\u0440\u044B."},{term:"\u049A\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B \u0437\u0430\u04A3\u044B",text:"\u0411\u0456\u0440 \u043E\u0431\u044A\u0435\u043A\u0442 \u0442\u0443\u0440\u0430\u043B\u044B \u0431\u0456\u0440 \u043C\u0435\u0437\u0433\u0456\u043B\u0434\u0435 \u0430\u0439\u0442\u044B\u043B\u0493\u0430\u043D \u0435\u043A\u0456 \u049B\u0430\u0439\u0448\u044B \u043F\u0430\u0439\u044B\u043C \u0435\u043A\u0435\u0443\u0456 \u0431\u0456\u0440\u0434\u0435\u0439 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0430 \u0430\u043B\u043C\u0430\u0439\u0434\u044B."},{term:"\u04AE\u0448\u0456\u043D\u0448\u0456\u043D\u0456\u04A3 \u0431\u043E\u043B\u043C\u0430\u0443 \u0437\u0430\u04A3\u044B",text:"\u0415\u043A\u0456 \u049B\u0430\u0439\u0448\u044B \u043F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u0431\u0456\u0440\u0435\u0443\u0456 \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442."}],formulas:[{expr:"A \u21D2 B  \u0436\u0430\u043B\u0493\u0430\u043D  \u21D4  A \u2013 \u0430\u049B\u0438\u049B\u0430\u0442, B \u2013 \u0436\u0430\u043B\u0493\u0430\u043D",note:"\u0438\u043C\u043F\u043B\u0438\u043A\u0430\u0446\u0438\u044F\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u049B \u0448\u0430\u0440\u0442\u044B"},{expr:"\xAC(A \u2227 \xACA)",note:"\u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B \u0437\u0430\u04A3\u044B"},{expr:"A \u2228 \xACA",note:"\u04AF\u0448\u0456\u043D\u0448\u0456\u043D\u0456\u04A3 \u0431\u043E\u043B\u043C\u0430\u0443 \u0437\u0430\u04A3\u044B"},{expr:"\u2200x \u2208 M  P(x)  ;   \u2203x \u2208 M  P(x)",note:"\u0436\u0430\u043B\u043F\u044B \u0436\u04D9\u043D\u0435 \u0456\u0448\u0456\u043D\u0430\u0440\u0430 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u0441\u0438\u043C\u0432\u043E\u043B\u0434\u044B\u049B \u0436\u0430\u0437\u044B\u043B\u0443\u044B"}],figure:{type:"judgment-structure",caption:"\u041F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B: \u0441\u0443\u0431\u044A\u0435\u043A\u0442 \u2013 \u043A\u043E\u043F\u0443\u043B\u0430 \u2013 \u043F\u0440\u0435\u0434\u0438\u043A\u0430\u0442."},examples:[{title:"\u041F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u0442\u04AF\u0440\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u0443",text:"\xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0440\u043E\u043C\u0431 \u2013 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB \u2013 A; \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u0434\u0430\u0440 \u2013 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u2013 I; \xAB\u0415\u0448\u0431\u0456\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0446\u0435\u043D\u0442\u0440\u043B\u0456\u043A-\u0441\u0438\u043C\u043C\u0435\u0442\u0440\u0438\u044F\u043B\u044B \u0435\u043C\u0435\u0441\xBB \u2013 E; \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0436\u0430\u0439 \u0441\u0430\u043D\u0434\u0430\u0440 \u0442\u0430\u049B \u0435\u043C\u0435\u0441\xBB \u2013 O (\u043C\u044B\u0441\u0430\u043B\u044B, 2)."},{title:"\u0428\u0430\u0440\u0442\u0442\u044B \u043F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B",text:"\xAB\u0415\u0433\u0435\u0440 6 \u0441\u0430\u043D\u044B 4-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043D\u0434\u0430 \u043E\u043B \u0436\u04B1\u043F\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442, \u0441\u0435\u0431\u0435\u0431\u0456 \u043D\u0435\u0433\u0456\u0437\u0456 \u0436\u0430\u043B\u0493\u0430\u043D. \xAB\u0415\u0433\u0435\u0440 9 \u0441\u0430\u043D\u044B 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043D\u0434\u0430 \u043E\u043B \u0436\u04B1\u043F\xBB \u2013 \u0436\u0430\u043B\u0493\u0430\u043D: \u043D\u0435\u0433\u0456\u0437\u0456 \u0430\u049B\u0438\u049B\u0430\u0442, \u0441\u0430\u043B\u0434\u0430\u0440\u044B \u0436\u0430\u043B\u0493\u0430\u043D."},{title:"\u0410\u0439\u043D\u044B\u043C\u0430\u043B\u044B\u0441\u044B \u0431\u0430\u0440 \u043F\u0456\u043A\u0456\u0440",text:"\xABx + 3 = 5\xBB \u2013 \u043F\u0456\u043A\u0456\u0440 \u0435\u043C\u0435\u0441. x = 2 \u0431\u043E\u043B\u0441\u0430 \u2013 \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0456\u043A\u0456\u0440, x = 7 \u0431\u043E\u043B\u0441\u0430 \u2013 \u0436\u0430\u043B\u0493\u0430\u043D \u043F\u0456\u043A\u0456\u0440."}],simple:"\u041F\u0430\u0439\u044B\u043C \u2013 \xAB\u0438\u04D9\xBB \u043D\u0435\u043C\u0435\u0441\u0435 \xAB\u0436\u043E\u049B\xBB \u0434\u0435\u043F \u0431\u0430\u0493\u0430\u043B\u0430\u043D\u0430\u0442\u044B\u043D \u0441\u04E9\u0439\u043B\u0435\u043C. \u041E\u0439\u043B\u0430\u0443 \u0437\u0430\u04A3\u0434\u0430\u0440\u044B \u2013 \u043E\u0439\u044B\u043D \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u0441\u04E9\u0437\u0434\u0456\u04A3 \u043C\u0430\u0493\u044B\u043D\u0430\u0441\u044B\u043D \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u043C\u0430, \u04E9\u0437-\u04E9\u0437\u0456\u04A3\u0435 \u049B\u0430\u0439\u0448\u044B \u043A\u0435\u043B\u043C\u0435, \u04AF\u0448\u0456\u043D\u0448\u0456 \u0436\u043E\u043B \u0456\u0437\u0434\u0435\u043C\u0435, \u04D9\u0440 \u0441\u04E9\u0437\u0456\u04A3\u0434\u0456 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435.",life:"\xAB\u0421\u0430\u0431\u0430\u049B\u049B\u0430 \u043A\u0435\u0448\u0456\u043A\u043A\u0435\u043D \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B\u04A3 \u0431\u0430\u0440\u043B\u044B\u0493\u044B \u0442\u04AF\u0441\u0456\u043D\u0456\u043A\u0442\u0435\u043C\u0435 \u0436\u0430\u0437\u0430\u0434\u044B\xBB \u2013 A \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456 \u043F\u0430\u0439\u044B\u043C. \u0415\u0433\u0435\u0440 \u0431\u0456\u0440\u0435\u0443 \u043A\u0435\u0448\u0456\u0433\u0456\u043F, \u0442\u04AF\u0441\u0456\u043D\u0456\u043A\u0442\u0435\u043C\u0435 \u0436\u0430\u0437\u0431\u0430\u0441\u0430, \u0431\u04B1\u043B \u043F\u0430\u0439\u044B\u043C \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0430\u0434\u044B \u2013 \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u049B\u0430\u0440\u0441\u044B \u043C\u044B\u0441\u0430\u043B \u0436\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456.",summary:"\u041F\u0430\u0439\u044B\u043C \u2013 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u049B \u043C\u04D9\u043D\u0456 \u0431\u0430\u0440 \u043E\u0439\u043B\u0430\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B. \u041E\u043D\u044B\u04A3 \u0442\u04AF\u0440\u043B\u0435\u0440\u0456\u043D (A, I, E, O; \u0436\u0430\u0439 \u0436\u04D9\u043D\u0435 \u043A\u04AF\u0440\u0434\u0435\u043B\u0456) \u0436\u04D9\u043D\u0435 \u043E\u0439\u043B\u0430\u0443\u0434\u044B\u04A3 \u0442\u04E9\u0440\u0442 \u0437\u0430\u04A3\u044B\u043D \u0431\u0456\u043B\u0443 \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u0442\u04AF\u0441\u0456\u043D\u0443\u0434\u0456\u04A3 \u0430\u043B\u0493\u044B\u0448\u0430\u0440\u0442\u044B."},{id:"t9-2",title:"\u041E\u0439 \u049B\u043E\u0440\u044B\u0442\u0443\u043B\u0430\u0440",lead:"\u041E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u2013 \u0431\u0430\u0440 \u0431\u0456\u043B\u0456\u043C\u043D\u0435\u043D \u0436\u0430\u04A3\u0430 \u0431\u0456\u043B\u0456\u043C \u0430\u043B\u0443 \u0442\u04D9\u0441\u0456\u043B\u0456: \u0431\u0456\u0440 \u043D\u0435\u043C\u0435\u0441\u0435 \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u043F\u0430\u0439\u044B\u043C\u043D\u0430\u043D \u0436\u0430\u04A3\u0430 \u043F\u0430\u0439\u044B\u043C \u0448\u044B\u0493\u0430\u0434\u044B.",theory:["\u041E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440\u0434\u0435\u043D (\u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440) \u0436\u04D9\u043D\u0435 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0434\u0430\u043D (\u0436\u0430\u04A3\u0430 \u043F\u0430\u0439\u044B\u043C) \u0442\u04B1\u0440\u0430\u0434\u044B. \u0411\u0456\u0440 \u043F\u0430\u0439\u044B\u043C\u043D\u0430\u043D \u0436\u0430\u0441\u0430\u043B\u0430\u0442\u044B\u043D \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u0442\u0456\u043A\u0435\u043B\u0435\u0439, \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u043F\u0430\u0439\u044B\u043C\u043D\u0430\u043D \u0436\u0430\u0441\u0430\u043B\u0430\u0442\u044B\u043D \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u043E\u0440\u0430\u0493\u044B\u0442\u0430 (\u0436\u0430\u043D\u0430\u043C\u0430) \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0430\u0434\u044B. \u041E\u0440\u0430\u0493\u044B\u0442\u0430 \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A, \u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u04D9\u043D\u0435 \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F \u0431\u043E\u043B\u044B\u043F \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456.","\u0422\u0456\u043A\u0435\u043B\u0435\u0439 \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u049B\u0430 \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u043B\u0435\u0434\u0456. \u049A\u0430\u0439\u0448\u044B\u043B\u044B\u049B \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u044B\u043D\u0434\u0430 (A\u2013O, E\u2013I) \u0431\u0456\u0440\u0435\u0443\u0456 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0441\u0430, \u0435\u043A\u0456\u043D\u0448\u0456\u0441\u0456 \u0436\u0430\u043B\u0493\u0430\u043D. \u049A\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B\u043B\u044B\u049B (A\u2013E): \u0435\u043A\u0435\u0443\u0456 \u0431\u0456\u0440\u0434\u0435\u0439 \u0430\u049B\u0438\u049B\u0430\u0442 \u0435\u043C\u0435\u0441. \u0406\u0448\u0456\u043D\u0430\u0440\u0430 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B\u043B\u044B\u049B (I\u2013O): \u0435\u043A\u0435\u0443\u0456 \u0431\u0456\u0440\u0434\u0435\u0439 \u0436\u0430\u043B\u0493\u0430\u043D \u0435\u043C\u0435\u0441. \u0411\u0430\u0493\u044B\u043D\u044B\u0448\u0442\u044B\u043B\u044B\u049B (A\u2013I, E\u2013O): \u0436\u0430\u043B\u043F\u044B \u043F\u0430\u0439\u044B\u043C \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0441\u0430, \u0436\u0435\u043A\u0435\u0448\u0435 \u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442.","\u0418\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u2013 \u0436\u0435\u043A\u0435 \u0436\u0430\u0493\u0434\u0430\u0439\u043B\u0430\u0440\u0434\u0430\u043D \u0436\u0430\u043B\u043F\u044B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0493\u0430 \u04E9\u0442\u0443. \u0422\u043E\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u0434\u0430 \u0431\u0430\u0440\u043B\u044B\u049B \u0436\u0430\u0493\u0434\u0430\u0439\u043B\u0430\u0440 \u049B\u0430\u0440\u0430\u0441\u0442\u044B\u0440\u044B\u043B\u0430\u0434\u044B, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0430\u049B\u0438\u049B\u0430\u0442. \u0422\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u0434\u0430 \u0442\u0435\u043A \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0436\u0430\u0493\u0434\u0430\u0439 \u049B\u0430\u0440\u0430\u043B\u0430\u0434\u044B, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u044B\u049B\u0442\u0438\u043C\u0430\u043B, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u049B\u0430\u0436\u0435\u0442 \u0435\u0442\u0435\u0434\u0456. \u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u04D9\u0434\u0456\u0441\u0456 \u2013 n = 1 \u04AF\u0448\u0456\u043D \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u043F, n = k-\u0434\u0430\u043D n = k + 1-\u0433\u0435 \u04E9\u0442\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443.","\u0410\u043D\u0430\u043B\u043E\u0433\u0438\u044F \u2013 \u0435\u043A\u0456 \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043D\u0456\u04A3 \u043A\u0435\u0439\u0431\u0456\u0440 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u04B1\u049B\u0441\u0430\u0441\u0442\u044B\u0493\u044B\u043D\u0430\u043D \u0431\u0430\u0441\u049B\u0430 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u0434\u0435 \u04B1\u049B\u0441\u0430\u0441 \u0431\u043E\u043B\u0430\u0442\u044B\u043D\u044B \u0442\u0443\u0440\u0430\u043B\u044B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B. \u041E\u043B \u0436\u0430\u04A3\u0430 \u0431\u043E\u043B\u0436\u0430\u043C \u0430\u0448\u0443\u0493\u0430 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456, \u0431\u0456\u0440\u0430\u049B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0434\u0430 \u044B\u049B\u0442\u0438\u043C\u0430\u043B."],definitions:[{term:"\u041E\u0439\u049B\u043E\u0440\u044B\u0442\u0443",text:"\u0411\u0456\u0440 \u043D\u0435\u043C\u0435\u0441\u0435 \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u043F\u0430\u0439\u044B\u043C\u043D\u0430\u043D \u0436\u0430\u04A3\u0430 \u043F\u0430\u0439\u044B\u043C \u0430\u043B\u044B\u043D\u0430\u0442\u044B\u043D \u043E\u0439\u043B\u0430\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B."},{term:"\u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442",text:"A, I, E, O \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u044B\u043D\u044B\u04A3 \u0430\u0440\u0430\u0441\u044B\u043D\u0434\u0430\u0493\u044B \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u049B \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u0442\u0430\u0440\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0442\u0456\u043D \u0441\u044B\u0437\u0431\u0430."},{term:"\u0422\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F",text:"\u041A\u043B\u0430\u0441\u0441 \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u0431\u0456\u0440 \u0431\u04E9\u043B\u0456\u0433\u0456\u043D \u049B\u0430\u0440\u0430\u0441\u0442\u044B\u0440\u044B\u043F, \u0431\u04AF\u043A\u0456\u043B \u043A\u043B\u0430\u0441\u0441 \u0442\u0443\u0440\u0430\u043B\u044B \u044B\u049B\u0442\u0438\u043C\u0430\u043B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0436\u0430\u0441\u0430\u0443."},{term:"\u0410\u043D\u0430\u043B\u043E\u0433\u0438\u044F",text:"\u04B0\u049B\u0441\u0430\u0441\u0442\u044B\u049B\u049B\u0430 \u0441\u04AF\u0439\u0435\u043D\u0456\u043F, \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043D\u0456\u04A3 \u0431\u0430\u0441\u049B\u0430 \u0431\u0435\u043B\u0433\u0456\u0441\u0456 \u0442\u0443\u0440\u0430\u043B\u044B \u044B\u049B\u0442\u0438\u043C\u0430\u043B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0436\u0430\u0441\u0430\u0443."}],formulas:[{expr:"A\u2081, A\u2082, \u2026, A\u2099  \u27F9  B",note:"\u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443\u0434\u044B\u04A3 \u0436\u0430\u043B\u043F\u044B \u0441\u04AF\u043B\u0431\u0435\u0441\u0456"},{expr:"n\xB2 + n + 41:  n = 0\u202639 \u2192 \u0436\u0430\u0439;  n = 40 \u2192 1681 = 41\xB2",note:"\u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u043D\u044B\u04A3 \u049B\u0430\u0442\u0435\u0441\u0456"},{expr:"1 + 3 + 5 + \u2026 + (2n \u2212 1) = n\xB2",note:"\u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u043C\u0435\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0435\u0442\u0456\u043D \u0442\u0435\u04A3\u0434\u0456\u043A"}],figure:{type:"logic-square",caption:"\u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442: A, I, E, O \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u044B\u043D\u044B\u04A3 \u0442\u04E9\u0440\u0442 \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u044B."},examples:[{title:"\u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B",text:"\xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0440\u043E\u043C\u0431 \u2013 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB (A) \u0430\u049B\u0438\u049B\u0430\u0442. \u041E\u043D\u0434\u0430 \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0440\u043E\u043C\u0431 \u2013 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB (I) \u0430\u049B\u0438\u049B\u0430\u0442 (\u0431\u0430\u0493\u044B\u043D\u044B\u0448\u0442\u044B\u043B\u044B\u049B), \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0440\u043E\u043C\u0431 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0435\u043C\u0435\u0441\xBB (O) \u0436\u0430\u043B\u0493\u0430\u043D (\u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B), \xAB\u0415\u0448\u0431\u0456\u0440 \u0440\u043E\u043C\u0431 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0435\u043C\u0435\u0441\xBB (E) \u0436\u0430\u043B\u0493\u0430\u043D."},{title:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F",text:"n = 1: 1 = 1\xB2 \u2013 \u0430\u049B\u0438\u049B\u0430\u0442. n = k \u04AF\u0448\u0456\u043D 1 + 3 + \u2026 + (2k \u2212 1) = k\xB2 \u0434\u0435\u043F \u04B1\u0439\u0493\u0430\u0440\u0430\u043C\u044B\u0437. \u041E\u043D\u0434\u0430 k\xB2 + (2k + 1) = (k + 1)\xB2, \u044F\u0493\u043D\u0438 \u0442\u0435\u04A3\u0434\u0456\u043A n = k + 1 \u04AF\u0448\u0456\u043D \u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442. \u0414\u0435\u043C\u0435\u043A, \u043E\u043B \u0431\u0430\u0440\u043B\u044B\u049B \u043D\u0430\u0442\u0443\u0440\u0430\u043B n \u04AF\u0448\u0456\u043D \u043E\u0440\u044B\u043D\u0434\u0430\u043B\u0430\u0434\u044B."},{title:"\u0414\u04B1\u0440\u044B\u0441 \u0436\u04D9\u043D\u0435 \u049B\u0430\u0442\u0435 \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F",text:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u043C\u0435\u0434\u0438\u0430\u043D\u0430\u043B\u0430\u0440\u044B \u0431\u0456\u0440 \u043D\u04AF\u043A\u0442\u0435\u0434\u0435 \u049B\u0438\u044B\u043B\u044B\u0441\u0430\u0434\u044B \u2192 \u0442\u0435\u0442\u0440\u0430\u044D\u0434\u0440\u0434\u0456\u04A3 \u043C\u0435\u0434\u0438\u0430\u043D\u0430\u043B\u0430\u0440\u044B \u0434\u0430 \u0431\u0456\u0440 \u043D\u04AF\u043A\u0442\u0435\u0434\u0435 \u049B\u0438\u044B\u043B\u044B\u0441\u0430\u0434\u044B (\u0430\u049B\u0438\u049B\u0430\u0442). a(b + c) = ab + ac \u2192 sin(x + y) = sin x + sin y (\u0436\u0430\u043B\u0493\u0430\u043D, \u049B\u0430\u0442\u0435 \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F)."}],simple:"\u0418\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u2013 \xAB\u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0440\u0435\u0442 \u0431\u0430\u0439\u049B\u0430\u0434\u044B\u043C, \u0434\u0435\u043C\u0435\u043A \u04D9\u0440\u0434\u0430\u0439\u044B\u043C \u0441\u043E\u043B\u0430\u0439 \u0431\u043E\u043B\u0443\u044B \u043C\u04AF\u043C\u043A\u0456\u043D\xBB \u0434\u0435\u0433\u0435\u043D \u0431\u043E\u043B\u0436\u0430\u043C. \u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F \u043E\u043D\u044B \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u043F, \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0439\u0434\u0456.",life:"\u0410\u0443\u0430 \u0440\u0430\u0439\u044B\u043D \u0431\u043E\u043B\u0436\u0430\u0443 \u2013 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F: \xAB\u0441\u043E\u04A3\u0493\u044B \u0431\u0435\u0441 \u043A\u04AF\u043D \u0431\u04B1\u043B\u0442 \u0448\u044B\u049B\u049B\u0430\u043D \u0441\u043E\u04A3 \u0436\u0430\u04A3\u0431\u044B\u0440 \u0436\u0430\u0443\u0434\u044B, \u0431\u04AF\u0433\u0456\u043D \u0434\u0435 \u0436\u0430\u0443\u0430\u0442\u044B\u043D \u0448\u044B\u0493\u0430\u0440\xBB. \u0411\u04B1\u043B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u044B\u049B\u0442\u0438\u043C\u0430\u043B, \u043A\u0435\u043F\u0456\u043B\u0434\u0456\u043A \u0436\u043E\u049B.",summary:"\u041E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u0436\u04D9\u043D\u0435 \u043E\u0440\u0430\u0493\u044B\u0442\u0430 \u0431\u043E\u043B\u0430\u0434\u044B. \u0418\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u043C\u0435\u043D \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F \u0431\u043E\u043B\u0436\u0430\u043C \u0431\u0435\u0440\u0435\u0434\u0456, \u043E\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B\u043D \u0434\u0435\u0434\u0443\u043A\u0446\u0438\u044F \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0439\u0434\u0456."},{id:"t9-3",title:"\u0414\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443",lead:"\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F \u2013 \u0436\u0430\u043B\u043F\u044B \u0435\u0440\u0435\u0436\u0435\u0434\u0435\u043D \u0436\u0435\u043A\u0435 \u0436\u0430\u0493\u0434\u0430\u0439 \u0442\u0443\u0440\u0430\u043B\u044B \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0448\u044B\u0493\u0430\u0440\u0443.",theory:["\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F (\u043B\u0430\u0442. deductio \u2013 \u0448\u044B\u0493\u0430\u0440\u044B\u043F \u0430\u043B\u0443) \u2013 \u0436\u0430\u043B\u043F\u044B \u0431\u0456\u043B\u0456\u043C\u043D\u0435\u043D \u0436\u0435\u043A\u0435 \u0431\u0456\u043B\u0456\u043C\u0433\u0435 \u049B\u0430\u0440\u0430\u0439 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0442\u0456\u043D \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443. \u0421\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440 \u0430\u049B\u0438\u049B\u0430\u0442 \u0436\u04D9\u043D\u0435 \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B \u0434\u04B1\u0440\u044B\u0441 \u0431\u043E\u043B\u0441\u0430, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442. \u0421\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0442\u0435\u043A \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B\u043C\u0435\u043D \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0434\u0456.","\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F\u043D\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0444\u043E\u0440\u043C\u0430\u0441\u044B \u2013 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C: \u0435\u043A\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435\u043D \u04AF\u0448\u0456\u043D\u0448\u0456 \u043F\u0430\u0439\u044B\u043C \u0448\u044B\u0493\u0430\u0434\u044B. \u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435 \u04AF\u0448 \u0442\u0435\u0440\u043C\u0438\u043D \u0431\u0430\u0440: \u04AF\u043B\u043A\u0435\u043D \u0442\u0435\u0440\u043C\u0438\u043D P (\u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u043D\u044B\u04A3 \u043F\u0440\u0435\u0434\u0438\u043A\u0430\u0442\u044B), \u043A\u0456\u0448\u0456 \u0442\u0435\u0440\u043C\u0438\u043D S (\u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u043D\u044B\u04A3 \u0441\u0443\u0431\u044A\u0435\u043A\u0442\u0456\u0441\u0456) \u0436\u04D9\u043D\u0435 \u043E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D M (\u0435\u043A\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435 \u0434\u0435 \u0431\u0430\u0440, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0434\u0430 \u0436\u043E\u049B). \u04AE\u043B\u043A\u0435\u043D \u0442\u0435\u0440\u043C\u0438\u043D\u0434\u0456 \u049B\u0430\u043C\u0442\u0438\u0442\u044B\u043D \u0441\u0456\u043B\u0442\u0435\u043C\u0435 \u2013 \u04AF\u043B\u043A\u0435\u043D \u0441\u0456\u043B\u0442\u0435\u043C\u0435, \u043A\u0456\u0448\u0456 \u0442\u0435\u0440\u043C\u0438\u043D\u0434\u0456 \u049B\u0430\u043C\u0442\u0438\u0442\u044B\u043D \u2013 \u043A\u0456\u0448\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435.","\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C \u0435\u0440\u0435\u0436\u0435\u043B\u0435\u0440\u0456: \u0442\u0435\u043A \u04AF\u0448 \u0442\u0435\u0440\u043C\u0438\u043D \u0431\u043E\u043B\u0443\u044B; \u043E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D \u043A\u0435\u043C\u0456\u043D\u0434\u0435 \u0431\u0456\u0440 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435 \u0442\u043E\u043B\u044B\u049B \u043A\u04E9\u043B\u0435\u043C\u0434\u0435 \u0430\u043B\u044B\u043D\u0443\u044B; \u0435\u043A\u0456 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0448\u044B\u049B\u043F\u0430\u0443\u044B; \u0431\u0456\u0440 \u0441\u0456\u043B\u0442\u0435\u043C\u0435 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443 \u0431\u043E\u043B\u0441\u0430, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0434\u0430 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443; \u0435\u043A\u0456 \u0434\u0435\u0440\u0431\u0435\u0441 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0448\u044B\u049B\u043F\u0430\u0443\u044B. \u041E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D\u043D\u0456\u04A3 \u043E\u0440\u043D\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u0442\u04E9\u0440\u0442 \u0444\u0438\u0433\u0443\u0440\u0430\u0441\u044B \u0431\u043E\u043B\u0430\u0434\u044B.","\u041C\u0435\u043A\u0442\u0435\u043F\u0442\u0435 \u0448\u0430\u0440\u0442\u0442\u044B \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0436\u0438\u0456 \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0434\u044B. \u041C\u043E\u0434\u0443\u0441 \u043F\u043E\u043D\u0435\u043D\u0441: \xAB\u0415\u0433\u0435\u0440 A, \u043E\u043D\u0434\u0430 B; A; \u043E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, B\xBB. \u041C\u043E\u0434\u0443\u0441 \u0442\u043E\u043B\u043B\u0435\u043D\u0441: \xAB\u0415\u0433\u0435\u0440 A, \u043E\u043D\u0434\u0430 B; B \u0435\u043C\u0435\u0441; \u043E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, A \u0435\u043C\u0435\u0441\xBB. \u0415\u043A\u0456 \u0442\u0438\u043F\u0442\u0456\u043A \u049B\u0430\u0442\u0435 \u0431\u0430\u0440: \u0441\u0430\u043B\u0434\u0430\u0440\u0434\u044B \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u043F, \u043D\u0435\u0433\u0456\u0437\u0434\u0456 \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0443 (\xABB, \u043E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430 A\xBB) \u0436\u04D9\u043D\u0435 \u043D\u0435\u0433\u0456\u0437\u0434\u0456 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u043F, \u0441\u0430\u043B\u0434\u0430\u0440\u0434\u044B \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443."],definitions:[{term:"\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F",text:"\u0416\u0430\u043B\u043F\u044B \u0431\u0456\u043B\u0456\u043C\u043D\u0435\u043D \u0436\u0435\u043A\u0435 \u0431\u0456\u043B\u0456\u043C\u0433\u0435 \u049B\u0430\u0440\u0430\u0439 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0442\u0456\u043D, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442 \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443."},{term:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C",text:"\u0415\u043A\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435\u043D \u04AF\u0448\u0456\u043D\u0448\u0456 \u043F\u0430\u0439\u044B\u043C \u0448\u044B\u0493\u0430\u0440\u044B\u043B\u0430\u0442\u044B\u043D \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443."},{term:"\u041E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D (M)",text:"\u0415\u043A\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435 \u0 42\u0435\u0440\u0456 \u0430\u0440\u049B\u044B\u043B\u044B \u043A\u0435\u0441\u043A\u0456\u043D\u0434\u0435\u043B\u0443\u0456: S \u2282 M \u2282 P."},examples:[{title:"\u041A\u0435\u0441\u0456\u043C\u0434\u0456 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C",text:"\u0411\u0430\u0440\u043B\u044B\u049B \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 (M) \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3 (P). \u0411\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 (S) \u2013 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 (M). \u041E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, \u0431\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3."},{title:"\u041C\u043E\u0434\u0443\u0441 \u043F\u043E\u043D\u0435\u043D\u0441",text:"\u0415\u0433\u0435\u0440 \u0441\u0430\u043D\u043D\u044B\u04A3 \u0446\u0438\u0444\u0440\u043B\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B 9-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043D\u0434\u0430 \u0441\u0430\u043D 9-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. 37845: 3 + 7 + 8 + 4 + 5 = 27, 27 9-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. \u041E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, 37845 \u0441\u0430\u043D\u044B 9-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456."},{title:"\u041C\u043E\u0434\u0443\u0441 \u0442\u043E\u043B\u043B\u0435\u043D\u0441",text:"\u0415\u0433\u0435\u0440 a \u043C\u0435\u043D b \u04E9\u0437\u0430\u0440\u0430 \u0436\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u0415\u04AE\u041E\u0411(a, b) = 1. \u0415\u04AE\u041E\u0411(8, 14) = 2 \u2260 1. \u041E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, 8 \u0436\u04D9\u043D\u0435 14 \u04E9\u0437\u0430\u0440\u0430 \u0436\u0430\u0439 \u0435\u043C\u0435\u0441."},{title:"\u0422\u0438\u043F\u0442\u0456\u043A \u049B\u0430\u0442\u0435",text:"\xAB\u0421\u0430\u043D 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456, \u043E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430 9-\u0493\u0430 \u0434\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456\xBB \u2013 \u0441\u0430\u043B\u0434\u0430\u0440\u0434\u044B \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0443 \u049B\u0430\u0442\u0435\u0441\u0456. \u049A\u0430\u0440\u0441\u044B \u043C\u044B\u0441\u0430\u043B: 15."}],simple:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C \u2013 \xAB\u0431\u0430\u0441\u043F\u0430\u043B\u0434\u0430\u049B\xBB: \u0436\u0430\u043B\u043F\u044B \u0435\u0440\u0435\u0436\u0435 (\u0431\u0430\u0440\u043B\u044B\u049B M \u2013 P) + \u0431\u0456\u0437\u0434\u0456\u04A3 \u0436\u0430\u0493\u0434\u0430\u0439 \u043E\u0441\u044B \u0435\u0440\u0435\u0436\u0435\u0433\u0435 \u0436\u0430\u0442\u0430\u0434\u044B (S \u2013 M) = \u0431\u0456\u0437\u0434\u0456\u04A3 \u0436\u0430\u0493\u0434\u0430\u0439\u0493\u0430 \u0435\u0440\u0435\u0436\u0435 \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0434\u044B (S \u2013 P).",life:"\u0411\u0430\u0440\u043B\u044B\u049B 18 \u0436\u0430\u0441\u049B\u0430 \u0442\u043E\u043B\u0493\u0430\u043D\u0434\u0430\u0440 \u0441\u0430\u0439\u043B\u0430\u0443\u0493\u0430 \u049B\u0430\u0442\u044B\u0441\u0430 \u0430\u043B\u0430\u0434\u044B. \u0410\u0439\u0433\u04AF\u043B 18 \u0436\u0430\u0441\u0442\u0430. \u041E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, \u0410\u0439\u0433\u04AF\u043B \u0441\u0430\u0439\u043B\u0430\u0443\u0493\u0430 \u049B\u0430\u0442\u044B\u0441\u0430 \u0430\u043B\u0430\u0434\u044B \u2013 \u043A\u04AF\u043D\u0434\u0435\u043B\u0456\u043A\u0442\u0456 \u04E9\u043C\u0456\u0440\u0434\u0435\u0433\u0456 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C.",summary:"\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B\u043D\u0430 \u043A\u0435\u043F\u0456\u043B\u0434\u0456\u043A \u0431\u0435\u0440\u0435\u0434\u0456. \u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u0435\u0440\u0435\u0436\u0435\u043B\u0435\u0440\u0456\u043D \u0436\u04D9\u043D\u0435 \u0448\u0430\u0440\u0442\u0442\u044B \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443\u0434\u044B\u04A3 \u0434\u04B1\u0440\u044B\u0441 \u043C\u043E\u0434\u0443\u0441\u0442\u0430\u0440\u044B\u043D \u0431\u0456\u043B\u0443 \u043E\u049B\u0443\u0448\u044B\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435\u0433\u0456 \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u049B\u0430\u0442\u0435\u043B\u0435\u0440\u0434\u0435\u043D \u0441\u0430\u049B\u0442\u0430\u0439\u0434\u044B."}],workedExamples:[{title:"\u041F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443\u0456",problem:"\xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0436\u0430\u0439 \u0441\u0430\u043D\u0434\u0430\u0440 \u0442\u0430\u049B\xBB \u043F\u0430\u0439\u044B\u043C\u044B\u043D \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u043F, \u049B\u0430\u0439\u0441\u044B\u0441\u044B\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442 \u0435\u043A\u0435\u043D\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u04A3\u0434\u0430\u0440.",steps:["\u041F\u0430\u0439\u044B\u043C A \u0442\u04AF\u0440\u0456\u043D\u0434\u0435: \xAB\u0411\u0430\u0440\u043B\u044B\u049B S \u2013 P\xBB. \u041E\u043D\u044B\u04A3 \u049B\u0430\u0439\u0448\u044B\u0441\u044B \u2013 O \u0442\u04AF\u0440\u0456: \xAB\u041A\u0435\u0439\u0431\u0456\u0440 S \u2013 P \u0435\u043C\u0435\u0441\xBB.","\u0422\u0435\u0440\u0456\u0441\u0442\u0435\u0443: \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0436\u0430\u0439 \u0441\u0430\u043D\u0434\u0430\u0440 \u0442\u0430\u049B \u0435\u043C\u0435\u0441\xBB.","2 \u2013 \u0436\u0430\u0439 \u04D9\u0440\u0456 \u0436\u04B1\u043F \u0441\u0430\u043D, \u0434\u0435\u043C\u0435\u043A \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443 \u0430\u049B\u0438\u049B\u0430\u0442, \u0430\u043B \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u043F\u0430\u0439\u044B\u043C \u0436\u0430\u043B\u0493\u0430\u043D."]},{title:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0456 \u0442\u0430\u043B\u0434\u0430\u0443",problem:"\u0411\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0440\u043E\u043C\u0431. \u0411\u0430\u0440\u043B\u044B\u049B \u0440\u043E\u043C\u0431\u0442\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440. \u049A\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0448\u044B\u0493\u0430\u0440\u044B\u043F, \u0442\u0435\u0440\u043C\u0438\u043D\u0434\u0435\u0440\u0456\u043D \u0430\u0442\u0430\u04A3\u0434\u0430\u0440.",steps:["\u049A\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B: \u0431\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440.","S = \u043A\u0432\u0430\u0434\u0440\u0430\u0442 (\u043A\u0456\u0448\u0456 \u0442\u0435\u0440\u043C\u0438\u043D), P = \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 \u0444\u0438\u0433\u0443\u0440\u0430 (\u04AF\u043B\u043A\u0435\u043D \u0442\u0435\u0440\u043C\u0438\u043D), M = \u0440\u043E\u043C\u0431 (\u043E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D).","M \u0431\u0456\u0440\u0456\u043D\u0448\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435 (\xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0440\u043E\u043C\u0431\u2026\xBB) \u0442\u043E\u043B\u044B\u049B \u043A\u04E9\u043B\u0435\u043C\u0434\u0435 \u0430\u043B\u044B\u043D\u0493\u0430\u043D \u2013 \u0435\u0440\u0435\u0436\u0435 \u0441\u0430\u049B\u0442\u0430\u043B\u0493\u0430\u043D, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0434\u04B1\u0440\u044B\u0441."]},{title:"\u0418\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u043D\u044B\u04A3 \u0448\u0435\u0433\u0456",problem:"2\u207F > n\xB2 \u0442\u0435\u04A3\u0441\u0456\u0437\u0434\u0456\u0433\u0456 n = 5, 6, 7 \u04AF\u0448\u0456\u043D \u0430\u049B\u0438\u049B\u0430\u0442. \u0411\u04B1\u043B \u0431\u0430\u0440\u043B\u044B\u049B \u043D\u0430\u0442\u0443\u0440\u0430\u043B n \u04AF\u0448\u0456\u043D \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0430?",steps:["n = 3: 8 > 9 \u2013 \u0436\u0430\u043B\u0493\u0430\u043D. \u0414\u0435\u043C\u0435\u043A, \xAB\u0431\u0430\u0440\u043B\u044B\u049B n \u04AF\u0448\u0456\u043D\xBB \u0434\u0435\u0433\u0435\u043D \u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0436\u0430\u043B\u0493\u0430\u043D.","\u0414\u04B1\u0440\u044B\u0441 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C: n \u2265 5 \u0431\u043E\u043B\u0493\u0430\u043D\u0434\u0430 2\u207F > n\xB2. \u041E\u043D\u044B \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u04D9\u0434\u0456\u0441\u0456\u043C\u0435\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B."]}],practice:[{task:"\xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u0434\u0430\u0440 \u0440\u043E\u043C\u0431 \u0431\u043E\u043B\u0430\u0434\u044B\xBB \u043F\u0430\u0439\u044B\u043C\u044B\u043D\u044B\u04A3 S, P \u0436\u04D9\u043D\u0435 \u043A\u043E\u043F\u0443\u043B\u0430\u0441\u044B\u043D, \u0442\u04AF\u0440\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u04A3\u0434\u0430\u0440.",answer:"S \u2013 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u0434\u0430\u0440, P \u2013 \u0440\u043E\u043C\u0431, \u043A\u043E\u043F\u0443\u043B\u0430 \u2013 \xAB\u0431\u043E\u043B\u0430\u0434\u044B\xBB; I \u0442\u04AF\u0440\u0456 (\u0456\u0448\u0456\u043D\u0430\u0440\u0430 \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0443)."},{task:"\xAB\u0415\u0448\u0431\u0456\u0440 \u0436\u0430\u0439 \u0441\u0430\u043D \u0436\u04B1\u043F \u0435\u043C\u0435\u0441\xBB \u043F\u0430\u0439\u044B\u043C\u044B \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0430? \u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u043E\u043D\u044B\u04A3 \u049B\u0430\u0439\u0448\u044B\u0441\u044B\u043D \u0436\u0430\u0437\u044B\u04A3\u0434\u0430\u0440.",answer:"\u0416\u0430\u043B\u0493\u0430\u043D (2 \u2013 \u0436\u0430\u0439, \u0436\u04B1\u043F). \u049A\u0430\u0439\u0448\u044B\u0441\u044B: \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0436\u0430\u0439 \u0441\u0430\u043D\u0434\u0430\u0440 \u0436\u04B1\u043F\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442."},{task:"\xAB\u0415\u0433\u0435\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u0435\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B \u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456\xBB \u043F\u0430\u0439\u044B\u043C\u044B\u043D\u0430\u043D \u043C\u043E\u0434\u0443\u0441 \u0442\u043E\u043B\u043B\u0435\u043D\u0441 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0436\u0430\u0441\u0430\u04A3\u0434\u0430\u0440.",answer:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u0435\u043C\u0435\u0441; \u043E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, \u043E\u043B \u0442\u0435\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B \u0435\u043C\u0435\u0441."},{task:"1 + 2 + \u2026 + n = n(n + 1)/2 \u0442\u0435\u04A3\u0434\u0456\u0433\u0456\u043D \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u04D9\u0434\u0456\u0441\u0456\u043C\u0435\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u04A3\u0434\u0435\u0440.",answer:"n = 1: 1 = 1. k(k+1)/2 + (k+1) = (k+1)(k+2)/2."},{task:"\u0428\u0435\u04A3\u0431\u0435\u0440 \u043C\u0435\u043D \u0448\u0430\u0440 \u0430\u0440\u0430\u0441\u044B\u043D\u0434\u0430\u0493\u044B \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F\u043D\u044B \u049B\u04B1\u0440\u044B\u043F, \u0431\u0456\u0440 \u0434\u04B1\u0440\u044B\u0441 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0436\u0430\u0441\u0430\u04A3\u0434\u0430\u0440.",answer:"\u0428\u0435\u04A3\u0431\u0435\u0440\u0434\u0456\u04A3 \u0436\u0430\u043D\u0430\u043C\u0430\u0441\u044B \u0440\u0430\u0434\u0438\u0443\u0441\u049B\u0430 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 \u2192 \u0448\u0430\u0440\u0434\u044B\u04A3 \u0436\u0430\u043D\u0430\u043C\u0430 \u0436\u0430\u0437\u044B\u049B\u0442\u044B\u0493\u044B \u0440\u0430\u0434\u0438\u0443\u0441\u049B\u0430 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 (\u0430\u049B\u0438\u049B\u0430\u0442)."}],conclusion:["\u041F\u0430\u0439\u044B\u043C \u2013 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u049B \u043C\u04D9\u043D\u0456 \u0431\u0430\u0440 \u043E\u0439\u043B\u0430\u0443 \u0444\u043E\u0440\u043C\u0430\u0441\u044B, \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u2013 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u0434\u0430\u043D \u0436\u0430\u04A3\u0430 \u043F\u0430\u0439\u044B\u043C \u0448\u044B\u0493\u0430\u0440\u0443 \u0442\u04D9\u0441\u0456\u043B\u0456. \u041E\u0439\u043B\u0430\u0443\u0434\u044B\u04A3 \u0442\u04E9\u0440\u0442 \u0437\u0430\u04A3\u044B \u043A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u0434\u04B1\u0440\u044B\u0441 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0443\u0434\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0456 \u0431\u043E\u043B\u044B\u043F \u0442\u0430\u0431\u044B\u043B\u0430\u0434\u044B.","\u0418\u043D\u0434\u0443\u043A\u0446\u0438\u044F \u043C\u0435\u043D \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F \u0436\u0430\u04A3\u0430 \u0437\u0430\u04A3\u0434\u044B\u043B\u044B\u049B\u0442\u0430\u0440\u0434\u044B \u0430\u0448\u0443\u0493\u0430 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456, \u0430\u043B \u0434\u0435\u0434\u0443\u043A\u0446\u0438\u044F \u043E\u043B\u0430\u0440\u0434\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0439\u0434\u0456. \u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u0434\u0430\u0493\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u2013 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u043C\u0435\u043D \u0448\u0430\u0440\u0442\u0442\u044B \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443\u043B\u0430\u0440\u0434\u044B\u04A3 \u0442\u0456\u0437\u0431\u0435\u0433\u0456."],questions:["\u041F\u0430\u0439\u044B\u043C \u0434\u0435\u0433\u0435\u043D\u0456\u043C\u0456\u0437 \u043D\u0435? \u041E\u043D\u044B\u04A3 \u049B\u04B1\u0440\u0430\u043C\u0434\u0430\u0441 \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u0440\u0456\u043D \u0430\u0442\u0430\u04A3\u0434\u0430\u0440.","A, I, E, O \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u044B\u043D\u0430 \u043C\u044B\u0441\u0430\u043B \u043A\u0435\u043B\u0442\u0456\u0440\u0456\u04A3\u0434\u0435\u0440.","\u041E\u0439\u043B\u0430\u0443\u0434\u044B\u04A3 \u0442\u04E9\u0440\u0442 \u0437\u0430\u04A3\u044B\u043D \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u0434\u0430\u043F, \u04D9\u0440\u049B\u0430\u0439\u0441\u044B\u0441\u044B\u043D\u0430 \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u0434\u0430\u043D \u043C\u044B\u0441\u0430\u043B \u043A\u0435\u043B\u0442\u 3E\u049B\u044B\u043F-\u04AF\u0439\u0440\u0435\u043D\u0443 \u0435\u043D\u0433\u0456\u0437\u0443, \u043C\u0435\u04A3\u0433\u0435\u0440\u0443 \u0436\u04D9\u043D\u0435 \u0431\u0435\u043A\u0456\u0442\u0443 \u043A\u0435\u0437\u0435\u04A3\u0434\u0435\u0440\u0456\u043D\u0435\u043D \u0442\u04B1\u0440\u0430\u0434\u044B. \u0415\u043D\u0433\u0456\u0437\u0443 \u043A\u0435\u0437\u0435\u04A3\u0456\u043D\u0434\u0435 \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u04E9\u0437\u0434\u0435\u0440\u0456 \u0430\u0448\u0430\u0442\u044B\u043D\u0434\u0430\u0439 \u043D\u0435\u043C\u0435\u0441\u0435 \u043E\u043D\u044B \u0442\u04AF\u0441\u0456\u043D\u0443\u0433\u0435 \u0434\u0430\u0439\u044B\u043D\u0434\u0430\u043B\u0430\u0442\u044B\u043D\u0434\u0430\u0439 \u0436\u0430\u0493\u0434\u0430\u0439 \u0436\u0430\u0441\u0430\u043B\u0430\u0434\u044B. \u041C\u0435\u04A3\u0433\u0435\u0440\u0443 \u2013 \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u049B\u0430\u0442\u0435\u0441\u0456\u0437 \u0435\u0441\u0442\u0435 \u0441\u0430\u049B\u0442\u0430\u0443, \u04D9\u0440 \u0441\u04E9\u0437\u0456\u043D\u0456\u04A3 \u043C\u0430\u0493\u044B\u043D\u0430\u0441\u044B\u043D \u0442\u04AF\u0441\u0456\u043D\u0443 \u0436\u04D9\u043D\u0435 \u049B\u043E\u043B\u0434\u0430\u043D\u0430 \u0431\u0456\u043B\u0443. \u0411\u0435\u043A\u0456\u0442\u0443 \u2013 \u049B\u0430\u0439\u0442\u0430\u043B\u0430\u0443 \u0436\u04D9\u043D\u0435 \u0435\u0441\u0435\u043F \u0448\u044B\u0493\u0430\u0440\u0443.","\u0415\u043D\u0433\u0456\u0437\u0443\u0434\u0456\u04A3 \u04AF\u0448 \u0442\u04D9\u0441\u0456\u043B\u0456 \u0431\u0430\u0440. I \u0442\u04D9\u0441\u0456\u043B\u0434\u0435 \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u04E9\u0437\u0434\u0435\u0440\u0456 \xAB\u0430\u0448\u0430\u0434\u044B\xBB. II \u0442\u04D9\u0441\u0456\u043B\u0434\u0435 \u043E\u043B\u0430\u0440 \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443\u0493\u0430 \u0434\u0430\u0439\u044B\u043D\u0434\u0430\u043B\u0430\u0434\u044B, \u0430\u043B \u0442\u04B1\u0436\u044B\u0440\u044B\u043C \u0434\u0430\u0439\u044B\u043D \u0442\u04AF\u0440\u0434\u0435 \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456. \u0411\u04B1\u043B \u0435\u043A\u0435\u0443\u0456 \u2013 \u043D\u0430\u049B\u0442\u044B-\u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0442\u04D9\u0441\u0456\u043B. III \u0442\u04D9\u0441\u0456\u043B\u0434\u0435 \u043C\u04B1\u0493\u0430\u043B\u0456\u043C \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u0431\u0456\u0440\u0434\u0435\u043D \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u0434\u0430\u0439\u0434\u044B (\u0430\u0431\u0441\u0442\u0440\u0430\u043A\u0442\u0456\u043B\u0456-\u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0442\u04D9\u0441\u0456\u043B), \u0430\u043B \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0443\u0430\u049B\u044B\u0442 \u043C\u0435\u04A3\u0433\u0435\u0440\u0443 \u043C\u0435\u043D \u0431\u0435\u043A\u0456\u0442\u0443\u0433\u0435 \u0436\u04B1\u043C\u0441\u0430\u043B\u0430\u0434\u044B.","\u041D\u0430\u049B\u0442\u044B-\u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0442\u04D9\u0441\u0456\u043B\u0434\u0435 \u043C\u0430\u049B\u0441\u0430\u0442\u0442\u044B \u0442\u0430\u04A3\u0434\u0430\u043B\u0493\u0430\u043D \u0435\u0441\u0435\u043F\u0442\u0435\u0440 \u04D9\u0434\u0456\u0441\u0456 \u0442\u0438\u0456\u043C\u0434\u0456: \u043C\u04B1\u0493\u0430\u043B\u0456\u043C \u0440\u0435\u0442\u0456\u043C\u0435\u043D \u043E\u0439\u043B\u0430\u0441\u0442\u044B\u0440\u044B\u043B\u0493\u0430\u043D \u0442\u0430\u043F\u0441\u044B\u0440\u043C\u0430\u043B\u0430\u0440 \u0431\u0435\u0440\u0435\u0434\u0456, \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u043E\u043B\u0430\u0440\u0434\u044B \u043E\u0440\u044B\u043D\u0434\u0430\u043F, \u0441\u04E9\u0439\u043B\u0435\u043C\u0433\u0435 \u04E9\u0437\u0434\u0435\u0440\u0456 \u043A\u0435\u043B\u0435\u0434\u0456."],definitions:[{term:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C",text:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440 \u0442\u0443\u0440\u0430\u043B\u044B \u043F\u0430\u0439\u044B\u043C\u0434\u044B \u04E9\u0440\u043D\u0435\u043A\u0442\u0435\u0439\u0442\u0456\u043D \u0441\u04E9\u0439\u043B\u0435\u043C: \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430, \u0430\u043A\u0441\u0438\u043E\u043C\u0430, \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0442.\u0431."},{term:"\u041C\u0430\u049B\u0441\u0430\u0442\u0442\u044B \u0442\u0430\u04A3\u0434\u0430\u043B\u0493\u0430\u043D \u0435\u0441\u0435\u043F\u0442\u0435\u0440 \u04D9\u0434\u0456\u0441\u0456",text:"\u041E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u0440\u0435\u0442\u0456\u043C\u0435\u043D \u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D \u0442\u0430\u043F\u0441\u044B\u0440\u043C\u0430\u043B\u0430\u0440\u0434\u044B \u043E\u0440\u044B\u043D\u0434\u0430\u043F, \u0436\u0430\u04A3\u0430 \u0441\u04E9\u0439\u043B\u0435\u043C\u0433\u0435 \u04E9\u0437\u0434\u0435\u0440\u0456 \u043A\u0435\u043B\u0435\u0442\u0456\u043D \u04D9\u0434\u0456\u0441."},{term:"\u041A\u043E\u043D\u0442\u0440\u043C\u044B\u0441\u0430\u043B",text:"\u0416\u0430\u043B\u043F\u044B \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u0493\u0430 \u0431\u0430\u0493\u044B\u043D\u0431\u0430\u0439\u0442\u044B\u043D, \u043E\u043D\u044B\u04A3 \u0436\u0430\u043B\u0493\u0430\u043D\u0434\u044B\u0493\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0442\u0456\u043D \u043D\u0430\u049B\u0442\u044B \u043C\u044B\u0441\u0430\u043B."}],formulas:[{expr:"\u0415\u043D\u0433\u0456\u0437\u0443 \u2192 \u041C\u0435\u04A3\u0433\u0435\u0440\u0443 \u2192 \u0411\u0435\u043A\u0456\u0442\u0443",note:"\u043E\u049B\u044B\u043F-\u04AF\u0439\u0440\u0435\u043D\u0443 \u043A\u0435\u0437\u0435\u04A3\u0434\u0435\u0440\u0456"}],figure:{type:"sentence-stages",caption:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u043E\u049B\u044B\u043F-\u04AF\u0439\u0440\u0435\u043D\u0443\u0434\u0456\u04A3 \u04AF\u0448 \u043A\u0435\u0437\u0435\u04A3\u0456."},examples:[{title:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043D\u044B \xAB\u0430\u0448\u0443\xBB (I \u0442\u04D9\u0441\u0456\u043B)",text:"1) \u0411\u0456\u0440 \u043D\u04AF\u043A\u0442\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u043D\u0435\u0448\u0435 \u0442\u04AF\u0437\u0443 \u0436\u04AF\u0440\u0433\u0456\u0437\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B? (\u0448\u0435\u043A\u0441\u0456\u0437 \u043A\u04E9\u043F) 2) \u0415\u043A\u0456 \u043D\u04AF\u043A\u0442\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u0442\u04AF\u0437\u0443 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043F, \u0431\u0430\u0441\u049B\u0430\u0441\u044B\u043D \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043F \u043A\u04E9\u0440. 3) \u0415\u043A\u0456 \u043D\u04AF\u043A\u0442\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u043D\u0435\u0448\u0435 \u0442\u04AF\u0437\u0443 \u04E9\u0442\u0435\u0434\u0456? \u049A\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B: \u043A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u0435\u043A\u0456 \u043D\u04AF\u043A\u0442\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u0431\u0456\u0440 \u0436\u04D9\u043D\u0435 \u0442\u0435\u043A \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u0442\u04AF\u0437\u0443 \u0436\u04AF\u0440\u0433\u0456\u0437\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B."},{title:"\u0411\u0435\u043A\u0456\u0442\u0443\u0433\u0435 \u0430\u0440\u043D\u0430\u043B\u0493\u0430\u043D \u043A\u043E\u043D\u0442\u0440\u043C\u044B\u0441\u0430\u043B",text:"\xAB\u0414\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u2013 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u044B\u043D\u0430 \u043A\u043E\u043D\u0442\u0440\u043C\u044B\u0441\u0430\u043B \u2013 \u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u0442\u0440\u0430\u043F\u0435\u0446\u0438\u044F."}],simple:"\u0410\u043B\u0434\u044B\u043C\u0435\u043D \u0442\u0430\u043D\u044B\u0441\u0442\u044B\u0440, \u0441\u043E\u0441\u044B\u043D \u0442\u04AF\u0441\u0456\u043D\u0434\u0456\u0440, \u0441\u043E\u04A3\u044B\u043D\u0434\u0430 \u049B\u0430\u0439\u0442\u0430\u043B\u0430\u0442 \u2013 \u043A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u0435\u0440\u0435\u0436\u0435\u043D\u0456 \u04AF\u0439\u0440\u0435\u043D\u0443\u0434\u0456\u04A3 \u0436\u043E\u043B\u044B.",life:"\u0412\u0435\u043B\u043E\u0441\u0438\u043F\u0435\u0434 \u0442\u0435\u0431\u0443\u0434\u0456 \u04AF\u0439\u0440\u0435\u043D\u0443 \u0434\u0435 \u043E\u0441\u044B\u043B\u0430\u0439: \u0430\u043B\u0434\u044B\u043C\u0435\u043D \u043A\u04E9\u0440\u0435\u0441\u0456\u04A3 (\u0435\u043D\u0433\u0456\u0437\u0443), \u0441\u043E\u0441\u044B\u043D \u0442\u0435\u0443\u0456\u043F \u043A\u04E9\u0440\u0435\u0441\u0456\u04A3 (\u043C\u0435\u04A3\u0433\u0435\u0440\u0443), \u043A\u04AF\u043D\u0434\u0435 \u0442\u0435\u0431\u0435\u0441\u0456\u04A3 (\u0431\u0435\u043A\u0456\u0442\u0443).",summary:"\u0421\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u0435\u043D\u0433\u0456\u0437\u0443 \u0442\u04D9\u0441\u0456\u043B\u0456\u043D \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u0434\u044B\u04A3 \u049B\u0438\u044B\u043D\u0434\u044B\u0493\u044B\u043D\u0430, \u0443\u0430\u049B\u044B\u0442\u049B\u0430 \u0436\u04D9\u043D\u0435 \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B\u04A3 \u0434\u0430\u0439\u044B\u043D\u0434\u044B\u0493\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0442\u0430\u04A3\u0434\u0430\u0439\u0434\u044B. \u04AE\u0448 \u043A\u0435\u0437\u0435\u04A3 \u0434\u0435 \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456."},{id:"t10-2",title:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430 \u0436\u04D9\u043D\u0435 \u043E\u0493\u0430\u043D \u049B\u043E\u0439\u044B\u043B\u0430\u0442\u044B\u043D \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440",lead:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430 \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043C\u0435\u0441\u0456\u0437 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u043D\u0430\u0442\u044B\u043D \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u0441\u04E9\u0439\u043B\u0435\u043C. \u0411\u0430\u0440\u043B\u044B\u049B \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0430\u049B\u044B\u0440 \u0441\u043E\u04A3\u044B\u043D\u0434\u0430 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440\u0493\u0430 \u0441\u04AF\u0439\u0435\u043D\u0435\u0434\u0456.",theory:["\u0410\u043A\u0441\u0438\u043E\u043C\u0430 (\u0433\u0440\u0435\u043A\u0448\u0435 axi\u014Dma \u2013 \u043C\u043E\u0439\u044B\u043D\u0434\u0430\u043B\u0493\u0430\u043D \u049B\u0430\u0493\u0438\u0434\u0430) \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u049B\u0430\u0441\u0438\u0435\u0442\u0442\u0435\u0440\u0456\u043D \u04E9\u0440\u043D\u0435\u043A\u0442\u0435\u0439\u0434\u0456. \u041F\u043E\u0441\u0442\u0443\u043B\u0430\u0442 (\u043B\u0430\u0442. postulatum \u2013 \u0442\u0430\u043B\u0430\u043F) \u2013 \u049B\u0430\u0437\u0456\u0440\u0433\u0456 \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u0434\u0430 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043D\u044B\u04A3 \u0441\u0438\u043D\u043E\u043D\u0438\u043C\u0456. \u0415\u0432\u043A\u043B\u0438\u0434\u0442\u0456\u04A3 \xAB\u041D\u0435\u0433\u0456\u0437\u0434\u0435\u0440\u0456\u043D\u0434\u0435\xBB \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C\u0434\u0456\u043A \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0441\u044B \xAB\u0431\u0435\u0441\u0456\u043D\u0448\u0456 \u043F\u043E\u0441\u0442\u0443\u043B\u0430\u0442\xBB \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0493\u0430\u043D.","\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0436\u04AF\u0439\u0435\u0441\u0456\u043D\u0435 \u04AF\u0448 \u0442\u0430\u043B\u0430\u043F \u049B\u043E\u0439\u044B\u043B\u0430\u0434\u044B. \u0422\u04D9\u0443\u0435\u043B\u0441\u0456\u0437\u0434\u0456\u043A: \u0435\u0448\u0431\u0456\u0440 \u0430\u043A\u0441\u0438\u043E\u043C\u0430 \u0431\u0430\u0441\u049B\u0430\u043B\u0430\u0440\u044B\u043D\u0430\u043D \u0448\u044B\u0493\u0430\u0440\u044B\u043B\u043C\u0430\u0443\u044B \u043A\u0435\u0440\u0435\u043A. \u049A\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u0441\u044B\u0437\u0434\u044B\u049B: \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440\u0434\u0430\u043D \u0431\u0456\u0440 \u043F\u0430\u0439\u044B\u043C \u043C\u0435\u043D \u043E\u043D\u044B\u04A3 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443\u0456 \u049B\u0430\u0442\u0430\u0440 \u0448\u044B\u049B\u043F\u0430\u0443\u044B \u043A\u0435\u0440\u0435\u043A. \u0422\u043E\u043B\u044B\u049B\u0442\u044B\u049B: \u0436\u04AF\u0439\u0435\u0433\u0435 \u0442\u04D9\u0443\u0435\u043B\u0441\u0456\u0437 \u04D9\u0440\u0456 \u049B\u0430\u0439\u0448\u044B \u043A\u0435\u043B\u043C\u0435\u0439\u0442\u0456\u043D \u0436\u0430\u04A3\u0430 \u0430\u043A\u0441\u0438\u043E\u043C\u0430 \u049B\u043E\u0441\u0443 \u043C\u04AF\u043C\u043A\u0456\u043D \u0435\u043C\u0435\u0441.","\u041C\u0435\u043A\u0442\u0435\u043F \u043F\u043B\u0430\u043D\u0438\u043C\u0435\u0442\u0440\u0438\u044F\u0441\u044B (\u0410.\u0412. \u041F\u043E\u0433\u043E\u0440\u0435\u043B\u043E\u0432) \u0431\u0435\u0441 \u0442\u043E\u043F \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0493\u0430 \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u043B\u0435\u0434\u0456: \u0442\u0438\u0456\u0441\u0442\u0456\u043B\u0456\u043A, \u043E\u0440\u043D\u0430\u043B\u0430\u0441\u0443, \u04E9\u043B\u0448\u0435\u0443, \u04E9\u043B\u0448\u0435\u043F \u0441\u0430\u043B\u0443 \u0436\u04D9\u043D\u0435 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C\u0434\u0456\u043A \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440\u044B. \u0415\u0432\u043A\u043B\u0438\u0434\u0442\u0456\u04A3 \u0431\u0435\u0441\u0456\u043D\u0448\u0456 \u043F\u043E\u0441\u0442\u0443\u043B\u0430\u0442\u044B\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u0435\u043A\u0456 \u043C\u044B\u04A3 \u0436\u044B\u043B \u0431\u043E\u0439\u044B \u0442\u0430\u043B\u043F\u044B\u043D\u0493\u0430\u043D; \u041D.\u0418. \u041B\u043E\u0431\u0430\u0447\u0435\u0432\u0441\u043A\u0438\u0439\u0434\u0456\u04A3 \u0435\u04A3\u0431\u0435\u043A\u0442\u0435\u0440\u0456\u043D\u0435\u043D \u043A\u0435\u0439\u0456\u043D \u043E\u043D\u044B\u04A3 \u0442\u04D9\u0443\u0435\u043B\u0441\u0456\u0437 \u0435\u043A\u0435\u043D\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0456 \u0431\u043E\u043B\u0434\u044B."],definitions:[{term:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430",text:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u043C\u0435\u0441\u0456\u0437 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u043D\u0430\u0442\u044B\u043D, \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u049B\u0430\u0441\u0438\u0435\u0442\u0442\u0435\u0440\u0456\u043D \u04E9\u0440\u043D\u0435\u043A\u0442\u0435\u0439\u0442\u0456\u043D \u0441\u04E9\u0439\u043B\u0435\u043C."},{term:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440\u0434\u044B\u04A3 \u0442\u04D9\u0443\u0435\u043B\u0441\u0456\u0437\u0434\u0456\u0433\u0456",text:"\u0416\u04AF\u0439\u0435\u0434\u0435\u0433\u0456 \u0435\u0448\u0431\u0456\u0440 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043D\u044B\u04A3 \u0431\u0430\u0441\u049B\u0430\u043B\u0430\u0440\u044B\u043D\u0430\u043D \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u0442\u04AF\u0440\u0434\u0435 \u0448\u044B\u049B\u043F\u0430\u0443\u044B."},{term:"\u049A\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u0441\u044B\u0437\u0434\u044B\u049B",text:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440\u0434\u0430\
