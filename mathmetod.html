1\u04E9\u0439\u043B\u0435\u043C\u0434\u0456 \u0430\u043A\u0441\u0438\u043E\u043C\u0430 \u0435\u0442\u0456\u043F \u0430\u043B\u0443\u0493\u0430 \u0431\u043E\u043B\u043C\u0430\u0439\u0434\u044B \u2013 \u0436\u04AF\u0439\u0435 \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u0442\u044B \u0431\u043E\u043B\u0430\u0434\u044B."},{title:"\u04E8\u043B\u0448\u0435\u0443 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0441\u044B",text:"\u0415\u0433\u0435\u0440 C \u043D\u04AF\u043A\u0442\u0435\u0441\u0456 AB \u043A\u0435\u0441\u0456\u043D\u0434\u0456\u0441\u0456\u043D\u0434\u0435 \u0436\u0430\u0442\u0441\u0430, \u043E\u043D\u0434\u0430 AC + CB = AB. \u041C\u044B\u0441\u0430\u043B\u044B, AC = 3 \u0441\u043C, CB = 5 \u0441\u043C \u0431\u043E\u043B\u0441\u0430, AB = 8 \u0441\u043C."}],simple:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430 \u2013 \u043E\u0439\u044B\u043D\u043D\u044B\u04A3 \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u043E\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043C\u0435\u0439\u043C\u0456\u0437, \u043A\u0435\u043B\u0456\u0441\u0456\u043F \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0439\u043C\u044B\u0437, \u049B\u0430\u043B\u0493\u0430\u043D\u044B\u043D\u044B\u04A3 \u0431\u04D9\u0440\u0456\u043D \u0441\u043E\u0493\u0430\u043D \u0441\u04AF\u0439\u0435\u043D\u0456\u043F \u0448\u044B\u0493\u0430\u0440\u0430\u043C\u044B\u0437.",life:"\u0424\u0443\u0442\u0431\u043E\u043B \u0435\u0440\u0435\u0436\u0435\u0441\u0456\u043D\u0434\u0435 \xAB\u0434\u043E\u043F\u0442\u044B \u049B\u043E\u043B\u043C\u0435\u043D \u04B1\u0441\u0442\u0430\u0443\u0493\u0430 \u0431\u043E\u043B\u043C\u0430\u0439\u0434\u044B\xBB \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u049B\u0430\u0436\u0435\u0442 \u0435\u0442\u043F\u0435\u0439\u0442\u0456\u043D, \u043E\u0439\u044B\u043D\u043D\u044B\u04A3 \u04E9\u0437\u0456\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u0439\u0442\u044B\u043D \u0448\u0430\u0440\u0442.",summary:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0436\u04AF\u0439\u0435\u0441\u0456 \u0442\u04D9\u0443\u0435\u043B\u0441\u0456\u0437, \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u0441\u044B\u0437 \u0436\u04D9\u043D\u0435 \u0442\u043E\u043B\u044B\u049B \u0431\u043E\u043B\u0443\u044B \u043A\u0435\u0440\u0435\u043A. \u041E\u043B \u2013 \u0431\u04AF\u043A\u0456\u043B \u0442\u0435\u043E\u0440\u0438\u044F\u043D\u044B\u04A3 \u0456\u0440\u0433\u0435\u0442\u0430\u0441\u044B."},{id:"t10-3",title:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430 \u0436\u04D9\u043D\u0435 \u043E\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B, \u0442\u04AF\u0440\u043B\u0435\u0440\u0456: \u043A\u0435\u0441\u0456\u043C\u0434\u0456 \u0436\u04D9\u043D\u0435 \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440",lead:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430 \u2013 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0442\u0430\u0493\u0430\u0439\u044B\u043D\u0434\u0430\u043B\u0430\u0442\u044B\u043D \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C.",theory:["\u0422\u0435\u043E\u0440\u0435\u043C\u0430 \u04AF\u0448 \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u043D \u0442\u04B1\u0440\u0430\u0434\u044B: \u0448\u0430\u0440\u0442 (\u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D\u0456), \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B (\u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u043A\u0435\u0440\u0435\u0433\u0456) \u0436\u04D9\u043D\u0435 \u0442\u04AF\u0441\u0456\u043D\u0434\u0456\u0440\u043C\u0435 \u0431\u04E9\u043B\u0456\u043A (\u049B\u0430\u043D\u0434\u0430\u0439 \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440 \u0436\u0438\u044B\u043D\u044B \u049B\u0430\u0440\u0430\u0441\u0442\u044B\u0440\u044B\u043B\u0430\u0434\u044B). \u0411\u04B1\u0440\u044B\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0433\u0435\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D \u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u0448\u044B\u0493\u0430\u0442\u044B\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0441\u0430\u043B\u0434\u0430\u0440, \u0431\u0430\u0441\u049B\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u0430\u0440\u043D\u0430\u043B\u0493\u0430\u043D \u043A\u04E9\u043C\u0435\u043A\u0448\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u043B\u0435\u043C\u043C\u0430 \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0430\u0434\u044B.","\u041A\u0435\u0441\u0456\u043C\u0434\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \xABS \u2013 P\xBB \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456: \xAB\u0412\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0435\u04A3\xBB. \u0428\u0430\u0440\u0442\u0442\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \xAB\u0415\u0433\u0435\u0440 \u2026, \u043E\u043D\u0434\u0430 \u2026\xBB \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456: \xAB\u0415\u0433\u0435\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0432\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B\u0430\u0440 \u0442\u0435\u04A3\xBB. \u041A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u043A\u0435\u0441\u0456\u043C\u0434\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u043C\u0430\u0437\u043C\u04B1\u043D\u044B\u043D \u04E9\u0437\u0433\u0435\u0440\u0442\u043F\u0435\u0439 \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u04AF\u0440\u0433\u0435 \u043A\u0435\u043B\u0442\u0456\u0440\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B; \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u04AF\u0440 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B\u043D \u043A\u04E9\u0440\u0443\u0433\u0435 \u044B\u04A3\u0493\u0430\u0439\u043B\u044B.","\u049A\u04B1\u0440\u044B\u043B\u044B\u043C\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u0436\u0430\u0439 \u0436\u04D9\u043D\u0435 \u049B\u04B1\u0440\u0430\u043C\u0430 \u0431\u043E\u043B\u0430\u0434\u044B. \u049A\u04B1\u0440\u0430\u043C\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0448\u0430\u0440\u0442\u044B \u043D\u0435\u043C\u0435\u0441\u0435 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u043F\u0430\u0439\u044B\u043C\u043D\u0430\u043D \u0442\u04B1\u0440\u0430\u0434\u044B: \xAB\u0415\u0433\u0435\u0440 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0442\u0440\u0430\u043F\u0435\u0446\u0438\u044F \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u043E\u0440\u0442\u0430 \u0441\u044B\u0437\u044B\u0493\u044B \u0442\u0430\u0431\u0430\u043D\u0434\u0430\u0440\u044B\u043D\u0430 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C \u0436\u04D9\u043D\u0435 \u043E\u043B\u0430\u0440\u0434\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B\u043D\u044B\u04A3 \u0436\u0430\u0440\u0442\u044B\u0441\u044B\u043D\u0430 \u0442\u0435\u04A3\xBB."],definitions:[{term:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430",text:"\u0410\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0442\u0430\u0493\u0430\u0439\u044B\u043D\u0434\u0430\u043B\u0430\u0442\u044B\u043D \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C."},{term:"\u0421\u0430\u043B\u0434\u0430\u0440",text:"\u0411\u04B1\u0440\u044B\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0433\u0435\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D \u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u0448\u044B\u0493\u0430\u0442\u044B\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430."},{term:"\u041B\u0435\u043C\u043C\u0430",text:"\u0411\u0430\u0441\u049B\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u04AF\u0448\u0456\u043D \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0442\u044B\u043D \u043A\u04E9\u043C\u0435\u043A\u0448\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430."},{term:"\u049A\u04B1\u0440\u0430\u043C\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430",text:"\u0428\u0430\u0440\u0442\u044B \u043D\u0435\u043C\u0435\u0441\u0435 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0435\u043A\u0456 \u043D\u0435 \u043E\u0434\u0430\u043D \u043A\u04E9\u043F \u043F\u0430\u0439\u044B\u043C\u043D\u0430\u043D \u0442\u04B1\u0440\u0430\u0442\u044B\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430."}],formulas:[{expr:"\u2200x \u2208 M  (A(x) \u21D2 B(x))",note:"\u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u049B\u04B1\u0440\u044B\u043B\u044B\u0441\u044B\u043D\u044B\u04A3 \u0444\u043E\u0440\u043C\u0443\u043B\u0430\u0441\u044B"},{expr:"(A \u2227 B) \u21D2 C ;   A \u21D2 (B\u2081 \u2227 B\u2082)",note:"\u049B\u04B1\u0440\u0430\u043C\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0434\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B"}],figure:{type:"theorem-structure",caption:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B: \u0442\u04AF\u0441\u0456\u043D\u0434\u0456\u0440\u043C\u0435 \u0431\u04E9\u043B\u0456\u043A (\u0436\u0438\u044B\u043D M), \u0448\u0430\u0440\u0442 A(x) \u0436\u04D9\u043D\u0435 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B B(x)."},examples:[{title:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0442\u0430\u043B\u0434\u0430\u0443",text:"\xAB\u0415\u0433\u0435\u0440 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0440\u043E\u043C\u0431 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440\xBB. M \u2013 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0436\u0438\u044B\u043D\u044B; A(x) \u2013 x \u0440\u043E\u043C\u0431; B(x) \u2013 x-\u0442\u0456\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440."},{title:"\u041A\u0435\u0441\u0456\u043C\u0434\u0456\u0434\u0435\u043D \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u04AF\u0440\u0433\u0435",text:"\xAB\u0422\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u0442\u0430\u0431\u0430\u043D\u044B\u043D\u0434\u0430\u0493\u044B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0435\u04A3\xBB \u2192 \xAB\u0415\u0433\u0435\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u0442\u0430\u0431\u0430\u043D\u044B\u043D\u0434\u0430\u0493\u044B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0435\u04A3\xBB."}],simple:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430 = \xAB\u0415\u0433\u0435\u0440 \u043C\u044B\u043D\u0430\u0443 \u0431\u0435\u0440\u0456\u043B\u0441\u0435 (\u0448\u0430\u0440\u0442), \u043E\u043D\u0434\u0430 \u0430\u043D\u0430\u0443 \u043E\u0440\u044B\u043D\u0434\u0430\u043B\u0430\u0434\u044B (\u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B)\xBB.",life:"\xAB\u0415\u0433\u0435\u0440 \u0436\u0430\u04A3\u0431\u044B\u0440 \u0436\u0430\u0443\u0441\u0430, \u043E\u043D\u0434\u0430 \u0436\u0435\u0440 \u0434\u044B\u043C\u049B\u044B\u043B \u0431\u043E\u043B\u0430\u0434\u044B\xBB \u2013 \u04E9\u043C\u0456\u0440\u0434\u0435\u0433\u0456 \u0448\u0430\u0440\u0442\u0442\u044B \u043F\u0430\u0439\u044B\u043C; \u0448\u0430\u0440\u0442\u044B \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0430\u043D\u044B\u049B \u043A\u04E9\u0440\u0456\u043D\u0435\u0434\u0456.",summary:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0448\u0430\u0440\u0442\u044B \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D \u0430\u0436\u044B\u0440\u0430\u0442\u0430 \u0431\u0456\u043B\u0443 \u2013 \u043E\u043D\u044B \u0442\u04AF\u0441\u0456\u043D\u0443\u0434\u0456\u04A3 \u0436\u04D9\u043D\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u0431\u0456\u0440\u0456\u043D\u0448\u0456 \u049B\u0430\u0434\u0430\u043C\u044B."},{id:"t10-4",title:"\u0422\u0443\u0440\u0430 \u0436\u04D9\u043D\u0435 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440, \u043E\u043B\u0430\u0440\u0493\u0430 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440",lead:"\u0411\u0456\u0440 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D \u0442\u0430\u0493\u044B \u04AF\u0448 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u049B\u04B1\u0440\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0434\u044B. \u041E\u043B\u0430\u0440\u0434\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B \u0431\u0456\u0440-\u0431\u0456\u0440\u0456\u043C\u0435\u043D \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u0442\u044B.",theory:["\xAB\u0415\u0433\u0435\u0440 A, \u043E\u043D\u0434\u0430 B\xBB \u2013 \u0442\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430. \u0428\u0430\u0440\u0442\u044B \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D\u044B\u04A3 \u043E\u0440\u043D\u044B\u043D \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u0441\u0430\u049B, \xAB\u0415\u0433\u0435\u0440 B, \u043E\u043D\u0434\u0430 A\xBB \u2013 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0448\u044B\u0493\u0430\u0434\u044B. \u0415\u043A\u0435\u0443\u0456\u043D \u0434\u0435 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0441\u0435\u043A, \xAB\u0415\u0433\u0435\u0440 A \u0435\u043C\u0435\u0441, \u043E\u043D\u0434\u0430 B \u0435\u043C\u0435\u0441\xBB \u2013 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430. \u0410\u043B \xAB\u0415\u0433\u0435\u0440 B \u0435\u043C\u0435\u0441, \u043E\u043D\u0434\u0430 A \u0435\u043C\u0435\u0441\xBB \u2013 \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430.","\u0422\u0443\u0440\u0430 \u0436\u04D9\u043D\u0435 \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u043C\u04D9\u043D\u0434\u0435\u0441 (\u043A\u043E\u043D\u0442\u0440\u043F\u043E\u0437\u0438\u0446\u0438\u044F \u0437\u0430\u04A3\u044B), \u0441\u043E\u043B \u0441\u0438\u044F\u049B\u0442\u044B \u043A\u0435\u0440\u0456 \u0436\u04D9\u043D\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u0434\u0430 \u043C\u04D9\u043D\u0434\u0435\u0441. \u0421\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u04D9\u0440 \u0436\u04B1\u043F\u0442\u0430\u043D \u0431\u0456\u0440\u0435\u0443\u0456\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0436\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456. \u0422\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0493\u0430\u043D\u044B\u043C\u0435\u043D, \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0443\u044B \u043C\u04AF\u043C\u043A\u0456\u043D.","\u0422\u0443\u0440\u0430 \u0436\u04D9\u043D\u0435 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u0435\u043A\u0435\u0443\u0456 \u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0441\u0430, \u043E\u043B\u0430\u0440 \u04E9\u0437\u0430\u0440\u0430 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u0434\u0435\u043F \u0430\u0442\u0430\u043B\u0430\u0434\u044B \u0436\u04D9\u043D\u0435 \xABA \u0441\u043E\u043D\u0434\u0430 \u0436\u04D9\u043D\u0435 \u0442\u0435\u043A \u0441\u043E\u043D\u0434\u0430 \u0493\u0430\u043D\u0430, \u049B\u0430\u0448\u0430\u043D B\xBB \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0431\u0456\u0440\u0456\u043A\u0442\u0456\u0440\u0456\u043B\u0435\u0434\u0456. \u041C\u04B1\u0493\u0430\u043B\u0456\u043C \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B \u04E9\u0437\u0430\u0440\u0430 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0434\u044B\u04A3 \u049B\u0430\u0439\u0441\u044B\u0441\u044B \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u0431\u0435\u043B\u0433\u0456\u0441\u0456\u043D, \u049B\u0430\u0439\u0441\u044B\u0441\u044B \u049B\u0430\u0441\u0438\u0435\u0442\u0456\u043D \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u0439\u0442\u044B\u043D\u044B\u043D \u0430\u0436\u044B\u0440\u0430\u0442\u0443\u0493\u0430 \u04AF\u0439\u0440\u0435\u0442\u0443\u0456 \u043A\u0435\u0440\u0435\u043A."],definitions:[{term:"\u041A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430",text:"\u0422\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0448\u0430\u0440\u0442\u044B \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D\u044B\u04A3 \u043E\u0440\u043D\u044B\u043D \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0430\u043B\u044B\u043D\u0493\u0430\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430."},{term:"\u041A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430",text:"\xAB\u0415\u0433\u0435\u0440 B \u0435\u043C\u0435\u0441, \u043E\u043D\u0434\u0430 A \u0435\u043C\u0435\u0441\xBB \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456, \u0442\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043C\u0435\u043D \u043C\u04D9\u043D\u0434\u0435\u0441 \u0442\u0435\u043E\u0440\u0435\u043C\u0430."},{term:"\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u0431\u0435\u043B\u0433\u0456\u0441\u0456",text:"\u04B0\u0493\u044B\u043C\u0434\u044B \u0430\u043D\u044B\u049B\u0442\u0430\u0443\u0493\u0430 \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A \u0431\u0435\u0440\u0435\u0442\u0456\u043D \u0441\u0438\u043F\u0430\u0442 (\u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0448\u0430\u0440\u0442\u044B\u043D\u0434\u0430 \u0442\u04B1\u0440\u0430\u0434\u044B)."}],formulas:[{expr:"(A \u21D2 B) \u21D4 (\xACB \u21D2 \xACA)",note:"\u043A\u043E\u043D\u0442\u0440\u043F\u043E\u0437\u0438\u0446\u0438\u044F \u0437\u0430\u04A3\u044B"},{expr:"(B \u21D2 A) \u21D4 (\xACA \u21D2 \xACB)",note:"\u043A\u0435\u0440\u0456 \u0436\u04D9\u043D\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u043C\u04D9\u043D\u0434\u0435\u0441"},{expr:"(A \u21D2 B) \u2227 (B \u21D2 A) \u2261 (A \u21D4 B)",note:"\u04E9\u0437\u0430\u0440\u0430 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440"}],figure:{type:"four-theorems",caption:"\u0422\u04E9\u0440\u0442 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u044B: \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C \u0431\u043E\u0439\u044B\u043D\u0434\u0430\u0493\u044B\u043B\u0430\u0440 \u043C\u04D9\u043D\u0434\u0435\u0441."},examples:[{title:"\u041A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0436\u0430\u043B\u0493\u0430\u043D",text:"\u0422\u0443\u0440\u0430: \xAB\u0415\u0433\u0435\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0441\u044B\u0431\u0430\u0439\u043B\u0430\u0441 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B\u0430\u0440\u0434\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B 180\xB0\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442. \u041A\u0435\u0440\u0456: \xAB\u0415\u0433\u0435\u0440 \u0435\u043A\u0456 \u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B 180\xB0 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B\u0430\u0440 \u0441\u044B\u0431\u0430\u0439\u043B\u0430\u0441\xBB \u2013 \u0436\u0430\u043B\u0493\u0430\u043D (\u043C\u044B\u0441\u0430\u043B\u044B, \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C \u0442\u04AF\u0437\u0443\u043B\u0435\u0440\u0434\u0435\u0433\u0456 \u0456\u0448\u043A\u0456 \u0442\u04B1\u0441\u0442\u0430\u0441 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440)."},{title:"\u04E8\u0437\u0430\u0440\u0430 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440",text:"\u041F\u0438\u0444\u0430\u0433\u043E\u0440 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0441\u044B: \xAB\u0415\u0433\u0435\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 c\xB2 = a\xB2 + b\xB2\xBB. \u041E\u0493\u0430\u043D \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0434\u0430 \u0430\u049B\u0438\u049B\u0430\u0442: \xAB\u0415\u0433\u0435\u0440 c\xB2 = a\xB2 + b\xB2 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B\xBB. \u041C\u044B\u0441\u0430\u043B\u044B, 3, 4, 5 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448: 25 = 9 + 16."}],simple:"\u0422\u0443\u0440\u0430 \u043C\u0435\u043D \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u2013 \xAB\u0435\u0433\u0456\u0437\xBB: \u0431\u0456\u0440\u0435\u0443\u0456 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0441\u0430, \u0435\u043A\u0456\u043D\u0448\u0456\u0441\u0456 \u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442. \u0410\u043B \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0431\u04E9\u043B\u0435\u043A \u0442\u0435\u043A\u0441\u0435\u0440\u0443 \u043A\u0435\u0440\u0435\u043A.",life:"\xAB\u0415\u0433\u0435\u0440 \u0430\u0434\u0430\u043C \u0410\u043B\u043C\u0430\u0442\u044B\u0434\u0430 \u0442\u04B1\u0440\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B \u049A\u0430\u0437\u0430\u049B\u0441\u0442\u0430\u043D\u0434\u0430 \u0442\u04B1\u0440\u0430\u0434\u044B\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442. \u041A\u0435\u0440\u0456: \xAB\u0415\u0433\u0435\u0440 \u049A\u0430\u0437\u0430\u049B\u0441\u0442\u0430\u043D\u0434\u0430 \u0442\u04B1\u0440\u0441\u0430, \u043E\u043D\u0434\u0430 \u0410\u043B\u043C\u0430\u0442\u044B\u0434\u0430 \u0442\u04B1\u0440\u0430\u0434\u044B\xBB \u2013 \u0436\u0430\u043B\u0493\u0430\u043D. \u041A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B: \xAB\u0415\u0433\u0435\u0440 \u049A\u0430\u0437\u0430\u049B\u0441\u0442\u0430\u043D\u0434\u0430 \u0442\u04B1\u0440\u043C\u0430\u0441\u0430, \u043E\u043D\u0434\u0430 \u0410\u043B\u043C\u0430\u0442\u044B\u0434\u0430 \u0442\u04B1\u0440\u043C\u0430\u0439\u0434\u044B\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442.",summary:"\u0422\u04E9\u0440\u0442 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0435\u043A\u0456 \u043C\u04D9\u043D\u0434\u0435\u0441 \u0436\u04B1\u043F \u049B\u04B1\u0440\u0430\u0439\u0434\u044B. \u041A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B \u04D9\u0440\u049B\u0430\u0448\u0430\u043D \u0436\u0435\u043A\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u049B\u0430\u0436\u0435\u0442 \u0435\u0442\u0435\u0434\u0456."},{id:"t10-5",title:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0436\u04D9\u043D\u0435 \u043E\u043D\u044B\u04A3 \u049B\u04B1\u0440\u0430\u043C\u0434\u044B \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u0440\u0456",lead:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u2013 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B\u043D \u0431\u04B1\u0440\u044B\u043D\u043D\u0430\u043D \u0431\u0435\u043B\u0433\u0456\u043B\u0456 \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u0443.",theory:["\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u2013 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440\u0434\u0430\u043D, \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u043B\u0430\u0440\u0434\u0430\u043D, \u0431\u04B1\u0440\u044B\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0433\u0435\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0434\u0430\u043D \u0436\u04D9\u043D\u0435 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0448\u0430\u0440\u0442\u044B\u043D\u0430\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0493\u0430 \u043A\u0435\u043B\u0435\u0442\u0456\u043D \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u0430\u043B\u0434\u0430\u0440\u043B\u0430\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456. \u0422\u04D9\u0436\u0456\u0440\u0438\u0431\u0435, \u04E9\u043B\u0448\u0435\u0443, \u0441\u044B\u0437\u0431\u0430 \u043D\u0435\u043C\u0435\u0441\u0435 \u0431\u0456\u0440\u043D\u0435\u0448\  \u0436\u04AF\u0437\u0456\u043D\u0434\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0436\u043E\u043B\u044B \u0430\u043D\u0430\u043B\u0438\u0437 \u0430\u0440\u049B\u044B\u043B\u044B \u0456\u0437\u0434\u0435\u043B\u0456\u043F, \u0441\u0438\u043D\u0442\u0435\u0437 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u044B\u043B\u0430\u0434\u044B.","\u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443: 1) \u0442\u0435\u0437\u0438\u0441\u043A\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u04B1\u0439\u0493\u0430\u0440\u044B\u043C \u0436\u0430\u0441\u0430\u043B\u0430\u0434\u044B; 2) \u043E\u0434\u0430\u043D \u0441\u0430\u043B\u0434\u0430\u0440\u043B\u0430\u0440 \u0448\u044B\u0493\u0430\u0440\u044B\u043B\u0430\u0434\u044B; 3) \u0448\u0430\u0440\u0442\u049B\u0430, \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0493\u0430 \u043D\u0435\u043C\u0435\u0441\u0435 \u0431\u04B1\u0440\u044B\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0433\u0435\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0493\u0430 \u049B\u0430\u0439\u0448\u044B \u0441\u0430\u043B\u0434\u0430\u0440 \u0430\u043B\u044B\u043D\u0430\u0434\u044B; 4) \u04B1\u0439\u0493\u0430\u0440\u044B\u043C \u0436\u0430\u043B\u0493\u0430\u043D, \u0434\u0435\u043C\u0435\u043A \u0442\u0435\u0437\u0438\u0441 \u0430\u049B\u0438\u049B\u0430\u0442. \u0428\u044B\u043D \u043C\u04D9\u043D\u0456\u043D\u0434\u0435 \u0431\u04B1\u043B \u2013 \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443.","\u041C\u0435\u043A\u0442\u0435\u043F\u0442\u0435 \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F, \u0436\u0430\u0493\u0434\u0430\u0439\u043B\u0430\u0440\u0434\u044B \u0442\u043E\u043B\u044B\u049B \u049B\u0430\u0440\u0430\u0441\u0442\u044B\u0440\u0443, \u0432\u0435\u043A\u0442\u043E\u0440\u043B\u044B\u049B \u0436\u04D9\u043D\u0435 \u043A\u043E\u043E\u0440\u0434\u0438\u043D\u0430\u0442\u0430\u043B\u044B\u049B \u04D9\u0434\u0456\u0441\u0442\u0435\u0440 \u0434\u0435 \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0434\u044B."],definitions:[{term:"\u0421\u0438\u043D\u0442\u0435\u0437",text:"\u0428\u0430\u0440\u0442\u0442\u0430\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0493\u0430 \u049B\u0430\u0440\u0430\u0439 \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0442\u0456\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443."},{term:"\u0410\u043D\u0430\u043B\u0438\u0437",text:"\u049A\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0434\u0430\u043D \u0448\u0430\u0440\u0442\u049B\u0430 \u049B\u0430\u0440\u0430\u0439, \u0436\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456 \u0448\u0430\u0440\u0442\u0442\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0442\u0456\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443."},{term:"\u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443",text:"\u0422\u0435\u0437\u0438\u0441\u043A\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u04B1\u0439\u0493\u0430\u0440\u044B\u043C\u043D\u0430\u043D \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u049B\u0430 \u043A\u0435\u043B\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443."}],formulas:[{expr:"(a + b)/2 \u2265 \u221A(ab)  \u21D0  a + b \u2212 2\u221A(ab) \u2265 0  \u21D0  (\u221Aa \u2212 \u221Ab)\xB2 \u2265 0",note:"\u0430\u043D\u0430\u043B\u0438\u0437: \u043E\u0440\u0442\u0430 \u043C\u04D9\u043D\u0434\u0435\u0440 \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u0435\u04A3\u0441\u0456\u0437\u0434\u0456\u043A"},{expr:"\u2220A + \u2220B + \u2220C = 180\xB0",note:"\u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B (\u0441\u0438\u043D\u0442\u0435\u0437)"}],figure:{type:"triangle-sum",caption:"B \u0442\u04E9\u0431\u0435\u0441\u0456 \u0430\u0440\u049B\u044B\u043B\u044B AC-\u0493\u0430 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C DK \u0442\u04AF\u0437\u0443\u0456: \u0430\u0439\u049B\u044B\u0448 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0435\u04A3."},examples:[{title:"\u0421\u0438\u043D\u0442\u0435\u0437: \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B",text:"B \u0430\u0440\u049B\u044B\u043B\u044B DK \u2225 AC \u0436\u04AF\u0440\u0433\u0456\u0437\u0435\u043C\u0456\u0437. \u2220DBA = \u2220A (\u0430\u0439\u049B\u044B\u0448 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440, AB \u2013 \u049B\u0438\u044E\u0448\u044B), \u2220KBC = \u2220C (BC \u2013 \u049B\u0438\u044E\u0448\u044B). \u2220DBA + \u2220B + \u2220KBC = 180\xB0 (\u0436\u0430\u0437\u044B\u04A3\u049B\u044B \u0431\u04B1\u0440\u044B\u0448). \u041E\u043B\u0430\u0439 \u0431\u043E\u043B\u0441\u0430, \u2220A + \u2220B + \u2220C = 180\xB0."},{title:"\u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443",text:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430: \u0431\u0456\u0440 \u0442\u04AF\u0437\u0443\u0433\u0435 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 \u0435\u043A\u0456 \u0442\u04AF\u0437\u0443 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0434\u044B. \u041E\u043B\u0430\u0440 P \u043D\u04AF\u043A\u0442\u0435\u0441\u0456\u043D\u0434\u0435 \u049B\u0438\u044B\u043B\u044B\u0441\u0430\u0434\u044B \u0434\u0435\u043F \u0436\u043E\u0440\u0438\u044B\u049B. \u041E\u043D\u0434\u0430 P \u043D\u04AF\u043A\u0442\u0435\u0441\u0456\u043D\u0435\u043D c \u0442\u04AF\u0437\u0443\u0456\u043D\u0435 \u0435\u043A\u0456 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 \u0442\u04AF\u0441\u0456\u0440\u0456\u043B\u0433\u0435\u043D \u0431\u043E\u043B\u0430\u0434\u044B \u2013 \u0431\u04B1\u043B \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0493\u0430 \u049B\u0430\u0439\u0448\u044B."}],simple:"\u0421\u0438\u043D\u0442\u0435\u0437 \u2013 \xAB\u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D\u043D\u0435\u043D \u0430\u043B\u0493\u0430 \u0436\u04AF\u0440\xBB, \u0430\u043D\u0430\u043B\u0438\u0437 \u2013 \xAB\u043C\u0430\u049B\u0441\u0430\u0442\u0442\u0430\u043D \u0430\u0440\u0442\u049B\u0430 \u049B\u0430\u0440\u0430\u0439 \u0436\u04AF\u0440\xBB, \u049B\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443 \u2013 \xAB\u043A\u0435\u0440\u0456\u0441\u0456\u043D\u0448\u0435 \u0431\u043E\u043B\u0441\u0430 \u043D\u0435 \u0431\u043E\u043B\u0430\u0440 \u0435\u0434\u0456?\xBB.",life:"\u04AE\u0439\u0433\u0435 \u049B\u0430\u0439\u0442\u0443 \u0436\u043E\u043B\u044B\u043D \u0456\u0437\u0434\u0435\u0433\u0435\u043D\u0434\u0435 \u043A\u0430\u0440\u0442\u0430\u0434\u0430\u043D \u04AF\u0439\u0434\u0435\u043D \u0431\u0430\u0441\u0442\u0430\u043F \u043A\u0435\u0440\u0456 \u049B\u0430\u0440\u0430\u0439 \u0436\u04AF\u0440\u0443 \u2013 \u0430\u043D\u0430\u043B\u0438\u0437, \u0430\u043B \u0442\u0430\u0431\u044B\u043B\u0493\u0430\u043D \u0436\u043E\u043B\u043C\u0435\u043D \u04AF\u0439\u0433\u0435 \u0431\u0430\u0440\u0443 \u2013 \u0441\u0438\u043D\u0442\u0435\u0437.",summary:"\u04D8\u0434\u0456\u0441\u0442\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0441\u0438\u043F\u0430\u0442\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0442\u0430\u04A3\u0434\u0430\u0439\u0434\u044B; \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0434\u044B \u0430\u043D\u0430\u043B\u0438\u0437 \u0430\u0440\u049B\u044B\u043B\u044B \u0456\u0437\u0434\u0435\u043D\u0456\u043F, \u0441\u0438\u043D\u0442\u0435\u0437 \u0430\u0440\u049B\u044B\u043B\u044B \u0436\u0430\u0437\u0443\u0493\u0430 \u04AF\u0439\u0440\u0435\u0442\u0443 \u043A\u0435\u0440\u0435\u043A."},{id:"t10-7",title:"\u041C\u0435\u043A\u0442\u0435\u043F\u0442\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u04AF\u0439\u0440\u0435\u0442\u0443 \u043C\u04D9\u0441\u0435\u043B\u0435\u0441\u0456",lead:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u04AF\u0439\u0440\u0435\u0442\u0443 \u2013 \u0431\u0456\u0440\u0442\u0456\u043D\u0434\u0435\u043F \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0442\u0456\u043D \u04B1\u0437\u0430\u049B \u04AF\u0434\u0435\u0440\u0456\u0441.",theory:["\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u043E\u049B\u044B\u0442\u0443\u0434\u0430 \u043C\u044B\u043D\u0430\u043B\u0430\u0440\u0493\u0430 \u043D\u0430\u0437\u0430\u0440 \u0430\u0443\u0434\u0430\u0440\u044B\u043B\u0430\u0434\u044B: \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u043C\u0430\u0437\u043C\u04B1\u043D\u044B\u043D \u0442\u04AF\u0441\u0456\u043D\u0443; \u0448\u0430\u0440\u0442\u044B \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D \u0434\u04D9\u043B \u0430\u043D\u044B\u049B\u0442\u0430\u0443; \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0438\u0434\u0435\u044F\u0441\u044B\u043D \u0431\u0456\u043B\u0443; \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u0436\u04AF\u0440\u0433\u0456\u0437\u0443; \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u043E\u0440\u043D\u044B \u043C\u0435\u043D \u0440\u04E9\u043B\u0456\u043D \u0442\u04AF\u0441\u0456\u043D\u0443; \u043E\u043D\u044B \u0435\u0441\u0435\u043F\u0442\u0435\u0440\u0434\u0435 \u049B\u043E\u043B\u0434\u0430\u043D\u0443.","5\u20136-\u0441\u044B\u043D\u044B\u043F\u0442\u0430\u0440\u0434\u0430 \u0434\u0430\u044F\u0440\u043B\u044B\u049B \u0436\u04B1\u043C\u044B\u0441\u044B \u0436\u04AF\u0440\u0433\u0456\u0437\u0456\u043B\u0435\u0434\u0456: \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u0434\u0430\u0440\u0434\u044B \u0442\u0435\u043A\u0441\u0435\u0440\u0443\u0433\u0435, \xAB\u041D\u0435\u0433\u0435?\xBB \u0434\u0435\u0433\u0435\u043D \u0441\u04B1\u0440\u0430\u049B\u049B\u0430 \u0436\u0430\u0443\u0430\u043F \u0431\u0435\u0440\u0443\u0433\u0435 \u04AF\u0439\u0440\u0435\u043D\u0435\u0434\u0456. 7-\u0441\u044B\u043D\u044B\u043F\u0442\u0430\u043D \u0431\u0430\u0441\u0442\u0430\u043F \u0436\u04AF\u0439\u0435\u043B\u0456 \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0435\u043D\u0433\u0456\u0437\u0456\u043B\u0435\u0434\u0456: \u0430\u043B\u0434\u044B\u043C\u0435\u043D \u043C\u04B1\u0493\u0430\u043B\u0456\u043C \u04AF\u043B\u0433\u0456 \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0434\u0456, \u043A\u0435\u0439\u0456\u043D \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u043C\u04B1\u0493\u0430\u043B\u0456\u043C\u043D\u0456\u04A3 \u0431\u0430\u0441\u0448\u044B\u043B\u044B\u0493\u044B\u043C\u0435\u043D, \u0441\u043E\u04A3\u044B\u043D\u0434\u0430 \u04E9\u0437 \u0431\u0435\u0442\u0442\u0435\u0440\u0456\u043D\u0448\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0439\u0434\u0456.","\u0422\u0438\u0456\u043C\u0434\u0456 \u0442\u04D9\u0441\u0456\u043B\u0434\u0435\u0440: \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u049B\u0430\u0436\u0435\u0442\u0442\u0456\u043B\u0456\u0433\u0456\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0443 (\u0441\u044B\u0437\u0431\u0430\u0493\u0430 \u0430\u043B\u0434\u0430\u043D\u0430\u0442\u044B\u043D \u043C\u044B\u0441\u0430\u043B); \u0441\u044B\u0437\u0431\u0430 \u0441\u0430\u043B\u044B\u043F, \xAB\u0411\u0435\u0440\u0456\u043B\u0433\u0435\u043D\u0456\xBB \u043C\u0435\u043D \xAB\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u043A\u0435\u0440\u0435\u0433\u0456\u043D\xBB \u0436\u0430\u0437\u0443; \u0441\u04B1\u0440\u0430\u049B\u0442\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u0430\u043D\u0430\u043B\u0438\u0437 \u0436\u0430\u0441\u0430\u0443; \xAB\u041F\u0430\u0439\u044B\u043C \u2013 \u041D\u0435\u0433\u0456\u0437\u0434\u0435\u043C\u0435\xBB \u043A\u0435\u0441\u0442\u0435\u0441\u0456\u043D \u0442\u043E\u043B\u0442\u044B\u0440\u0443; \u0434\u0430\u0439\u044B\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435\u0433\u0456 \u049B\u0430\u0442\u0435\u043D\u0456 \u0442\u0430\u0431\u0443; \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0431\u0430\u0441\u049B\u0430 \u0442\u04D9\u0441\u0456\u043B\u043C\u0435\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443."],definitions:[{term:"\u041F\u0440\u043E\u043F\u0435\u0434\u0435\u0432\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0435\u0437\u0435\u04A3",text:"\u0416\u04AF\u0439\u0435\u043B\u0456 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u0434\u0435\u0439\u0456\u043D\u0433\u0456 \u0434\u0430\u044F\u0440\u043B\u044B\u049B \u043A\u0435\u0437\u0435\u04A3\u0456 (5\u20136-\u0441\u044B\u043D\u044B\u043F\u0442\u0430\u0440)."},{term:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0438\u0434\u0435\u044F\u0441\u044B",text:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u049B\u0430\u0434\u0430\u043C\u0434\u0430\u0440\u044B \u043C\u0435\u043D \u0448\u0435\u0448\u0443\u0448\u0456 \u043A\u0456\u043B\u0442\u0456 (\u049B\u043E\u0441\u044B\u043C\u0448\u0430 \u0441\u044B\u0437\u0443, \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0430\u0442\u044B\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430)."}],formulas:[{expr:"\u041F\u0430\u0439\u044B\u043C  |  \u041D\u0435\u0433\u0456\u0437\u0434\u0435\u043C\u0435",note:"\u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u0435\u043A\u0456 \u0431\u0430\u0493\u0430\u043D\u0434\u0430 \u0436\u0430\u0437\u0443"}],figure:{type:"two-column",caption:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \xAB\u041F\u0430\u0439\u044B\u043C \u2013 \u041D\u0435\u0433\u0456\u0437\u0434\u0435\u043C\u0435\xBB \u043A\u0435\u0441\u0442\u0435\u0441\u0456 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u0443."},examples:[{title:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u049B\u0430\u0436\u0435\u0442\u0442\u0456\u043B\u0456\u0433\u0456\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0443",text:"\u041E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0493\u0430 \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0441\u044B\u0437\u044B\u043F, \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D \u04E9\u043B\u0448\u0435\u0442\u0443 \u043A\u0435\u0440\u0435\u043A: \u049B\u043E\u0441\u044B\u043D\u0434\u044B 178\xB0, 181\xB0, 180\xB0 \u0448\u044B\u0493\u0430\u0434\u044B. \xAB\u04E8\u043B\u0448\u0435\u0443 \u0434\u04D9\u043B \u043D\u04D9\u0442\u0438\u0436\u0435 \u0431\u0435\u0440\u043C\u0435\u0439\u0434\u0456, \u04D9\u0440\u0456 \u0431\u0430\u0440\u043B\u044B\u049B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u04E9\u043B\u0448\u0435\u0439 \u0430\u043B\u043C\u0430\u0439\u043C\u044B\u0437\xBB \u2013 \u043E\u0441\u044B\u0434\u0430\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u049B\u0430\u0436\u0435\u0442\u0442\u0456\u043B\u0456\u0433\u0456 \u0442\u0443\u0430\u0434\u044B."},{title:"\u0421\u04B1\u0440\u0430\u049B\u0442\u0430\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u0430\u043D\u0430\u043B\u0438\u0437",text:"\xAB\u2220A + \u2220B + \u2220C = 180\xB0 \u0435\u043A\u0435\u043D\u0456\u043D \u049B\u0430\u043B\u0430\u0439 \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u043C\u0456\u0437?\xBB \u2013 \xAB180\xB0 \u049B\u0430\u0439 \u0436\u0435\u0440\u0434\u0435 \u043A\u0435\u0437\u0434\u0435\u0441\u0435\u0434\u0456?\xBB \u2013 \xAB\u0416\u0430\u0437\u044B\u04A3\u049B\u044B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\xBB. \u2013 \xABB \u0442\u04E9\u0431\u0435\u044 u041A\u043E\u043E\u0440\u0434\u0438\u043D\u0430\u0442\u0430\u043B\u044B\u049B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443",text:"A(0; 0), B(a; 0), D(b; c), C(a + b; c). AC \u043E\u0440\u0442\u0430\u0441\u044B: ((a + b)/2; c/2). BD \u043E\u0440\u0442\u0430\u0441\u044B: ((a + b)/2; c/2). \u041E\u0440\u0442\u0430\u0441\u044B \u0431\u0456\u0440\u0434\u0435\u0439, \u0434\u0435\u043C\u0435\u043A \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440 \u049B\u0438\u044B\u043B\u044B\u0441\u0443 \u043D\u04AF\u043A\u0442\u0435\u0441\u0456\u043D\u0434\u0435 \u049B\u0430\u049B \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456."},{title:"\u0410\u043D\u0430\u043B\u0438\u0437: \u0442\u0435\u04A3\u0441\u0456\u0437\u0434\u0456\u043A",text:"a\xB2 + b\xB2 \u2265 2ab \u21D0 a\xB2 \u2212 2ab + b\xB2 \u2265 0 \u21D0 (a \u2212 b)\xB2 \u2265 0 \u2013 \u0430\u049B\u0438\u049B\u0430\u0442. \u0421\u0438\u043D\u0442\u0435\u0437 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u0493\u0430\u043D\u0434\u0430 \u0442\u0456\u0437\u0431\u0435\u043A\u0442\u0456 \u043A\u0435\u0440\u0456 \u043E\u049B\u0438\u043C\u044B\u0437."}],simple:"\u0411\u0456\u0440 \u0442\u0430\u0443\u0493\u0430 \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456 \u0441\u043E\u049B\u043F\u0430\u049B\u043F\u0435\u043D \u0448\u044B\u0493\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0434\u044B \u2013 \u043C\u0430\u04A3\u044B\u0437\u0434\u044B\u0441\u044B \u0448\u044B\u04A3\u0493\u0430 \u0436\u0435\u0442\u0443, \u0430\u043B \u0436\u043E\u043B\u0434\u044B \u0441\u0430\u043B\u044B\u0441\u0442\u044B\u0440\u0443 \u043E\u0439\u043B\u0430\u0443\u0434\u044B \u0434\u0430\u043C\u044B\u0442\u0430\u0434\u044B.",life:"\u0411\u0456\u0440 \u043C\u0435\u043A\u0435\u043D\u0436\u0430\u0439\u0434\u044B \u043A\u0430\u0440\u0442\u0430\u043C\u0435\u043D, GPS-\u043F\u0435\u043D \u043D\u0435\u043C\u0435\u0441\u0435 \u0430\u0434\u0430\u043C\u043D\u0430\u043D \u0441\u04B1\u0440\u0430\u043F \u0442\u0430\u0431\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0434\u044B \u2013 \u043D\u04D9\u0442\u0438\u0436\u0435 \u0431\u0456\u0440, \u0442\u04D9\u0441\u0456\u043B\u0434\u0435\u0440 \u04D9\u0440 \u0442\u04AF\u0440\u043B\u0456.",summary:"\u04D8\u0440 \u0442\u04AF\u0440\u043B\u0456 \u04D9\u0434\u0456\u0441\u0442\u0435\u0440\u0434\u0456 \u043C\u0435\u04A3\u0433\u0435\u0440\u0443 \u043E\u049B\u0443\u0448\u044B\u0493\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0442\u0430\u0431\u0438\u0493\u0430\u0442\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0435\u04A3 \u0442\u0438\u0456\u043C\u0434\u0456 \u0436\u043E\u043B\u0434\u044B \u0442\u0430\u04A3\u0434\u0430\u0443\u0493\u0430 \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A \u0431\u0435\u0440\u0435\u0434\u0456."},{id:"t10-9",title:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456",lead:"\u041A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0434\u044B: \u04D9\u0440 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u043A\u0435\u043B\u0435\u0441\u0456 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0441\u0456 \u0431\u043E\u043B\u0430\u0434\u044B.",theory:["\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C \u2013 \u0435\u043A\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0434\u0435\u043D \u04AF\u0448\u0456\u043D\u0448\u0456 \u043F\u0430\u0439\u044B\u043C \u0448\u044B\u0493\u0430\u0440\u0430\u0442\u044B\u043D \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443. \u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435 \u04AF\u043B\u043A\u0435\u043D \u0441\u0456\u043B\u0442\u0435\u043C\u0435 \u0440\u0435\u0442\u0456\u043D\u0434\u0435 \u0430\u043A\u0441\u0438\u043E\u043C\u0430, \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u043D\u0435\u043C\u0435\u0441\u0435 \u0442\u0435\u043E\u0440\u0435\u043C\u0430, \u043A\u0456\u0448\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435 \u0440\u0435\u0442\u0456\u043D\u0434\u0435 \u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D \u0444\u0438\u0433\u0443\u0440\u0430 \u0442\u0443\u0440\u0430\u043B\u044B \u0434\u0435\u0440\u0435\u043A \u0430\u043B\u044B\u043D\u0430\u0434\u044B.","\u041C\u0435\u043A\u0442\u0435\u043F \u0442\u04D9\u0436\u0456\u0440\u0438\u0431\u0435\u0441\u0456\u043D\u0434\u0435 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u044B\u049B\u0448\u0430\u043C\u0434\u0430\u043B\u0493\u0430\u043D \u0442\u04AF\u0440\u0434\u0435 (\u044D\u043D\u0442\u0438\u043C\u0435\u043C\u0430) \u0436\u0430\u0437\u044B\u043B\u0430\u0434\u044B: \xAB\u2220A = \xBD \u25E1BCD (\u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D \u0431\u04B1\u0440\u044B\u0448 \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0431\u043E\u0439\u044B\u043D\u0448\u0430)\xBB. \u041C\u04B1\u043D\u0434\u0430 \u04AF\u043B\u043A\u0435\u043D \u0441\u0456\u043B\u0442\u0435\u043C\u0435 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0430\u0442\u0430\u0443\u044B\u043C\u0435\u043D \u0493\u0430\u043D\u0430 \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u043B\u0433\u0435\u043D.","\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435 \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u049B\u0430\u0442\u0435\u043B\u0435\u0440 \u043A\u0435\u0437\u0434\u0435\u0441\u0435\u0434\u0456: \u0442\u0435\u0437\u0438\u0441\u0442\u0456 \u0430\u043B\u043C\u0430\u0441\u0442\u044B\u0440\u0443, \u0436\u0430\u043B\u0493\u0430\u043D \u0430\u0440\u0433\u0443\u043C\u0435\u043D\u0442, \u0448\u0435\u04A3\u0431\u0435\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443, \u0431\u0456\u0440 \u0441\u044B\u0437\u0431\u0430\u0434\u0430\u043D \u0436\u0430\u043B\u043F\u044B \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0436\u0430\u0441\u0430\u0443, \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u043D\u0435\u0433\u0456\u0437\u0441\u0456\u0437 \u049B\u043E\u043B\u0434\u0430\u043D\u0443. \u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u0443 \u043E\u0441\u044B \u049B\u0430\u0442\u0435\u043B\u0435\u0440\u0434\u0456 \u0442\u0430\u0431\u0443\u0493\u0430 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456."],definitions:[{term:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456",text:"\u04D8\u0440 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u043A\u0435\u043B\u0435\u0441\u0456\u0441\u0456\u043D\u0456\u04A3 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u0441\u0456 \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443\u043B\u0430\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456."},{term:"\u042D\u043D\u0442\u0438\u043C\u0435\u043C\u0430",text:"\u0421\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440\u0456\u043D\u0456\u04A3 \u0431\u0456\u0440\u0456 \u0430\u0439\u0442\u044B\u043B\u043C\u0430\u0439\u0442\u044B\u043D \u044B\u049B\u0448\u0430\u043C\u0434\u0430\u043B\u0493\u0430\u043D \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C."},{term:"\u0428\u0435\u04A3\u0431\u0435\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443",text:"\u0422\u0435\u0437\u0438\u0441\u0442\u0456\u04A3 \u04E9\u0437\u0456 \u0430\u0440\u049B\u044B\u043B\u044B \u043D\u0435\u043C\u0435\u0441\u0435 \u043E\u0434\u0430\u043D \u0448\u044B\u0493\u0430\u0442\u044B\u043D \u0442\u04B1\u0436\u044B\u0440\u044B\u043C \u0430\u0440\u049B\u044B\u043B\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0443\u0456 (\u049B\u0430\u0442\u0435)."}],formulas:[{expr:"\u2220A = \xBD \u25E1BCD,  \u2220C = \xBD \u25E1BAD",note:"\u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440"},{expr:"\u2220A + \u2220C = \xBD (\u25E1BCD + \u25E1BAD) = \xBD \xB7 360\xB0 = 180\xB0",note:"\u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u049B\u0430\u0441\u0438\u0435\u0442\u0456"}],figure:{type:"inscribed-quad",caption:"\u0428\u0435\u04A3\u0431\u0435\u0440\u0433\u0435 \u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D ABCD \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\u044B."},examples:[{title:"\u0406\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448",text:"1-\u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C: \u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D \u0431\u04B1\u0440\u044B\u0448 \u0442\u0456\u0440\u0435\u043B\u0433\u0435\u043D \u0434\u043E\u0493\u0430\u0441\u044B\u043D\u044B\u04A3 \u0436\u0430\u0440\u0442\u044B\u0441\u044B\u043C\u0435\u043D \u04E9\u043B\u0448\u0435\u043D\u0435\u0434\u0456; \u2220A \u2013 \u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D; \u0434\u0435\u043C\u0435\u043A \u2220A = \xBD \u25E1BCD. 2-\u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C: \u0441\u043E\u043B \u0441\u0438\u044F\u049B\u0442\u044B \u2220C = \xBD \u25E1BAD. 3-\u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C: \u25E1BCD + \u25E1BAD \u2013 \u0431\u04AF\u043A\u0456\u043B \u0448\u0435\u04A3\u0431\u0435\u0440, 360\xB0. \u0414\u0435\u043C\u0435\u043A, \u2220A + \u2220C = 180\xB0."}],simple:"\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u2013 \u0434\u043E\u043C\u0438\u043D\u043E \u0442\u0456\u0437\u0431\u0435\u0433\u0456: \u04D9\u0440 \u0442\u0430\u0441 (\u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C) \u043A\u0435\u043B\u0435\u0441\u0456\u0441\u0456\u043D \u049B\u04B1\u043B\u0430\u0442\u0430\u0434\u044B, \u0441\u043E\u04A3\u0493\u044B\u0441\u044B \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0435\u0442\u0456\u043D \u0442\u04B1\u0436\u044B\u0440\u044B\u043C.",life:"\u0411\u0430\u0440\u043B\u044B\u049B \u0441\u04AF\u0442 \u04E9\u043D\u0456\u043C\u0434\u0435\u0440\u0456\u043D\u0434\u0435 \u043A\u0430\u043B\u044C\u0446\u0438\u0439 \u0431\u0430\u0440 (1). \u0410\u0439\u0440\u0430\u043D \u2013 \u0441\u04AF\u0442 \u04E9\u043D\u0456\u043C\u0456 (2). \u0414\u0435\u043C\u0435\u043A, \u0430\u0439\u0440\u0430\u043D\u0434\u0430 \u043A\u0430\u043B\u044C\u0446\u0438\u0439 \u0431\u0430\u0440. \u041A\u0430\u043B\u044C\u0446\u0438\u0439 \u0441\u04AF\u0439\u0435\u043A\u0442\u0456 \u043D\u044B\u0493\u0430\u0439\u0442\u0430\u0434\u044B (3). \u0414\u0435\u043C\u0435\u043A, \u0430\u0439\u0440\u0430\u043D \u0441\u04AF\u0439\u0435\u043A\u0442\u0456 \u043D\u044B\u0493\u0430\u0439\u0442\u0443\u0493\u0430 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456 \u2013 \u0435\u043A\u0456 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u0442\u0456\u0437\u0431\u0435\u0433\u0456.",summary:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u049B\u0430\u04A3\u049B\u0430\u0441\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0434\u0456 \u0436\u04D9\u043D\u0435 \u043E\u043D\u044B\u04A3 \u0434\u04B1\u0440\u044B\u0441\u0442\u044B\u0493\u044B\u043D \u0442\u0435\u043A\u0441\u0435\u0440\u0443\u0433\u0435 \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A \u0431\u0435\u0440\u0435\u0434\u0456."}],workedExamples:[{title:"\u0422\u04E9\u0440\u0442 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u049B\u04B1\u0440\u0443",problem:"\xAB\u0415\u0433\u0435\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3\xBB \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0441\u044B\u043D\u0430 \u043A\u0435\u0440\u0456, \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B, \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0434\u044B \u049B\u04B1\u0440\u044B\u04A3\u0434\u0430\u0440.",steps:["\u041A\u0435\u0440\u0456: \xAB\u0415\u0433\u0435\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442.","\u049A\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B: \xAB\u0415\u0433\u0435\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0431\u043E\u043B\u043C\u0430\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3 \u0435\u043C\u0435\u0441\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442 (\u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043C\u0435\u043D \u043C\u04D9\u043D\u0434\u0435\u0441).","\u041A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B: \xAB\u0415\u0433\u0435\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u0442\u0435\u04A3 \u0431\u043E\u043B\u043C\u0430\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0435\u043C\u0435\u0441\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442 (\u0442\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043C\u0435\u043D \u043C\u04D9\u043D\u0434\u0435\u0441)."]},{title:"\u0410\u043D\u0430\u043B\u0438\u0437 \u04D9\u0434\u0456\u0441\u0456",problem:"a > 0 \u0431\u043E\u043B\u0493\u0430\u043D\u0434\u0430 a + 1/a \u2265 2 \u0435\u043A\u0435\u043D\u0456\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u04A3\u0434\u0435\u0440.",steps:["a + 1/a \u2265 2 \u21D0 a\xB2 + 1 \u2265 2a (a > 0-\u0433\u0435 \u043A\u04E9\u0431\u0435\u0439\u0442\u0442\u0456\u043A).","a\xB2 + 1 \u2265 2a \u21D0 a\xB2 \u2212 2a + 1 \u2265 0 \u21D0 (a \u2212 1)\xB2 \u2265 0.","\u0421\u043E\u04A3\u0493\u044B \u0442\u0435\u04A3\u0441\u0456\u0437\u0434\u0456\u043A \u0430\u049B\u0438\u049B\u0430\u0442, \u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0434\u0430\u043C\u0434\u0430\u0440 \u049B\u0430\u0439\u0442\u044B\u043C\u0434\u044B. \u0414\u0435\u043C\u0435\u043A, a + 1/a \u2265 2; \u0442\u0435\u04A3\u0434\u0456\u043A a = 1 \u0431\u043E\u043B\u0493\u0430\u043D\u0434\u0430 \u043E\u0440\u044B\u043D\u0434\u0430\u043B\u0430\u0434\u044B."]},{title:"\u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443",problem:"\u221A2 \u2013 \u0438\u0440\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0441\u0430\u043D \u0435\u043A\u0435\u043D\u0456\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u04A3\u0434\u0435\u0440.",steps:["\u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0438\u044B\u049B: \u221A2 = p/q, \u043C\u04B1\u043D\u0434\u0430 p/q \u2013 \u049B\u044B\u0441\u049B\u0430\u0440\u0442\u044B\u043B\u043C\u0430\u0439\u0442\u044B\u043D \u0431\u04E9\u043B\u0448\u0435\u043A.","\u041E\u043D\u0434\u0430 p\xB2 = 2q\xB2, \u0434\u0435\u043C\u0435\u043A p\xB2 \u0436\u04B1\u043F, \u0435\u043D\u0434\u0435\u0448\u0435 p \u0436\u04B1\u043F: p = 2k. \u0421\u043E\u043D\u0434\u0430 4k\xB2 = 2q\xB2, q\xB2 = 2k\xB2, q \u0434\u0430 \u0436\u04B1\u043F.","p \u043C\u0435\u043D q \u0435\u043A\u0435\u0443\u0456 \u0434\u0435 \u0436\u04B1\u043F \u2013 \u0431\u04E9\u043B\u0448\u0435\u043A \u049B\u044B\u0441\u049B\u0430\u0440\u0442\u044B\u043B\u043C\u0430\u0439\u0434\u044B \u0434\u0435\u0433\u0435\u043D \u04B1\u0439\u0493\u0430\u0440\u044B\u043C\u0493\u0430 \u049B\u0430\u0439\u0448\u044B. \u0414\u0435\u043C\u0435\u043A, \u221A2 \u2013 \u0438\u0440\u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B."]}],practice:[{task:"\xAB\u0420\u043E\u043C\u0431\u044B\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440\xBB \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0441\u044B\u043D \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u04AF\u0440\u0434\u0435 \u0436\u0430\u0437\u044B\u043F, \u0448\u0430\u0440\u0442\u044B \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0456\u04A3\u0434\u0435\u0440.",answer:"\xAB\u0415\u0433\u0435\u0440 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C \u0440\u043E\u043C\u0431 \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440\xBB. \u0428\u0430\u0440\u0442 \u2013 \u0440\u043E\u043C\u0431; \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u2013 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440."},{task:"\xAB\u0415\u0433\u0435\u0440 \u0441\u0430\u043D 6-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043D\u0434\u0430 \u043E\u043B 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456\xBB \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0441\u044B\u043D\u0430 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u049B\u04B1\u0440\u044B\u043F, \u043E\u043D\u044B\u04A3 \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u0493\u044B\u043D \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u04A3\u0434\u0435\u0440.",answer:"\xAB\u0415\u0433\u0435\u0440 \u0441\u0430\u043D 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043D\u0434\u0430 \u043E\u043B 6-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456\xBB \u2013 \u0436\u0430\u043B\u0493\u0430\u043D, \u043A\u043E\u043D\u0442\u0440\u043C\u044B\u0441\u0430\u043B 9."},{task:"\xAB\u0412\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0435\u04A3\xBB \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0441\u044B\u043D\u044B\u04A3 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0456\u043D \xAB\u041F\u0430\u0439\u044B\u043C \u2013 \u041D\u0435\u0433\u0456\u0437\u0434\u0435\u043C\u0435\xBB \u043A\u0435\u0441\u0442\u0435\u0441\u0456 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u044B\u04A3\u0434\u0430\u0440.",answer:"\u22201 + \u22203 = 180\xB0 | \u0441\u044B\u0431\u0430\u0439\u043B\u0430\u0441; \u22202 + \u22203 = 180\xB0 | \u0441\u044B\u0431\u0430\u0439\u043B\u0430\u0441; \u22201 = \u22202 | \u0435\u043A\u0456 \u0442\u0435\u04A3\u0434\u0456\u043A\u0442\u0435\u043D."},{task:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u043A\u0435\u043C\u0456\u043D\u0434\u0435 \u0431\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u044B 60\xB0-\u0442\u0430\u043D \u043A\u0435\u043C \u0435\u043C\u0435\u0441 \u0435\u043A\u0435\u043D\u0456\u043D \u049B\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443 \u04D9\u0434\u0456\u0441\u0456\u043C\u0435\u043D \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u04A3\u0434\u0435\u0440.",answer:"\u0411\u0430\u0440\u043B\u044B\u049B \u0431\u04B1\u0440\u044B\u0448 < 60\xB0 \u0431\u043E\u043B\u0441\u0430, \u049B\u043E\u0441\u044B\u043D\u0434\u044B < 180\xB0 \u2013 \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B."},{task:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0436\u04AF\u0439\u0435\u0441\u0456\u043D\u0435 \u049B\u043E\u0439\u044B\u043B\u0430\u0442\u044B\u043D \u04AF\u0448 \u0442\u0430\u043B\u0430\u043F\u0442\u044B \u0430\u0442\u0430\u043F, \u04D9\u0440\u049B\u0430\u0439\u0441\u044B\u0441\u044B\u043D \u0431\u0456\u0440 \u0441\u04E9\u0439\u043B\u0435\u043C\u043C\u0435\u043D \u0442\u04AF\u0441\u0456\u043D\u0434\u0456\u0440\u0456\u04A3\u0434\u0435\u0440.",answer:"\u0422\u04D9\u0443\u0435\u043B\u0441\u0456\u0437\u0434\u0456\u043A, \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u0441\u044B\u0437\u0434\u044B\u049B, \u0442\u043E\u043B\u044B\u049B\u0442\u044B\u049B."}],conclusion:["\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0435\u0440 \u2013 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440, \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u043B\u0430\u0440, \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u2013 \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0442\u0435\u043E\u0440\u0438\u044F\u043D\u044B\u04A3 \u049B\u0430\u04A3\u049B\u0430\u0441\u044B. \u041E\u043B\u0430\u0440\u0434\u044B \u043E\u049B\u044B\u0442\u0443 \u0435\u043D\u0433\u0456\u0437\u0443, \u043C\u0435\u04A3\u0433\u0435\u0440\u0443 \u0436\u04D9\u043D\u0435 \u0431\u0435\u043A\u0456\u0442\u0443 \u043A\u0435\u0437\u0435\u04A3\u0434\u0435\u0440\u0456\u043D\u0435\u043D \u0442\u04B1\u0440\u0430\u0434\u044B, \u0430\u043B \u0435\u043D\u0433\u0456\u0437\u0443 \u0442\u04D9\u0441\u0456\u043B\u0456 \u0441\u0430\u0431\u0430\u049B\u0442\u044B\u04A3 \u043C\u0430\u049B\u0441\u0430\u0442\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0442\u0430\u04A3\u0434\u0430\u043B\u0430\u0434\u044B.","\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0442\u04AF\u0441\u0456\u043D\u0443 \u043E\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B\u043D, \u0442\u0443\u0440\u0430 \u0436\u04D9\u043D\u0435 \u043A\u0435\u0440\u0456 \u0442\u04AF\u0440\u043B\u0435\u0440\u0456\u043D \u0431\u0456\u043B\u0443\u0434\u0435\u043D \u0431\u0430\u0441\u0442\u0430\u043B\u0430\u0434\u044B. \u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u2013 \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443, \u0430\u043B \u043E\u043D\u044B \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440\u0493\u0430 \u04AF\u0439\u0440\u0435\u0442\u0443 \u043A\u0435\u0437\u0435\u04A3-\u043A\u0435\u0437\u0435\u04A3\u0456\u043C\u0435\u043D, \u0430\u0440\u043D\u0430\u0439\u044B \u04D9\u0434\u0456\u0441\u0442\u0435\u043C\u0435\u043B\u0456\u043A \u0442\u04D9\u0441\u0456\u043B\u0434\u0435\u0440 \u0430\u0440\u049B\u044B\u043B\u044B \u0436\u04AF\u0437\u0435\u0433\u0435 \u0430\u0441\u0430\u0434\u044B."],questions:["\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0435\u0440\u0434\u0456\u04A3 \u0442\u04AF\u0440\u043B\u0435\u0440\u0456\u043D \u0430\u0442\u0430\u04A3\u0434\u0430\u0440.","\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u04E9\u0439\u043B\u0435\u043C\u0434\u0435\u0440\u0434\u0456 \u043E\u049B\u044B\u043F-\u04AF\u0439\u0440\u0435\u043D\u0443\u0434\u0456\u04A3 \u043A\u0435\u0437\u0435\u04A3\u0434\u0435\u0440\u0456 \u043C\u0435\u043D \u0442\u04D9\u0441\u0456\u043B\u0434\u0435\u0440\u0456\u043D \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u04A3\u0434\u0430\u0440.","\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0436\u04AF\u0439\u0435\u0441\u0456\u043D\u0435 \u049B\u0430\u043D\u0434\u0430\u0439 \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440 \u049B\u043E\u0439\u044B\u043B\u0430\u0434\u044B?","\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B\u043D \u043C\u044B\u0441\u0430\u043B \u0430\u0440\u049B\u044B\u043B\u044B \u0442\u04AF\u0441\u0456\u043D\u0434\u0456\u0440\u0456\u04A3\u0434\u0435\u0440.","\u041A\u0435\u0441\u0456\u043C\u0434\u0456 \u0436\u04D9\u043D\u0435 \u0448\u0430\u0440\u0442\u0442\u044B, \u0436\u0430\u0439 \u0436\u04D9\u043D\u0435 \u049B\u04B1\u0440\u0430\u043C\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0493\u0430 \u043C\u044B\u0441\u0430\u043B \u043A\u0435\u043B\u0442\u0456\u0440\u0456\u04A3\u0434\u0435\u0440.","\u0422\u0443\u0440\u0430, \u043A\u0435\u0440\u0456, \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0436\u04D9\u043D\u0435 \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440 \u049B\u0430\u043B\u0430\u0439 \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u049B\u0430\u043D?","\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u049B\u04B1\u0440\u0430\u043C\u0434\u044B \u0431\u04E9\u043B\u0456\u043A\u0442\u0435\u0440\u0456\u043D \u0430\u0442\u0430\u04A3\u0434\u0430\u0440.","\u0410\u043D\u0430\u043B\u0438\u0437, \u0441\u0438\u043D\u0442\u0435\u0437 \u0436\u04D9\u043D\u0435 \u049B\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443 \u04D9\u0434\u0456\u0441\u0442\u0435\u0440\u0456\u043D\u0456\u04A3 \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u0493\u044B \u043D\u0435\u0434\u0435?","\u041C\u0435\u043A\u0442\u0435\u043F\u0442\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u04AF\u0439\u0440\u0435\u0442\u0443\u0434\u0456\u04A3 \u049B\u0430\u043D\u0434\u0430\u0439 \u0442\u04D9\u0441\u0456\u043B\u0434\u0435\u0440\u0456 \u0431\u0430\u0440?","\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435\u0440 \u0442\u0456\u0437\u0431\u0435\u0433\u0456 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u0443\u0493\u0430 \u043C\u044B\u0441\u0430\u043B \u043A\u0435\u043B\u0442\u0456\u0440\u0456\u04A3\u0434\u0435\u0440."],quiz:[{q:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430 \u0434\u0435\u0433\u0435\u043D\u0456\u043C\u0456\u0437 \u043D\u0435?",options:["\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0442\u0430\u0493\u0430\u0439\u044B\u043D\u0434\u0430\u043B\u0430\u0442\u044B\u043D \u0441\u04E9\u0439\u043B\u0435\u043C","\u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u043C\u0435\u0441\u0456\u0437 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u043D\u0430\u0442\u044B\u043D \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u0441\u04E9\u0439\u043B\u0435\u043C","\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D \u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u0448\u044B\u0493\u0430\u0442\u044B\u043D \u0441\u04E9\u0439\u043B\u0435\u043C","\u041A\u04E9\u043C\u0435\u043A\u0448\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430"],correct:1,explain:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043C\u0435\u0441\u0456\u0437 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u043D\u0430\u0434\u044B. \u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0435\u0442\u0456\u043D \u0441\u04E9\u0439\u043B\u0435\u043C \u2013 \u0442\u0435\u043E\u0440\u0435\u043C\u0430, \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D \u0448\u044B\u0493\u0430\u0442\u044B\u043D\u044B \u2013 \u0441\u0430\u043B\u0434\u0430\u0440, \u043A\u04E9\u043 \u0440\u0430\u043B\u043B\u0435\u043B\u044C; \u0431\u0430\u0440\u043B\u044B\u049B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3. \xAB\u0422\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\xBB \u0431\u0435\u043B\u0433\u0456\u0441\u0456\u043D \u049B\u043E\u0441\u0441\u0430 \u2013 \xAB\u043A\u0432\u0430\u0434\u0440\u0430\u0442\xBB \u0448\u044B\u0493\u0430\u0434\u044B."},"\u04B0\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456":{full:"\u041A\u04E9\u043B\u0435\u043C \u2013 \u04B1\u0493\u044B\u043C\u0493\u0430 \u0431\u0430\u0493\u044B\u043D\u0430\u0442\u044B\u043D \u0431\u0430\u0440\u043B\u044B\u049B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440\u0434\u0456\u04A3 \u0436\u0438\u044B\u043D\u044B. \u04B0\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0434\u0435\u0440\u0456 \u0430\u0440\u0430\u0441\u044B\u043D\u0434\u0430\u0493\u044B \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u0442\u0430\u0440 \u042D\u0439\u043B\u0435\u0440 \u2013 \u0412\u0435\u043D\u043D \u0434\u04E9\u04A3\u0433\u0435\u043B\u0435\u043A\u0442\u0435\u0440\u0456\u043C\u0435\u043D \u043A\u0435\u0441\u043A\u0456\u043D\u0434\u0435\u043B\u0435\u0434\u0456: \u049B\u0430\u043C\u0442\u0443, \u049B\u0438\u044B\u043B\u044B\u0441\u0443, \u0431\u04E9\u043B\u0435\u043A\u0442\u0456\u043A, \u043C\u04D9\u043D\u0434\u0435\u0441\u0442\u0456\u043A.",example:"\xAB\u0416\u04B1\u043F \u0431\u0456\u0440 \u0442\u0430\u04A3\u0431\u0430\u043B\u044B \u043D\u0430\u0442\u0443\u0440\u0430\u043B \u0441\u0430\u043D\xBB \u04B1\u0493\u044B\u043C\u044B\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456: {2, 4, 6, 8}."},"\u0422\u0435\u043A\u0442\u0456\u043A \u04B1\u0493\u044B\u043C":{full:"\u0422\u0435\u043A\u0442\u0456\u043A \u04B1\u0493\u044B\u043C \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0442\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C\u0434\u044B \u0431\u0456\u0440\u0456\u043A\u0442\u0456\u0440\u0435\u0434\u0456;
