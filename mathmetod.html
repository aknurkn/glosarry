0\u0493\u0430\u043B\u0430\u0440\u044B \u0442\u0435\u04A3 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB. \u0422\u0435\u043A \u2013 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C, \u0442\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B \u2013 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B\u043D\u044B\u04A3 \u0442\u0435\u04A3\u0434\u0456\u0433\u0456."},\u0416\u0456\u043A\u0442\u0435\u0443:{full:"\u0416\u0456\u043A\u0442\u0435\u0443 \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456\u043D \u0431\u0456\u0440 \u043D\u0435\u0433\u0456\u0437 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u043A\u0435\u0437\u0435\u04A3-\u043A\u0435\u0437\u0435\u04A3\u0456\u043C\u0435\u043D \u0431\u04E9\u043B\u0456\u043F, \u0442\u04AF\u0440\u043B\u0435\u0440 \u0436\u04AF\u0439\u0435\u0441\u0456\u043D \u049B\u04B1\u0440\u0430\u0434\u044B. \u0415\u0440\u0435\u0436\u0435\u043B\u0435\u0440\u0456: \u0431\u0456\u0440 \u043D\u0435\u0433\u0456\u0437, \u043C\u04E9\u043B\u0448\u0435\u0440\u043B\u0435\u0441\u0442\u0456\u043A, \u0442\u04AF\u0440\u043B\u0435\u0440\u0434\u0456\u04A3 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0443\u044B, \u04AF\u0437\u0434\u0456\u043A\u0441\u0456\u0437\u0434\u0456\u043A.",example:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430: \u0441\u04AF\u0439\u0456\u0440\u0431\u04B1\u0440\u044B\u0448\u0442\u044B, \u0442\u0456\u043A\u0431\u04B1\u0440\u044B\u0448\u0442\u044B, \u0434\u043E\u0493\u0430\u043B\u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u2013 \u04D9\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0434\u04D9\u043B \u0431\u0456\u0440 \u0442\u04AF\u0440\u0433\u0435 \u0436\u0430\u0442\u0430\u0434\u044B."},"\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F\u043B\u044B\u049B \u0436\u0456\u043A\u0442\u0435\u0443":{full:"\u0414\u0438\u0445\u043E\u0442\u043E\u043C\u0438\u044F \u04D9\u0440\u049B\u0430\u0448\u0430\u043D \u0442\u043E\u043B\u044B\u049B \u0436\u04D9\u043D\u0435 \u049B\u0438\u044B\u043B\u044B\u0441\u043F\u0430\u0439\u0442\u044B\u043D \u0431\u04E9\u043B\u0443 \u0431\u0435\u0440\u0435\u0434\u0456, \u0441\u0435\u0431\u0435\u0431\u0456 \xABA\xBB \u043C\u0435\u043D \xABA \u0435\u043C\u0435\u0441\xBB \u0431\u0456\u0440\u0456\u043D-\u0431\u0456\u0440\u0456 \u0442\u043E\u043B\u044B\u049B\u0442\u044B\u0440\u0430\u0434\u044B. \u041A\u0435\u043C\u0448\u0456\u043B\u0456\u0433\u0456 \u2013 \xABA \u0435\u043C\u0435\u0441\xBB \u0431\u04E9\u043B\u0456\u0433\u0456 \u0430\u043D\u044B\u049B \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u043B\u043C\u0430\u0439\u0434\u044B, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u0431\u04E9\u043B\u0443\u0434\u0456 \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0434\u0435\u04A3\u0433\u0435\u0439\u0434\u0435 \u0436\u0430\u043B\u0493\u0430\u0441\u0442\u044B\u0440\u0430\u0434\u044B.",example:"\u041D\u0430\u049B\u0442\u044B \u0441\u0430\u043D\u0434\u0430\u0440 \u2192 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B / \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0435\u043C\u0435\u0441; \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u2192 \u0431\u04AF\u0442\u0456\u043D / \u0431\u04E9\u043B\u0448\u0435\u043A; \u0431\u04AF\u0442\u0456\u043D \u2192 \u043E\u04A3 / \u043E\u04A3 \u0435\u043C\u0435\u0441."},\u0410\u0431\u0441\u0442\u0440\u0430\u043A\u0446\u0438\u044F\u043B\u0430\u0443:{full:"\u0410\u0431\u0441\u0442\u0440\u0430\u043A\u0446\u0438\u044F\u043B\u0430\u0443 \u2013 \u04B1\u0493\u044B\u043C \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0442\u044B\u0440\u0443\u0434\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0442\u04D9\u0441\u0456\u043B\u0456: \u0437\u0430\u0442\u0442\u044B\u04A3 \u0433\u0435\u043E\u043C\u0435\u0442\u0440\u0438\u044F\u043B\u044B\u049B \u043F\u0456\u0448\u0456\u043D\u0456 \u043C\u0435\u043D \u0441\u0430\u043D\u0434\u044B\u049B \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u0442\u0430\u0440\u044B\u043D \u0431\u04E9\u043B\u0456\u043F \u0430\u043B\u044B\u043F, \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B\u043D, \u0442\u04AF\u0441\u0456\u043D, \u0441\u0430\u043B\u043C\u0430\u0493\u044B\u043D \u0435\u043B\u0435\u043C\u0435\u0439\u043C\u0456\u0437.",example:"\u041A\u0456\u0442\u0430\u043F, \u0442\u0435\u0440\u0435\u0437\u0435, \u0442\u0430\u049B\u0442\u0430 \u2013 \u043C\u0430\u0442\u0435\u0440\u0438\u0430\u043B\u044B\u043D \u0435\u0441\u043A\u0435\u0440\u043C\u0435\u0439, \u0442\u0435\u043A \u043F\u0456\u0448\u0456\u043D\u0456\u043D \u049B\u0430\u0440\u0430\u0441\u0442\u044B\u0440\u0493\u0430\u043D\u0434\u0430 \xAB\u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448\xBB \u04B1\u0493\u044B\u043C\u044B \u0448\u044B\u0493\u0430\u0434\u044B."},\u0421\u0435\u0437\u0456\u043D\u0443:{full:"\u0421\u0435\u0437\u0456\u043D\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043D\u0456\u04A3 \u0436\u0435\u043A\u0435 \u049B\u0430\u0441\u0438\u0435\u0442\u0456 \u0493\u0430\u043D\u0430 (\u0442\u04AF\u0441\u0456, \u0442\u0435\u0433\u0456\u0441\u0442\u0456\u0433\u0456, \u0441\u0430\u043B\u049B\u044B\u043D\u0434\u044B\u0493\u044B) \u0442\u0430\u043D\u044B\u043B\u0430\u0434\u044B. \u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u04B1\u0493\u044B\u043C\u0434\u044B \u049B\u0430\u043B\u044B\u043F\u0442\u0430\u0441\u0442\u044B\u0440\u0443 \u043E\u0441\u044B \u0441\u0435\u0437\u0456\u043C\u0434\u0456\u043A \u0442\u04D9\u0436\u0456\u0440\u0438\u0431\u0435\u0434\u0435\u043D \u0431\u0430\u0441\u0442\u0430\u043B\u0430\u0434\u044B.",example:"\u041E\u049B\u0443\u0448\u044B \u0442\u0435\u043A\u0448\u0435 \u043C\u043E\u0434\u0435\u043B\u044C\u0434\u0456 \u04B1\u0441\u0442\u0430\u0493\u0430\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u049B\u044B\u0440\u043B\u0430\u0440\u044B\u043D\u044B\u04A3 \u04E9\u0442\u043A\u0456\u0440\u043B\u0456\u0433\u0456\u043D, \u0436\u0430\u049B\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u0442\u0435\u0433\u0456\u0441\u0442\u0456\u0433\u0456\u043D \u0441\u0435\u0437\u0456\u043D\u0435\u0434\u0456."},\u049A\u0430\u0431\u044B\u043B\u0434\u0430\u0443:{full:"\u049A\u0430\u0431\u044B\u043B\u0434\u0430\u0443 \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u0441\u0435\u0437\u0456\u043D\u0443\u0434\u0456\u04A3 \u043D\u04D9\u0442\u0438\u0436\u0435\u0441\u0456\u043D\u0434\u0435 \u0437\u0430\u0442\u0442\u044B\u04A3 \u0442\u04B1\u0442\u0430\u0441 \u0431\u0435\u0439\u043D\u0435\u0441\u0456\u043D \u0431\u0435\u0440\u0435\u0434\u0456. \u041A\u04E9\u0440\u043D\u0435\u043A\u0456 \u049B\u04B1\u0440\u0430\u043B\u0434\u0430\u0440 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443\u0434\u044B \u04B1\u0439\u044B\u043C\u0434\u0430\u0441\u0442\u044B\u0440\u0443\u0493\u0430 \u0430\u0440\u043D\u0430\u043B\u0493\u0430\u043D.",example:"\u0421\u044B\u0437\u0431\u0430\u0434\u0430\u0493\u044B \u0444\u0438\u0433\u0443\u0440\u0430\u043D\u044B \u043E\u049B\u0443\u0448\u044B \xAB\u04AF\u0448 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u0441\u044B, \u04AF\u0448 \u0431\u04B1\u0440\u044B\u0448\u044B \u0431\u0430\u0440 \u0442\u04B1\u0439\u044B\u049B \u0441\u044B\u043D\u044B\u049B \u0441\u044B\u0437\u044B\u049B\xBB \u0440\u0435\u0442\u0456\u043D\u0434\u0435 \u0442\u04B1\u0442\u0430\u0441 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0439\u0434\u044B."},\u0422\u04AF\u0441\u0456\u043D\u0456\u043A:{full:"\u0422\u04AF\u0441\u0456\u043D\u0456\u043A \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443\u0434\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u0437\u0430\u0442\u0441\u044B\u0437-\u0430\u049B \u0441\u0430\u049B\u0442\u0430\u043B\u0430\u0442\u044B\u043D \u043A\u04E9\u0440\u043D\u0435\u043A\u0456 \u0431\u0435\u0439\u043D\u0435. \u041E\u043B \u0441\u0435\u0437\u0456\u043C\u0434\u0456\u043A \u0442\u0430\u043D\u0443\u0434\u0430\u043D \u043E\u0439\u043B\u0430\u0443\u0493\u0430 (\u04B1\u0493\u044B\u043C\u0493\u0430) \u04E9\u0442\u0443\u0434\u0456\u04A3 \u0430\u0440\u0430\u043B\u044B\u049B \u0441\u0430\u0442\u044B\u0441\u044B.",example:"\u041C\u043E\u0434\u0435\u043B\u044C\u0434\u0456 \u0430\u043B\u044B\u043F \u0442\u0430\u0441\u0442\u0430\u0493\u0430\u043D\u043D\u0430\u043D \u043A\u0435\u0439\u0456\u043D \u0434\u0435 \u043E\u049B\u0443\u0448\u044B \u043A\u04E9\u0437 \u0430\u043B\u0434\u044B\u043D\u0430 \u0448\u0430\u0440\u0434\u044B \u0435\u043B\u0435\u0441\u0442\u0435\u0442\u0435 \u0430\u043B\u0430\u0434\u044B \u2013 \u0431\u04B1\u043B \u0448\u0430\u0440 \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u04AF\u0441\u0456\u043D\u0456\u043A."},"\u0415\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456":{full:"\u0415\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456 \u0436\u043E\u0439\u044B\u043B\u0441\u0430, \u043E\u0431\u044A\u0435\u043A\u0442 \u0431\u04B1\u043B \u04B1\u0493\u044B\u043C\u0493\u0430 \u0436\u0430\u0442\u043F\u0430\u0439 \u049B\u0430\u043B\u0430\u0434\u044B. \u0415\u043B\u0435\u0443\u0441\u0456\u0437 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456 \u04E9\u0437\u0433\u0435\u0440\u0442\u0443 (\u0432\u0430\u0440\u0438\u0430\u0446\u0438\u044F\u043B\u0430\u0443) \u2013 \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456 \u0430\u0439\u049B\u044B\u043D\u0434\u0430\u0443\u0434\u044B\u04A3 \u0442\u0438\u0456\u043C\u0434\u0456 \u04D9\u0434\u0456\u0441\u0456.",example:"\u0422\u0456\u043A \u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u0441\u0456 \u2013 90\xB0; \u043E\u043D\u044B\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B\u043D\u044B\u04A3 \u04B1\u0437\u044B\u043D\u0434\u044B\u0493\u044B, \u0441\u044B\u0437\u0431\u0430\u0434\u0430\u0493\u044B \u0431\u0430\u0493\u044B\u0442\u044B \u2013 \u0435\u043B\u0435\u0443\u0441\u0456\u0437."},"\u0422\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C":{full:"\u0422\u04AF\u0440\u043B\u0456\u043A \u04B1\u0493\u044B\u043C \u0442\u0435\u043A\u0442\u0456\u043A \u04B1\u0493\u044B\u043C\u043D\u044B\u04A3 \u0431\u0430\u0440\u043B\u044B\u049B \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u0436\u04D9\u043D\u0435 \u04E9\u0437\u0456\u043D\u0435 \u0493\u0430\u043D\u0430 \u0442\u04D9\u043D \u049B\u043E\u0441\u044B\u043C\u0448\u0430 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456 \u0438\u0435\u043B\u0435\u043D\u0435\u0434\u0456, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u043C\u0430\u0437\u043C\u04B1\u043D\u044B \u0431\u0430\u0439, \u043A\u04E9\u043B\u0435\u043C\u0456 \u0442\u0430\u0440.",example:"\xAB\u0422\u0435\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\xBB \u2013 \xAB\u0442\u0435\u04A3 \u0431\u04AF\u0439\u0456\u0440\u043B\u0456 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\xBB \u04B1\u0493\u044B\u043C\u044B\u043D\u044B\u04A3 \u0442\u04AF\u0440\u0456."},"\u0422\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B":{full:"\u0422\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0434\u0430 \u0442\u0435\u043A\u0442\u0456\u043A \u04B1\u0493\u044B\u043C\u0493\u0430 \u049B\u043E\u0441\u044B\u043B\u044B\u043F, \u0430\u043D\u044B\u049B\u0442\u0430\u043B\u0430\u0442\u044B\u043D \u04B1\u0493\u044B\u043C\u0434\u044B \u0431\u04E9\u043B\u0456\u043F \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0434\u0456. \u041E\u043B \u0436\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456 \u04D9\u0440\u0456 \u049B\u0430\u0436\u0435\u0442\u0442\u0456 \u0431\u043E\u043B\u0443\u044B \u043A\u0435\u0440\u0435\u043A.",example:"\xAB\u0422\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u2013 \u0431\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u044B \u0442\u0456\u043A \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB: \xAB\u0431\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u044B \u0442\u0456\u043A\xBB \u2013 \u0442\u04AF\u0440\u043B\u0456\u043A \u0430\u0439\u044B\u0440\u043C\u0430\u0448\u044B\u043B\u044B\u049B."},"\u0415\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A":{full:"\u0410\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0434\u0430 \u0442\u044B\u043C \u0430\u043B\u044B\u0441 \u0442\u0435\u043A\u0442\u0456 \u0430\u043B\u0443 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u043D\u044B \u04B1\u0437\u0430\u0440\u0442\u0430\u0434\u044B, \u0441\u0435\u0431\u0435\u0431\u0456 \u0430\u0440\u0430\u043B\u044B\u049B \u0442\u0435\u043A\u0442\u0435\u0440\u0434\u0456\u04A3 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456\u043D \u049B\u0430\u0439\u0442\u0430 \u0442\u0456\u0437\u0443\u0433\u0435 \u0442\u0443\u0440\u0430 \u043A\u0435\u043B\u0435\u0434\u0456.",example:"\u041A\u0432\u0430\u0434\u0440\u0430\u0442 \u04AF\u0448\u0456\u043D \u0435\u04A3 \u0436\u0430\u049B\u044B\u043D \u0442\u0435\u043A \u2013 \u0442\u0456\u043A\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u043D\u0435\u043C\u0435\u0441\u0435 \u0440\u043E\u043C\u0431; \xAB\u043A\u04E9\u043F\u0431\u04B1\u0440\u044B\u0448\xBB \u2013 \u0442\u044B\u043C \u0430\u043B\u044B\u0441 \u0442\u0435\u043A."},"\u0410\u043D\u044B\u049B\u0442\u0430\u043B\u043C\u0430\u0439\u0442\u044B\u043D \u04B1\u0493\u044B\u043C":{full:"\u041A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430 \u0431\u0430\u0441\u049B\u0430 \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0493\u0430 \u0441\u04AF\u0439\u0435\u043D\u0435\u0434\u0456, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u0442\u0456\u0437\u0431\u0435\u043A \u0448\u0435\u043A\u0441\u0456\u0437 \u0431\u043E\u043B\u043C\u0430\u0443\u044B \u04AF\u0448\u0456\u043D \u043A\u0435\u0439\u0431\u0456\u0440 \u04B1\u0493\u044B\u043C\u0434\u0430\u0440 \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0441\u044B\u0437 \u0430\u043B\u044B\u043D\u0430\u0434\u044B. \u041E\u043B\u0430\u0440\u0434\u044B\u04A3 \u049B\u0430\u0441\u0438\u0435\u0442\u0442\u0435\u0440\u0456\u043D \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0441\u0438\u043F\u0430\u0442\u0442\u0430\u0439\u0434\u044B.",example:"\u041F\u043B\u0430\u043D\u0438\u043C\u0435\u0442\u0440\u0438\u044F\u0434\u0430 \xAB\u043D\u04AF\u043A\u0442\u0435\xBB, \xAB\u0442\u04AF\u0437\u0443\xBB, \xAB\u0430\u0440\u0430\u0441\u044B\u043D\u0434\u0430 \u0436\u0430\u0442\u0443\xBB \u2013 \u0430\u043D\u044B\u049B\u0442\u0430\u043B\u043C\u0430\u0439\u0442\u044B\u043D \u04B1\u0493\u044B\u043C\u0434\u0430\u0440."},\u0411\u04E9\u043B\u0443:{full:"\u0411\u04E9\u043B\u0443\u0434\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0442\u0456\u043D \u04B1\u0493\u044B\u043C, \u0431\u04E9\u043B\u0443 \u043C\u04AF\u0448\u0435\u043B\u0435\u0440\u0456 \u0436\u04D9\u043D\u0435 \u0431\u04E9\u043B\u0443 \u043D\u0435\u0433\u0456\u0437\u0456 \u0430\u0436\u044B\u0440\u0430\u0442\u044B\u043B\u0430\u0434\u044B. \u0411\u0456\u0440 \u0440\u0435\u0442\u0442\u0456\u043A \u0431\u04E9\u043B\u0443\u0434\u0456\u04A3 \u0436\u0430\u043B\u0493\u0430\u0441\u044B \u0436\u0456\u043A\u0442\u0435\u0443\u0434\u0456 \u049B\u04B1\u0440\u0430\u0439\u0434\u044B.",example:"\u041D\u0430\u0442\u0443\u0440\u0430\u043B \u0441\u0430\u043D\u0434\u0430\u0440 \u049B\u0430\u043B\u0434\u044B\u049B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 3-\u043A\u0435 \u0431\u04E9\u043B\u0433\u0435\u043D\u0434\u0435: 3k, 3k + 1, 3k + 2."},"\u0416\u0456\u043A\u0442\u0435\u0443 \u043D\u0435\u0433\u0456\u0437\u0456":{full:"\u041D\u0435\u0433\u0456\u0437 \u0431\u04AF\u043A\u0456\u043B \u0436\u0456\u043A\u0442\u0435\u0443 \u0431\u043E\u0439\u044B \u04E9\u0437\u0433\u0435\u0440\u043C\u0435\u0443\u0456 \u0442\u0438\u0456\u0441; \u04D9\u0439\u0442\u043F\u0435\u0441\u0435 \u0442\u04AF\u0440\u043B\u0435\u0440 \u049B\u0438\u044B\u043B\u044B\u0441\u044B\u043F, \xAB\u043D\u0435\u0433\u0456\u0437\u0434\u0456 \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u0443\xBB \u049B\u0430\u0442\u0435\u0441\u0456 \u043F\u0430\u0439\u0434\u0430 \u0431\u043E\u043B\u0430\u0434\u044B.",example:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u0434\u044B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443\u0433\u0435 \xAB\u0442\u0435\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B\xBB \u0442\u04AF\u0440\u0456\u043D \u049B\u043E\u0441\u0443 \u2013 \u049B\u0430\u0442\u0435: \u043E\u043B \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0456\u043A\u0442\u0435\u0443\u0433\u0435 \u0436\u0430\u0442\u0430\u0434\u044B."},\u0416\u0430\u043B\u043F\u044B\u043B\u0430\u0443:{full:"\u0416\u0430\u043B\u043F\u044B\u043B\u0430\u0443 \u0430\u0431\u0441\u0442\u0440\u0430\u043A\u0446\u0438\u044F\u043B\u0430\u0443\u043C\u0435\u043D \u049B\u0430\u0442\u0430\u0440 \u0436\u04AF\u0440\u0435\u0434\u0456: \u043D\u0430\u049B\u0442\u044B \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043B\u0435\u0440\u0434\u0456\u04A3 \u043E\u0440\u0442\u0430\u049B \u0435\u043B\u0435\u0443\u043B\u0456 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0456 \u0431\u04E9\u043B\u0456\u043D\u0456\u043F, \u043A\u0435\u04A3\u0456\u0440\u0435\u043A \u04B1\u0493\u044B\u043C \u049B\u04B1\u0440\u044B\u043B\u0430\u0434\u044B.",example:"2 + 3 = 3 + 2, 5 + 7 = 7 + 5 \u2192 a + b = b + a (\u049B\u043E\u0441\u0443\u0434\u044B\u04A3 \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u044B\u043C\u0434\u044B\u043B\u044B\u049B \u0437\u0430\u04A3\u044B)."},"\u041D\u0430\u049B\u0442\u044B-\u0438\u043D\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u0436\u043E\u043B":{full:"\u0411\u04B1\u043B \u0436\u043E\u043B\u0434\u0430 \u043E\u049B\u0443\u0448\u044B\u043B\u0430\u0440 \u043C\u044B\u0441\u0430\u043B\u0434\u0430\u0440\u0434\u044B \u0441\u0430\u043B\u044B\u0441\u0442\u044B\u0440\u044B\u043F, \u043E\u0440\u0442\u0430\u049B \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0440\u0434\u0456 \u04E9\u0437\u0434\u0435\u0440\u0456 \u0442\u0430\u0431\u0430\u0434\u044B \u0434\u0430, \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0493\u0430 \u043A\u0435\u043B\u0435\u0434\u0456. \u0411\u0430\u0441\u0442\u0430\u0443\u044B\u0448 \u0436\u04D9\u043D\u0435 \u043E\u0440\u0442\u0430 \u0441\u044B\u043D\u044B\u043F\u0442\u0430\u0440\u0434\u0430 \u0442\u0438\u0456\u043C\u0434\u0456.",example:"\u0411\u0456\u0440\u043D\u0435\u0448\u0435 \u0442\u0435\u04A3\u0434\u0435\u0443\u0434\u0456\u04A3 \u0442\u04AF\u0431\u0456\u0440\u0456\u043D \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u043F, \xAB\u0442\u0435\u04A3\u0434\u0456\u043A\u0442\u0456 \u0430\u049B\u0438\u049B\u0430\u0442 \u0435\u0442\u0435\u0434\u0456\xBB \u0434\u0435\u0433\u0435\u043D \u043E\u0440\u0442\u0430\u049B \u0431\u0435\u043B\u0433\u0456\u0434\u0435\u043D \xAB\u0442\u0435\u04A3\u0434\u0435\u0443\u0434\u0456\u04A3 \u0442\u04AF\u0431\u0456\u0440\u0456\xBB \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0441\u044B\u043D\u0430 \u043A\u0435\u043B\u0443."},\u041F\u0430\u0439\u044B\u043C:{full:"\u041F\u0430\u0439\u044B\u043C \u0441\u0443\u0431\u044A\u0435\u043A\u0442 (S), \u043F\u0440\u0435\u0434\u0438\u043A\u0430\u0442 (P) \u0436\u04D9\u043D\u0435 \u043A\u043E\u043F\u0443\u043B\u0430\u0434\u0430\u043D \u0442\u04B1\u0440\u0430\u0434\u044B. \u0421\u0430\u043D \u043C\u0435\u043D \u0441\u0430\u043F\u0430 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 A, I, E, O \u0442\u04AF\u0440\u043B\u0435\u0440\u0456\u043D\u0435, \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0436\u0430\u0439 \u0436\u04D9\u043D\u0435 \u043A\u04AF\u0440\u0434\u0435\u043B\u0456 \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456.",example:"\xAB\u0411\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0440\u043E\u043C\u0431\xBB \u2013 A \u0442\u04AF\u0440\u0456\u043D\u0434\u0435\u0433\u0456 \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0430\u0439\u044B\u043C; \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0456\u043A\u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u0435\u043C\u0435\u0441\xBB \u2013 O \u0442\u04AF\u0440\u0456."},\u041F\u0456\u043A\u0456\u0440:{full:"\u041F\u0456\u043A\u0456\u0440 \u2013 \u043F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043B\u043E\u0433\u0438\u043A\u0430\u0434\u0430\u0493\u044B \u0431\u0430\u043B\u0430\u043C\u0430\u0441\u044B; \u043E\u0493\u0430\u043D \u0430\u049B\u0438\u049B\u0430\u0442\u0442\u044B\u049B \u043C\u04D9\u043D (1 \u2013 \u0430\u049B\u0438\u049B\u0430\u0442, 0 \u2013 \u0436\u0430\u043B\u0493\u0430\u043D) \u0431\u0435\u0440\u0456\u043B\u0435\u0434\u0456. \u0410\u0439\u043D\u044B\u043C\u0430\u043B\u044B\u0441\u044B \u0431\u0430\u0440 \u0441\u04E9\u0439\u043B\u0435\u043C \u043C\u04D9\u043D \u049B\u043E\u0439\u044B\u043B\u0493\u0430\u043D\u0434\u0430 \u0493\u0430\u043D\u0430 \u043F\u0456\u043A\u0456\u0440\u0433\u0435 \u0430\u0439\u043D\u0430\u043B\u0430\u0434\u044B.",example:"\xAB7 \u2013 \u0436\u0430\u0439 \u0441\u0430\u043D\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0456\u043A\u0456\u0440; \xABx + 2 = 5\xBB \u2013 \u043F\u0456\u043A\u0456\u0440 \u0435\u043C\u0435\u0441, x = 3 \u0431\u043E\u043B\u0493\u0430\u043D\u0434\u0430 \u0430\u049B\u0438\u049B\u0430\u0442 \u043F\u0456\u043A\u0456\u0440 \u0431\u043E\u043B\u0430\u0434\u044B."},"\u049A\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B \u0437\u0430\u04A3\u044B":{full:"\u0417\u0430\u04A3 \u043E\u0439\u0434\u044B\u04A3 \u0434\u04D9\u0439\u0435\u043A\u0442\u0456\u043B\u0456\u0433\u0456\u043D \u0442\u0430\u043B\u0430\u043F \u0435\u0442\u0435\u0434\u0456: \u0431\u0456\u0440 \u043E\u0431\u044A\u0435\u043A\u0442 \u0442\u0443\u0440\u0430\u043B\u044B \u0431\u0456\u0440 \u043C\u0435\u0437\u0433\u0456\u043B\u0434\u0435, \u0431\u0456\u0440 \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u0442\u0430 \u0430\u0439\u0442\u044B\u043B\u0493\u0430\u043D \u049B\u0430\u0439\u0448\u044B \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u043A\u0435\u043C\u0456\u043D\u0434\u0435 \u0431\u0456\u0440\u0435\u0443\u0456 \u0436\u0430\u043B\u0493\u0430\u043D. \u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443 \u04D9\u0434\u0456\u0441\u0456 \u043E\u0441\u044B \u0437\u0430\u04A3\u0493\u0430 \u0441\u04AF\u0439\u0435\u043D\u0435\u0434\u0456.",example:"\xAC(A \u2227 \xACA): \xAB\u221A2 \u2013 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0441\u0430\u043D\xBB \u0436\u04D9\u043D\u0435 \xAB\u221A2 \u2013 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0441\u0430\u043D \u0435\u043C\u0435\u0441\xBB \u0435\u043A\u0435\u0443\u0456 \u0431\u0456\u0440\u0434\u0435\u0439 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0430 \u0430\u043B\u043C\u0430\u0439\u0434\u044B."},\u041E\u0439\u049B\u043E\u0440\u044B\u0442\u0443:{full:"\u041E\u0439\u049B\u043E\u0440\u044B\u0442\u0443\u0434\u0430 \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440 \u043C\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0431\u043E\u043B\u0430\u0434\u044B. \u0422\u04AF\u0440\u043B\u0435\u0440\u0456: \u0434\u0435\u0434\u0443\u043A\u0446\u0438\u044F, \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F, \u0430\u043D\u0430\u043B\u043E\u0433\u0438\u044F; \u0441\u043E\u043D\u0434\u0430\u0439-\u0430\u049B \u0442\u0456\u043A\u0435\u043B\u0435\u0439 \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443\u043B\u0430\u0440 (\u0430\u0439\u043D\u0430\u043B\u0434\u044B\u0440\u0443, \u043B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u0431\u043E\u0439\u044B\u043D\u0448\u0430).",example:"\xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0436\u04B1\u043F \u0441\u0430\u043D 2-\u0433\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456; 18 \u2013 \u0436\u04B1\u043F \u0441\u0430\u043D\xBB \u21D2 \xAB18 \u0441\u0430\u043D\u044B 2-\u0433\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456\xBB."},\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C:{full:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C \u04AF\u0448 \u0442\u0435\u0440\u043C\u0438\u043D\u043D\u0435\u043D \u0442\u04B1\u0440\u0430\u0434\u044B: \u043A\u0456\u0448\u0456 (S), \u04AF\u043B\u043A\u0435\u043D (P) \u0436\u04D9\u043D\u0435 \u043E\u0440\u0442\u0430\u04A3\u0493\u044B (M). \u041E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D \u0441\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440\u0434\u0456\u04A3 \u043A\u0435\u043C\u0456\u043D\u0434\u0435 \u0431\u0456\u0440\u0435\u0443\u0456\u043D\u0434\u0435 \u0442\u043E\u043B\u044B\u049B \u043A\u04E9\u043B\u0435\u043C\u0434\u0435 \u0430\u043B\u044B\u043D\u0443\u044B \u0442\u0438\u0456\u0441.",example:"\u0411\u0430\u0440\u043B\u044B\u049B \u0440\u043E\u043C\u0431\u0442\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 (M \u2013 P). \u0411\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0440\u043E\u043C\u0431 (S \u2013 M). \u21D2 \u0411\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B\u04A3 \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440 (S \u2013 P)."},"\u041C\u043E\u0434\u0443\u0441 \u043F\u043E\u043D\u0435\u043D\u0441":{full:"\u041C\u043E\u0434\u0443\u0441 \u043F\u043E\u043D\u0435\u043D\u0441 \u2013 \xAB\u043D\u0435\u0433\u0456\u0437\u0434\u0456 \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u0443\xBB \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u0448\u0430\u0440\u0442\u0442\u044B \u043F\u0430\u0439\u044B\u043C \u043C\u0435\u043D \u043E\u043D\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0456 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0441\u0430, \u0441\u0430\u043B\u0434\u0430\u0440\u044B \u0434\u0430 \u0430\u049B\u0438\u049B\u0430\u0442. \u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0434\u044B \u049B\u043E\u043B\u0434\u0430\u043D\u0443 \u0434\u04D9\u043B \u043E\u0441\u044B \u0441\u0445\u0435\u043C\u0430\u043C\u0435\u043D \u0436\u04AF\u0440\u0435\u0434\u0456.",example:"\u0415\u0433\u0435\u0440 \u0441\u0430\u043D 9-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043B 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. 81 \u0441\u0430\u043D\u044B 9-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456. \u21D2 81 \u0441\u0430\u043D\u044B 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456."},"\u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442":{full:"\u041A\u0432\u0430\u0434\u0440\u0430\u0442\u0442\u044B\u04A3 \u0442\u04E9\u0431\u0435\u043B\u0435\u0440\u0456\u043D\u0434\u0435 A, E, I, O \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u044B, \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u0430\u0440\u044B \u043C\u0435\u043D \u0434\u0438\u0430\u0433\u043E\u043D\u0430\u043B\u044C\u0434\u0430\u0440\u044B\u043D\u0434\u0430 \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B, \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B\u043B\u044B\u049B, \u0431\u0430\u0493\u044B\u043D\u044B\u0448\u0442\u044B\u043B\u044B\u049B, \u0456\u0448\u0456\u043D\u0430\u0440\u0430 \u0441\u04D9\u0439\u043A\u0435\u0441\u0442\u0456\u043A \u049B\u0430\u0442\u044B\u043D\u0430\u0441\u0442\u0430\u0440\u044B \u043E\u0440\u043D\u0430\u043B\u0430\u0441\u0430\u0434\u044B.",example:"A: \xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0436\u0430\u0439 \u0441\u0430\u043D \u0442\u0430\u049B\xBB \u2013 \u0436\u0430\u043B\u0493\u0430\u043D \u21D2 \u043E\u043D\u044B\u04A3 \u049B\u0430\u0439\u0448\u044B\u0441\u044B O: \xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0436\u0430\u0439 \u0441\u0430\u043D\u0434\u0430\u0440 \u0442\u0430\u049B \u0435\u043C\u0435\u0441\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442 (2)."},\u0418\u043D\u0434\u0443\u043A\u0446\u0438\u044F:{full:"\u0422\u043E\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u0434\u0430 \u043A\u043B\u0430\u0441\u0441\u0442\u044B\u04A3 \u0431\u0430\u0440\u043B\u044B\u049B \u044D\u043B\u0435\u043C\u0435\u043D\u0442\u0456 \u0442\u0435\u043A\u0441\u0435\u0440\u0456\u043B\u0435\u0434\u0456 \u2013 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0430\u049B\u0438\u049B\u0430\u0442; \u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u0434\u0430 \u0442\u0435\u043A \u0431\u04E9\u043B\u0456\u0433\u0456 \u2013 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u044B\u049B\u0442\u0438\u043C\u0430\u043B, \u043E\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u043A\u0435\u0440\u0435\u043A.",example:"n\xB2 + n + 41 \u04E9\u0440\u043D\u0435\u0433\u0456 n = 1, \u2026, 39 \u04AF\u0448\u0456\u043D \u0436\u0430\u0439 \u0441\u0430\u043D \u0431\u0435\u0440\u0435\u0434\u0456, \u0431\u0456\u0440\u0430\u049B n = 40 \u0431\u043E\u043B\u0493\u0430\u043D\u0434\u0430 1681 = 41\xB2 \u2013 \u0442\u043E\u043B\u044B\u043C\u0441\u044B\u0437 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u043D\u044B\u04A3 \u049B\u0430\u0442\u0435\u0441\u0456."},"\u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u0441\u0443\u0431\u044A\u0435\u043A\u0442":{full:"\u0421\u0443\u0431\u044A\u0435\u043A\u0442 \u043F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \xAB\u043D\u0435 \u0442\u0443\u0440\u0430\u043B\u044B\xBB \u0431\u04E9\u043B\u0456\u0433\u0456; \u043E\u043D\u044B\u04A3 \u043A\u04E9\u043B\u0435\u043C\u0456 (\u0431\u0430\u0440\u043B\u044B\u0493\u044B \u043C\u0430, \u043A\u0435\u0439\u0431\u0456\u0440\u0456 \u043C\u0435) \u043F\u0430\u0439\u044B\u043C\u043D\u044B\u04A3 \u0441\u0430\u043D\u044B\u043D \u0430\u043D\u044B\u049B\u0442\u0430\u0439\u0434\u044B.",example:"\xAB\u0428\u0435\u04A3\u0431\u0435\u0440\u0434\u0456\u04A3 \u0434\u0438\u0430\u043C\u0435\u0442\u0440\u0456 \u2013 \u0435\u04A3 \u04AF\u043B\u043A\u0435\u043D \u0445\u043E\u0440\u0434\u0430\xBB \u043F\u0430\u0439\u044B\u043C\u044B\u043D\u0434\u0430 S = \xAB\u0448\u0435\u04A3\u0431\u0435\u0440\u0434\u0456\u04A3 \u0434\u0438\u0430\u043C\u0435\u0442\u0440\u0456\xBB."},"\u041B\u043E\u0433\u0438\u043A\u0430\u043B\u044B\u049B \u043F\u0440\u0435\u0434\u0438\u043A\u0430\u0442":{full:"\u041F\u0440\u0435\u0434\u0438\u043A\u0430\u0442 \u0441\u0443\u0431\u044A\u0435\u043A\u0442\u0456\u0433\u0435 \u049B\u0430\u0442\u044B\u0441\u0442\u044B \u043C\u0430\u049B\u04B1\u043B\u0434\u0430\u043D\u0430\u0442\u044B\u043D \u043D\u0435 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u043B\u0435\u0442\u0456\u043D \u0431\u0435\u043B\u0433\u0456\u043D\u0456 \u0431\u0456\u043B\u0434\u0456\u0440\u0435\u0434\u0456. \u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u043B\u043E\u0433\u0438\u043A\u0430\u0434\u0430 P(x) \u2013 \u0430\u0439\u043D\u044B\u043C\u0430\u043B\u044B\u0441\u044B \u0431\u0430\u0440 \u043F\u0456\u043A\u0456\u0440.",example:"\xAB\u041A\u0435\u0439\u0431\u0456\u0440 \u0441\u0430\u043D\u0434\u0430\u0440 5-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456\xBB \u043F\u0430\u0439\u044B\u043C\u044B\u043D\u0434\u0430 P = \xAB5-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0442\u0456\u043D \u0441\u0430\u043D\xBB; \u0441\u0438\u043C\u0432\u043E\u043B\u0434\u044B\u049B \u0442\u04AF\u0440\u0456 \u2203x P(x)."},"\u0428\u0430\u0440\u0442\u0442\u044B \u043F\u0430\u0439\u044B\u043C":{full:"\u0428\u0430\u0440\u0442\u0442\u044B \u043F\u0430\u0439\u044B\u043C (\u0438\u043C\u043F\u043B\u0438\u043A\u0430\u0446\u0438\u044F) A \u21D2 B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043B\u0430\u0440\u0434\u044B\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0444\u043E\u0440\u043C\u0430\u0441\u044B. \u041D\u0435\u0433\u0456\u0437\u0456 \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0441\u0430, \u0438\u043C\u043F\u043B\u0438\u043A\u0430\u0446\u0438\u044F \u0430\u049B\u0438\u049B\u0430\u0442 \u0434\u0435\u043F \u0441\u0430\u043D\u0430\u043B\u0430\u0434\u044B.",example:"\xAB\u0415\u0433\u0435\u0440 \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0442\u0435\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043D\u044B\u04A3 \u0431\u0430\u0440\u043B\u044B\u049B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B 60\xB0\xBB \u2013 A \u21D2 B."},"\u0422\u0435\u04A3\u0431\u0435-\u0442\u0435\u04A3\u0434\u0456\u043A \u0437\u0430\u04A3\u044B":{full:"\u0417\u0430\u04A3 \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B \u0442\u0430\u043B\u049B\u044B\u043B\u0430\u0443 \u0431\u0430\u0440\u044B\u0441\u044B\u043D\u0434\u0430 \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u043C\u0430\u0443\u0434\u044B (\u043F\u043E\u0434\u043C\u0435\u043D\u0430 \u043F\u043E\u043D\u044F\u0442\u0438\u0439) \u0442\u0430\u043B\u0430\u043F \u0435\u0442\u0435\u0434\u0456. \u0414\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435 \u0431\u0456\u0440 \u0442\u0430\u04A3\u0431\u0430 \u0431\u0456\u0440 \u043E\u0431\u044A\u0435\u043A\u0442\u0456\u043D\u0456 \u0493\u0430\u043D\u0430 \u0431\u0435\u043B\u0433\u0456\u043B\u0435\u0443\u0456 \u043A\u0435\u0440\u0435\u043A.",example:"\xAB\u0411\u04B1\u0440\u044B\u0448\xBB \u0441\u04E9\u0437\u0456 \u0431\u0456\u0440 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435 \u0431\u0456\u0440\u0434\u0435 \u0444\u0438\u0433\u0443\u0440\u0430, \u0431\u0456\u0440\u0434\u0435 \u0433\u0440\u0430\u0434\u0443\u0441\u0442\u044B\u049B \u04E9\u043B\u0448\u0435\u043C \u043C\u0430\u0493\u044B\u043D\u0430\u0441\u044B\u043D\u0434\u0430 \u049B\u043E\u043B\u0434\u0430\u043D\u044B\u043B\u0441\u0430 \u2013 \u0437\u0430\u04A3 \u0431\u04B1\u0437\u044B\u043B\u0430\u0434\u044B."},"\u04AE\u0448\u0456\u043D\u0448\u0456\u043D\u0456\u04A3 \u0431\u043E\u043B\u043C\u0430\u0443 \u0437\u0430\u04A3\u044B":{full:"\u0417\u0430\u04A3 \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u049B\u0430\u0439\u0448\u044B \u043F\u0430\u0439\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u0430\u0440\u0430\u043B\u044B\u049B \u043D\u04B1\u0441\u049B\u0430\u0441\u044B \u0436\u043E\u049B. \u041E\u043B \u049B\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443 \u04D9\u0434\u0456\u0441\u0456\u043D\u0434\u0435 \xAB\u0442\u0435\u0437\u0438\u0441 \u2013 \u043D\u0435 \u0430\u049B\u0438\u049B\u0430\u0442, \u043D\u0435 \u0436\u0430\u043B\u0493\u0430\u043D\xBB \u0434\u0435\u0433\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0493\u0430 \u043D\u0435\u0433\u0456\u0437 \u0431\u0435\u0440\u0435\u0434\u0456.",example:"A \u2228 \xACA: \xABn \u2013 \u0436\u04B1\u043F \u0441\u0430\u043D\xBB \u043D\u0435\u043C\u0435\u0441\u0435 \xABn \u2013 \u0436\u04B1\u043F \u0441\u0430\u043D \u0435\u043C\u0435\u0441\xBB \u2013 \u04AF\u0448\u0456\u043D\u0448\u0456 \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u043A \u0436\u043E\u049B."},"\u0416\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456 \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u0443 \u0437\u0430\u04A3\u044B":{full:"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u0434\u0430 \u04D9\u0440 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0493\u0430, \u0430\u043D\u044B\u049B\u0442\u0430\u043C\u0430\u0493\u0430 \u043D\u0435\u043C\u0435\u0441\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0433\u0435\u043D \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0493\u0430 \u0441\u0456\u043B\u0442\u0435\u043C\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u043D\u0435\u0433\u0456\u0437\u0434\u0435\u043B\u0435\u0434\u0456. \u041C\u0435\u043A\u0442\u0435\u043F\u0442\u0435 \u0431\u04B1\u043B \xAB\u041F\u0430\u0439\u044B\u043C \u2013 \u041D\u0435\u0433\u0456\u0437\u0434\u0435\u043C\u0435\xBB \u043A\u0435\u0441\u0442\u0435\u0441\u0456\u043C\u0435\u043D \u04AF\u0439\u0440\u0435\u0442\u0456\u043B\u0435\u0434\u0456.",example:"\u22201 = \u22202. \u041D\u0435\u0433\u0456\u0437\u0434\u0435\u043C\u0435: \u0432\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430."},\u0421\u0456\u043B\u0442\u0435\u043C\u0435:{full:"\u0421\u0456\u043B\u0442\u0435\u043C\u0435\u043B\u0435\u0440 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u044B\u043F, \u043E\u0439\u049B\u043E\u0440\u044B\u0442\u0443 \u0435\u0440\u0435\u0436\u0435\u0441\u0456 \u0441\u0430\u049B\u0442\u0430\u043B\u0441\u0430 \u0493\u0430\u043D\u0430 \u0434\u0435\u0434\u0443\u043A\u0442\u0438\u0432\u0442\u0456\u043A \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0430\u049B\u0438\u049B\u0430\u0442.",example:"\u0421\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u0434\u0435 \xAB\u0411\u0430\u0440\u043B\u044B\u049B \u043A\u0432\u0430\u0434\u0440\u0430\u0442 \u2013 \u0440\u043E\u043C\u0431\xBB \u0436\u04D9\u043D\u0435 \xAB\u0411\u0430\u0440\u043B\u044B\u049B \u0440\u043E\u043C\u0431 \u2013 \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u043E\u0433\u0440\u0430\u043C\u043C\xBB \u2013 \u0435\u043A\u0456 \u0441\u0456\u043B\u0442\u0435\u043C\u0435."},\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F:{full:"\u0414\u0435\u0434\u0443\u043A\u0446\u0438\u044F \u043C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0442\u04AF\u0440\u0456; \u043E\u043B \u0436\u0430\u04A3\u0430 \u0444\u0430\u043A\u0442\u0456\u043D\u0456 \u0430\u0448\u043F\u0430\u0439\u0434\u044B, \u0431\u0456\u0440\u0430\u049B \u0436\u0430\u043B\u043F\u044B \u0431\u0456\u043B\u0456\u043C\u0434\u0435 \u0436\u0430\u0441\u044B\u0440\u044B\u043D \u0442\u04B1\u0440\u0493\u0430\u043D \u0441\u0430\u043B\u0434\u0430\u0440\u0434\u044B \u0430\u0439\u049B\u044B\u043D\u0434\u0430\u0439\u0434\u044B.",example:"\u041A\u0435\u0437 \u043A\u0435\u043B\u0433\u0435\u043D \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B 180\xB0 \u21D2 \u0442\u0456\u043A\u0431\u04B1\u0440\u044B\u0448\u0442\u044B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u0441\u04AF\u0439\u0456\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B 90\xB0."},"\u041E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D":{full:"\u041E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D \u04AF\u043B\u043A\u0435\u043D \u0436\u04D9\u043D\u0435 \u043A\u0456\u0448\u0456 \u0442\u0435\u0440\u043C\u0438\u043D\u0434\u0435\u0440\u0434\u0456 \u0431\u0430\u0439\u043B\u0430\u043D\u044B\u0441\u0442\u044B\u0440\u0430\u0434\u044B. \u041E\u043D\u044B\u04A3 \u043E\u0440\u043D\u044B\u043D\u0430 \u049B\u0430\u0440\u0430\u0439 \u0441\u0438\u043B\u043B\u043E\u0433\u0438\u0437\u043C\u043D\u0456\u04A3 \u0442\u04E9\u0440\u0442 \u0444\u0438\u0433\u0443\u0440\u0430\u0441\u044B \u0430\u0436\u044B\u0440\u0430\u0442\u044B\u043B\u0430\u0434\u044B.",example:"\u0411\u0430\u0440\u043B\u044B\u049B M \u2013 P; \u0431\u0430\u0440\u043B\u044B\u049B S \u2013 M \u21D2 \u0431\u0430\u0440\u043B\u044B\u049B S \u2013 P. \u041C\u04B1\u043D\u0434\u0430 M \u2013 \u043E\u0440\u0442\u0430\u04A3\u0493\u044B \u0442\u0435\u0440\u043C\u0438\u043D."},"\u041C\u043E\u0434\u0443\u0441 \u0442\u043E\u043B\u043B\u0435\u043D\u0441":{full:"\u041C\u043E\u0434\u0443\u0441 \u0442\u043E\u043B\u043B\u0435\u043D\u0441 \u2013 \xAB\u0441\u0430\u043B\u0434\u0430\u0440\u0434\u044B \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443\xBB \u0435\u0440\u0435\u0436\u0435\u0441\u0456: \u0441\u0430\u043B\u0434\u0430\u0440 \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0441\u0430, \u043D\u0435\u0433\u0456\u0437 \u0434\u0435 \u0436\u0430\u043B\u0493\u0430\u043D. \u0411\u04B1\u043B \u043A\u043E\u043D\u0442\u0440\u0430\u043F\u043E\u0437\u0438\u0446\u0438\u044F \u0437\u0430\u04A3\u044B\u043D\u0430 \u0441\u04AF\u0439\u0435\u043D\u0435\u0434\u0456.",example:"\u0415\u0433\u0435\u0440 \u0441\u0430\u043D 4-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043B \u0436\u04B1\u043F. 15 \u2013 \u0436\u04B1\u043F \u0435\u043C\u0435\u0441. \u21D2 15 \u0441\u0430\u043D\u044B 4-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0431\u0435\u0439\u0434\u0456."},\u0410\u043D\u0430\u043B\u043E\u0433\u0438\u044F:{full:"\u0410\u043D\u0430\u043B\u043E\u0433\u0438\u044F \u0436\u0430\u04A3\u0430 \u0431\u043E\u043B\u0436\u0430\u043C (\u0433\u0438\u043F\u043E\u0442\u0435\u0437\u0430) \u0442\u0430\u0431\u0443\u0493\u0430 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456, \u0431\u0456\u0440\u0430\u049B \u043E\u043D\u044B\u04A3 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B\u043D \u043C\u0456\u043D\u0434\u0435\u0442\u0442\u0456 \u0442\u04AF\u0440\u0434\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u043D\u0435\u043C\u0435\u0441\u0435 \u0436\u043E\u049B\u049B\u0430 \u0448\u044B\u0493\u0430\u0440\u0443 \u043A\u0435\u0440\u0435\u043A.",example:"\u0416\u0430\u0437\u044B\u049B\u0442\u044B\u049B\u0442\u0430: \u0448\u0435\u04A3\u0431\u0435\u0440\u0434\u0456\u04A3 \u0436\u0430\u043D\u0430\u043C\u0430\u0441\u044B \u0440\u0430\u0434\u0438\u0443\u0441\u049B\u0430 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440. \u041A\u0435\u04A3\u0456\u0441\u0442\u0456\u043A\u0442\u0435: \u0448\u0430\u0440\u0434\u044B\u04A3 \u0436\u0430\u043D\u0430\u043C\u0430 \u0436\u0430\u0437\u044B\u049B\u0442\u044B\u0493\u044B \u0440\u0430\u0434\u0438\u0443\u0441\u049B\u0430 \u043F\u0435\u0440\u043F\u0435\u043D\u0434\u0438\u043A\u0443\u043B\u044F\u0440."},"\u041C\u0430\u0442\u0435\u043C\u0430\u0442\u0438\u043A\u0430\u043B\u044B\u049B \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F":{full:"\u04D8\u0434\u0456\u0441 \u0435\u043A\u0456 \u049B\u0430\u0434\u0430\u043C\u043D\u0430\u043D \u0442\u04B1\u0440\u0430\u0434\u044B: \u0431\u0430\u0437\u0438\u0441 (n = 1) \u0436\u04D9\u043D\u0435 \u0438\u043D\u0434\u0443\u043A\u0446\u0438\u044F\u043B\u044B\u049B \u04E9\u0442\u0443 (P(k) \u21D2 P(k + 1)). \u041E\u043B \u043D\u0430\u0442\u0443\u0440\u0430\u043B \u0441\u0430\u043D\u0434\u0430\u0440\u0434\u044B\u04A3 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0441\u044B\u043D\u0430 \u0441\u04AF\u0439\u0435\u043D\u0435\u0434\u0456, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B \u0430\u049B\u0438\u049B\u0430\u0442.",example:"1 + 2 + \u2026 + n = n(n + 1)/2. \u0411\u0430\u0437\u0438\u0441: 1 = 1. \u04E8\u0442\u0443: k(k + 1)/2 + (k + 1) = (k + 1)(k + 2)/2."},\u0410\u043A\u0441\u0438\u043E\u043C\u0430:{full:"\u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0436\u04AF\u0439\u0435\u0441\u0456 \u0442\u04D9\u0443\u0435\u043B\u0441\u0456\u0437, \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B\u0441\u044B\u0437 \u0436\u04D9\u043D\u0435 \u0442\u043E\u043B\u044B\u049B \u0431\u043E\u043B\u0443\u044B \u0442\u0438\u0456\u0441. \u0410\u043A\u0441\u0438\u043E\u043C\u0430\u043B\u0430\u0440 \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B \u04B1\u0493\u044B\u043C\u0434\u0430\u0440\u0434\u044B\u04A3 \u049B\u0430\u0441\u0438\u0435\u0442\u0442\u0435\u0440\u0456\u043D \u0431\u0435\u043A\u0456\u0442\u0456\u043F, \u0442\u0435\u043E\u0440\u0438\u044F\u043D\u044B\u04A3 \u0456\u0440\u0433\u0435\u0442\u0430\u0441\u044B\u043D \u049B\u0430\u043B\u0430\u0439\u0434\u044B.",example:"\u0415\u043A\u0456 \u043D\u04AF\u043A\u0442\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u0431\u0456\u0440 \u0436\u04D9\u043D\u0435 \u0442\u0435\u043A \u0431\u0456\u0440 \u0442\u04AF\u0437\u0443 \u04E9\u0442\u0435\u0434\u0456: \u2200A, B (A \u2260 B) \u2203! a : A \u2208 a, B \u2208 a."},\u0422\u0435\u043E\u0440\u0435\u043C\u0430:{full:"\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430 \u0442\u04AF\u0441\u0456\u043D\u0434\u0456\u0440\u043C\u0435 \u0431\u04E9\u043B\u0456\u043A, \u0448\u0430\u0440\u0442 \u0436\u04D9\u043D\u0435 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0430\u0436\u044B\u0440\u0430\u0442\u044B\u043B\u0430\u0434\u044B. \u041A\u0435\u0441\u0456\u043C\u0434\u0456 \u0436\u04D9\u043D\u0435 \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u04AF\u0440\u0434\u0435 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u0434\u0430\u043B\u0430\u0434\u044B; \u0448\u0430\u0440\u0442\u0442\u044B \u0442\u04AF\u0440\u0456 \u049B\u04B1\u0440\u044B\u043B\u044B\u043C\u0434\u044B \u0430\u0439\u049B\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0435\u0434\u0456.",example:"\u2200x \u2208 M (A(x) \u21D2 B(x)): \xAB\u0415\u0433\u0435\u0440 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0432\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C \u0431\u043E\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u043E\u043B\u0430\u0440 \u0442\u0435\u04A3\xBB."},\u041B\u0435\u043C\u043C\u0430:{full:"\u041B\u0435\u043C\u043C\u0430 \u04E9\u0437 \u0431\u0435\u0442\u0456\u043D\u0448\u0435 \u043C\u0430\u04A3\u044B\u0437\u044B \u0430\u0437, \u0431\u0456\u0440\u0430\u049B \u043D\u0435\u0433\u0456\u0437\u0433\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0456\u043D \u0436\u0435\u04A3\u0456\u043B\u0434\u0435\u0442\u0435\u0442\u0456\u043D \u043A\u04E9\u043C\u0435\u043A\u0448\u0456 \u0442\u04B1\u0436\u044B\u0440\u044B\u043C.",example:"\u0406\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D \u0431\u04B1\u0440\u044B\u0448 \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0430\u043B\u0434\u044B\u043D\u0434\u0430 \xAB\u0446\u0435\u043D\u0442\u0440\u043B\u0456\u043A \u0431\u04B1\u0440\u044B\u0448 \u0434\u043E\u0493\u0430\u043C\u0435\u043D \u04E9\u043B\u0448\u0435\u043D\u0435\u0434\u0456\xBB \u0442\u04B1\u0436\u044B\u0440\u044B\u043C\u044B \u043B\u0435\u043C\u043C\u0430 \u0440\u0435\u0442\u0456\u043D\u0434\u0435 \u0430\u043B\u044B\u043D\u0430\u0434\u044B."},"\u041A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430":{full:"\u041A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0442\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0430\u049B\u0438\u049B\u0430\u0442 \u0431\u043E\u043B\u0441\u0430 \u0434\u0430, \u0436\u0430\u043B\u0493\u0430\u043D \u0431\u043E\u043B\u0443\u044B \u043C\u04AF\u043C\u043A\u0456\u043D, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u043E\u043B \u0431\u04E9\u043B\u0435\u043A \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0435\u0434\u0456.",example:"\u0422\u0443\u0440\u0430: \xAB\u0412\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0442\u0435\u04A3\xBB \u2013 \u0430\u049B\u0438\u049B\u0430\u0442. \u041A\u0435\u0440\u0456: \xAB\u0422\u0435\u04A3 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440 \u0432\u0435\u0440\u0442\u0438\u043A\u0430\u043B\u044C\xBB \u2013 \u0436\u0430\u043B\u0493\u0430\u043D."},"\u041A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430":{full:"\u041A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u0442\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043C\u0435\u043D \u04D9\u0440\u049B\u0430\u0448\u0430\u043D \u043C\u04D9\u043D\u0434\u0435\u0441, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u0442\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u043E\u0440\u043D\u044B\u043D\u0430 \u043E\u043D\u044B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B.",example:"\u0422\u0443\u0440\u0430: \xAB\u0415\u0433\u0435\u0440 n\xB2 \u0442\u0430\u049B \u0431\u043E\u043B\u0441\u0430, n \u0442\u0430\u049B\xBB. \u041A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B: \xAB\u0415\u0433\u0435\u0440 n \u0436\u04B1\u043F \u0431\u043E\u043B\u0441\u0430, n\xB2 \u0436\u04B1\u043F\xBB \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u043E\u04A3\u0430\u0439."},\u0422\u0435\u0437\u0438\u0441:{full:"\u0422\u0435\u0437\u0438\u0441 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0431\u0430\u0440\u044B\u0441\u044B\u043D\u0434\u0430 \u04E9\u0437\u0433\u0435\u0440\u043C\u0435\u0443\u0456 \u0442\u0438\u0456\u0441; \xAB\u0442\u0435\u0437\u0438\u0441\u0442\u0456 \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u0443\xBB \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435\u0433\u0456 \u0436\u0438\u0456 \u049B\u0430\u0442\u0435.",example:"\xAB\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u043C\u0435\u0434\u0438\u0430\u043D\u0430\u043B\u0430\u0440\u044B \u0431\u0456\u0440 \u043D\u04AF\u043A\u0442\u0435\u0434\u0435 \u049B\u0438\u044B\u043B\u044B\u0441\u0430\u0434\u044B\xBB \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u043D\u0435\u0442\u0456\u043D \u0442\u0435\u0437\u0438\u0441."},\u0410\u043D\u0430\u043B\u0438\u0437:{full:"\u0410\u043D\u0430\u043B\u0438\u0437 (\u0442\u0430\u043B\u0434\u0430\u0443) \xAB\u043D\u0435 \u0431\u0435\u043B\u0433\u0456\u043B\u0456 \u0431\u043E\u043B\u0441\u0430, \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u0448\u044B\u0493\u0430\u0440 \u0435\u0434\u0456?\xBB \u0434\u0435\u0433\u0435\u043D \u0441\u04B1\u0440\u0430\u049B\u043F\u0435\u043D \u0436\u04AF\u0440\u0435\u0434\u0456. \u041E\u043B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443 \u0436\u043E\u0441\u043F\u0430\u0440\u044B\u043D \u0442\u0430\u0431\u0443\u0493\u0430 \u043A\u04E9\u043C\u0435\u043A\u0442\u0435\u0441\u0435\u0434\u0456, \u0430\u043B \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u0441\u0438\u043D\u0442\u0435\u0437 \u0442\u04AF\u0440\u0456\u043D\u0434\u0435 \u0436\u0430\u0437\u0430\u0434\u044B.",example:"AC + CB = AB \u0435\u043A\u0435\u043D\u0456\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0443 \u04AF\u0448\u0456\u043D C \u043D\u04AF\u043A\u0442\u0435\u0441\u0456 AB \u043A\u0435\u0441\u0456\u043D\u0434\u0456\u0441\u0456\u043D\u0434\u0435 \u0436\u0430\u0442\u0430\u0442\u044B\u043D\u044B\u043D \u043A\u04E9\u0440\u0441\u0435\u0442\u0443 \u0436\u0435\u0442\u043A\u0456\u043B\u0456\u043A\u0442\u0456."},"\u049A\u0430\u0440\u0441\u044B \u0436\u043E\u0440\u0443":{full:"\u04D8\u0434\u0456\u0441\u0442\u0456\u04A3 \u043A\u0435\u0437\u0435\u04A3\u0434\u0435\u0440\u0456: \u0442\u0435\u0437\u0438\u0441\u043A\u0435 \u049B\u0430\u0440\u0441\u044B \u04B1\u0439\u0493\u0430\u0440\u044B\u043C \u0436\u0430\u0441\u0430\u0443, \u043E\u0434\u0430\u043D \u0441\u0430\u043B\u0434\u0430\u0440 \u0448\u044B\u0493\u0430\u0440\u0443, \u0431\u0435\u043B\u0433\u0456\u043B\u0456 \u0430\u049B\u0438\u049B\u0430\u0442\u043F\u0435\u043D \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B \u0442\u0430\u0431\u0443, \u04AF\u0448\u0456\u043D\u0448\u0456\u043D\u0456\u04A3 \u0431\u043E\u043B\u043C\u0430\u0443 \u0437\u0430\u04A3\u044B \u0431\u043E\u0439\u044B\u043D\u0448\u0430 \u0442\u0435\u0437\u0438\u0441\u0442\u0456 \u049B\u0430\u0431\u044B\u043B\u0434\u0430\u0443.",example:"\u221A2 \u0440\u0430\u0446\u0438\u043E\u043D\u0430\u043B \u0434\u0435\u043F \u0436\u043E\u0440\u0438\u044B\u049B: \u221A2 = p/q, \u0415\u04AE\u041E\u0411(p, q) = 1. \u041E\u043D\u0434\u0430 p\xB2 = 2q\xB2 \u21D2 p, q \u0435\u043A\u0435\u0443\u0456 \u0434\u0435 \u0436\u04B1\u043F \u2013 \u049B\u0430\u0439\u0448\u044B\u043B\u044B\u049B."},\u041F\u043E\u0441\u0442\u0443\u043B\u0430\u0442:{full:"\u0415\u0432\u043A\u043B\u0438\u0434\u0442\u0456\u04A3 \xAB\u041D\u0435\u0433\u0456\u0437\u0434\u0435\u0440\u0456\u043D\u0434\u0435\xBB \u043F\u043E\u0441\u0442\u0443\u043B\u0430\u0442\u0442\u0430\u0440 \u2013 \u0441\u0430\u043B\u0443 \u043C\u04AF\u043C\u043A\u0456\u043D\u0434\u0456\u0433\u0456\u043D \u0431\u0435\u043A\u0456\u0442\u0435\u0442\u0456\u043D \u0442\u0430\u043B\u0430\u043F\u0442\u0430\u0440. \u049A\u0430\u0437\u0456\u0440\u0433\u0456 \u0430\u043A\u0441\u0438\u043E\u043C\u0430\u0442\u0438\u043A\u0430\u0434\u0430 \u0430\u043A\u0441\u0438\u043E\u043C\u0430 \u043C\u0435\u043D \u043F\u043E\u0441\u0442\u0443\u043B\u0430\u0442 \u0430\u0439\u044B\u0440\u043C\u0430\u0441\u044B \u0436\u043E\u0439\u044B\u043B\u0493\u0430\u043D.",example:"\u0415\u0432\u043A\u043B\u0438\u0434\u0442\u0456\u04A3 V \u043F\u043E\u0441\u0442\u0443\u043B\u0430\u0442\u044B: \u0442\u04AF\u0437\u0443\u0434\u0435\u043D \u0442\u044B\u0441 \u043D\u04AF\u043A\u0442\u0435 \u0430\u0440\u049B\u044B\u043B\u044B \u043E\u0493\u0430\u043D \u043F\u0430\u0440\u0430\u043B\u043B\u0435\u043B\u044C \u0431\u0456\u0440 \u0493\u0430\u043D\u0430 \u0442\u04AF\u0437\u0443 \u0436\u04AF\u0440\u0433\u0456\u0437\u0443\u0433\u0435 \u0431\u043E\u043B\u0430\u0434\u044B."},\u0421\u0430\u043B\u0434\u0430\u0440:{full:"\u0421\u0430\u043B\u0434\u0430\u0440 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D \u0431\u0456\u0440\u043D\u0435\u0448\u0435 \u049B\u0430\u0434\u0430\u043C\u043C\u0435\u043D \u0493\u0430\u043D\u0430 \u0448\u044B\u0493\u0430\u0434\u044B, \u0441\u043E\u043D\u0434\u044B\u049B\u0442\u0430\u043D \u043E\u043D\u044B\u04A3 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0456 \u049B\u044B\u0441\u049B\u0430 \u0431\u043E\u043B\u0430\u0434\u044B.",example:"\u04AE\u0448\u0431\u04B1\u0440\u044B\u0448 \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B \u0442\u0443\u0440\u0430\u043B\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430\u043D: \u0442\u0435\u04A3 \u049B\u0430\u0431\u044B\u0440\u0493\u0430\u043B\u044B \u04AF\u0448\u0431\u04B1\u0440\u044B\u0448\u0442\u044B\u04A3 \u04D9\u0440 \u0431\u04B1\u0440\u044B\u0448\u044B 60\xB0."},"\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u0448\u0430\u0440\u0442\u044B":{full:"\u0428\u0430\u0440\u0442 \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0435 \u043F\u0430\u0439\u0434\u0430\u043B\u0430\u043D\u0443\u0493\u0430 \u0431\u043E\u043B\u0430\u0442\u044B\u043D \u0431\u0435\u0440\u0456\u043B\u0433\u0435\u043D\u0434\u0435\u0440. \u0428\u0430\u0440\u0442\u0442\u044B\u04A3 \u0431\u0430\u0440\u043B\u044B\u049B \u0431\u04E9\u043B\u0456\u0433\u0456\u043D \u049B\u043E\u043B\u0434\u0430\u043D\u0431\u0430\u0443 \u043A\u04E9\u0431\u0456\u043D\u0435 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456\u04A3 \u0442\u043E\u043B\u044B\u049B \u0435\u043C\u0435\u0441\u0442\u0456\u0433\u0456\u043D \u0431\u0456\u043B\u0434\u0456\u0440\u0435\u0434\u0456.",example:"\xAB\u0415\u0433\u0435\u0440 \u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0448\u0435\u04A3\u0431\u0435\u0440\u0433\u0435 \u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0441\u0430, \u043E\u043D\u0434\u0430 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0431\u04B1\u0440\u044B\u0448\u0442\u0430\u0440\u044B\u043D\u044B\u04A3 \u049B\u043E\u0441\u044B\u043D\u0434\u044B\u0441\u044B 180\xB0\xBB \u2013 \u0448\u0430\u0440\u0442: \xAB\u0442\u04E9\u0440\u0442\u0431\u04B1\u0440\u044B\u0448 \u0448\u0435\u04A3\u0431\u0435\u0440\u0433\u0435 \u0456\u0448\u0442\u0435\u0439 \u0441\u044B\u0437\u044B\u043B\u0493\u0430\u043D\xBB."},"\u0422\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u0441\u044B":{full:"\u049A\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B \u2013 \u0434\u04D9\u043B\u0435\u043B\u0434\u0435\u0443\u0434\u0456 \u049B\u0430\u0436\u0435\u0442 \u0435\u0442\u0435\u0442\u0456\u043D \u0442\u04B1\u0436\u044B\u0440\u044B\u043C; \xAB\u043E\u043D\u0434\u0430\xBB \u0441\u04E9\u0437\u0456\u043D\u0435\u043D \u043A\u0435\u0439\u0456\u043D \u0442\u04B1\u0440\u0430\u0434\u044B.",example:"\u0421\u043E\u043B \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u0434\u0430 \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B: \u2220A + \u2220C = 180\xB0."},"\u0422\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430":{full:"\u0422\u0443\u0440\u0430 \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u2013 \u0442\u04E9\u0440\u0442 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043D\u044B\u04A3 (\u0442\u0443\u0440\u0430, \u043A\u0435\u0440\u0456, \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B, \u043A\u0435\u0440\u0456\u0433\u0435 \u049B\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B) \u0431\u0430\u0441\u0442\u0430\u043F\u049B\u044B\u0441\u044B; \u049B\u0430\u043B\u0493\u0430\u043D\u0434\u0430\u0440\u044B \u043E\u0434\u0430\u043D \u0448\u0430\u0440\u0442 \u043F\u0435\u043D \u049B\u043E\u0440\u044B\u0442\u044B\u043D\u0434\u044B\u043D\u044B \u0430\u0443\u044B\u0441\u0442\u044B\u0440\u0443 \u043D\u0435 \u0442\u0435\u0440\u0456\u0441\u0442\u0435\u0443 \u0430\u0440\u049B\u044B\u043B\u044B \u0430\u043B\u044B\u043D\u0430\u0434\u044B.",example:"A \u21D2 B: \xAB\u0415\u0433\u0435\u0440 \u0441\u0430\u043D 6-\u0493\u0430 \u0431\u04E9\u043B\u0456\u043D\u0441\u0435, \u043E\u043D\u0434\u0430 \u043E\u043B 3-\u043A\u0435 \u0431\u04E9\u043B\u0456\u043D\u0435\u0434\u0456\xBB."},"\u049A\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430":{full:"\u049A\u0430\u0440\u0430\u043C\u0430-\u049B\u0430\u0440\u0441\u044B \u0442\u0435\u043E\u0440\u0435\u043C\u0430 \u043A\u0435\u0440\u0456 \u0442\u0435\u043E\u0440\u0435\u043C\u0430\u043C\u0435\u043D \u043C\u04D9\u043D\u0434\u0435\u0441, \u0431\u0456\u0440\u0430\u049B \u0442\u0443\u0440\u0430 \u0442\u0435\
